apiVersion: v2
name: containarium-k8s
description: >
  Containarium K8s agent-box runtime — safe, SSH-accessible per-tenant agent
  pods on Kubernetes. Agents connect over SSH to a ForceCommand-pinned
  agent-box; no kube-apiserver token is mounted in the box.
type: application
# Development placeholders. The release workflow stamps both when it packages
# the chart (#2574): `version` is the release without its leading "v" and
# `appVersion` is the exact image tag (the release tag, "vX.Y.Z"), so a
# published chart always installs the daemon image of its own release. Do not
# bump these by hand.
version: 0.0.0-dev
appVersion: "latest"
keywords:
  - agent
  - mcp
  - ssh
  - kubernetes
  - security
  - agent-box
home: https://github.com/FootprintAI/Containarium
sources:
  - https://github.com/FootprintAI/Containarium
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/changes: |
    - kind: added
      description: Initial Helm chart for the Kubernetes agent-box backend
