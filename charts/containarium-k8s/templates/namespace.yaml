{{- /* Default on; set false when pre-created (#2776): the walkthroughs create this namespace by hand so the sshpiper Secrets exist before install, and Helm 3 will not adopt a namespace lacking its ownership metadata. */ -}}
{{- if and .Values.gateway.enabled .Values.gateway.createNamespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.gateway.namespace }}
  labels:
    {{- include "containarium-k8s.labels" . | nindent 4 }}
    {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
