{{- /*
daemon.jwtSecret signs every API token, so a value anyone can read in the
public chart lets anyone forge them (#3442). Refuse an empty value and the
placeholder older chart versions shipped as the default.
*/ -}}
{{- $hint := "generate one with: --set daemon.jwtSecret=\"$(openssl rand -hex 24)\"" }}
{{- $jwtSecret := required (printf "daemon.jwtSecret is required: it signs the daemon's API tokens; %s" $hint) .Values.daemon.jwtSecret }}
{{- if eq $jwtSecret "change-me-please-use-a-real-secret" }}
{{- fail (printf "daemon.jwtSecret is still the placeholder older chart versions shipped as the default, which anyone can read in the public chart and use to forge tokens; %s" $hint) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "containarium-k8s.fullname" . }}-daemon
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "containarium-k8s.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ $jwtSecret | quote }}
