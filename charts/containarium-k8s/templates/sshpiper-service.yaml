{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "containarium-k8s.fullname" . }}-sshpiper
  namespace: {{ .Values.gateway.namespace }}
  labels:
    {{- include "containarium-k8s.labels" . | nindent 4 }}
  {{- $svcAnnotations := mustMergeOverwrite (deepCopy (.Values.commonAnnotations | default dict)) (.Values.gateway.service.annotations | default dict) }}
  {{- with $svcAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    # Must match the Deployment's pod template label exactly — see the
    # comment there (#1492) for why this is the literal "sshpiper", not
    # the chart-name-prefixed variant.
    app.kubernetes.io/name: sshpiper
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: ssh
      port: {{ .Values.gateway.service.port }}
      targetPort: ssh
      protocol: TCP
      {{- if and (eq .Values.gateway.service.type "NodePort") .Values.gateway.service.nodePort }}
      nodePort: {{ .Values.gateway.service.nodePort }}
      {{- end }}
{{- end }}
