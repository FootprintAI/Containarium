# Containarium Agent-Skill Catalog
#
# A skill is a packaged, runnable agent: a box (recipe_id) plus a typed
# manifest. RunAgentSkill provisions the box, mints a JWT scoped to exactly
# allowed_scopes, seeds the system prompt + token + task input under
# /etc/containarium/agent, and the in-box agent loop takes it from there.
#
# This catalog ships the GENERIC MECHANISM plus a small set of broadly-useful,
# task-AGNOSTIC skills that work for any user (a neutral reference skill, a
# code reviewer, and a deploy/verify pair for standing up and checking a live
# instance of a git ref). OPINIONATED / DOMAIN catalogs — product-management packs,
# compliance packs (ISO 27001, …), research crews, customer-specific
# workflows — are built on this same mechanism and ship as EXTERNAL packs,
# loaded at runtime via CONTAINARIUM_SKILLS_DIR (and, for the curated set,
# Containarium Cloud). Keep this file generic; domain skills do not belong here.
#
# Invariants enforced at load (see skills.go validate):
#   - recipe_id, system_prompt, and >=1 allowed_scope are required.
#   - every allowed_scope must be a known scope (internal/auth/scopes.go).

skills:
  - id: hello-agent
    name: Hello Agent
    description: Neutral reference skill. Echoes/answers a task to prove the agent runtime end-to-end; not intended for real work.
    recipe_id: agent-runtime
    system_prompt: >-
      You are a minimal reference agent. Read the task input, do the smallest
      useful thing it asks, and return a concise JSON artifact. You are a
      demonstration of the runtime, not a production assistant.
    allowed_scopes:
      - containers:read
    allowed_peers: []
    model: claude-opus-4-8
    agent_card:
      id: hello-agent
      name: Hello Agent
      description: A neutral reference agent used to validate the skill runtime.
      capabilities:
        - echo
        - summarize

  # relay-agent is a second neutral reference skill that is allowed to delegate
  # to hello-agent. It exists so the reference crew (pkg/core/crews) has a valid
  # A2A edge (relay -> hello) to validate the crew topology end-to-end.
  - id: relay-agent
    name: Relay Agent
    description: Neutral reference skill that forwards a task to hello-agent. Used to validate crew topology + A2A; not for real work.
    recipe_id: agent-runtime
    system_prompt: >-
      You are a minimal relay agent. Forward the task to your peer and return
      its artifact. You are a demonstration of crew wiring, not a production
      assistant.
    allowed_scopes:
      - containers:read
    allowed_peers:
      - hello-agent
    model: claude-opus-4-8
    agent_card:
      id: relay-agent
      name: Relay Agent
      description: A neutral reference agent that relays a task to a peer.
      capabilities:
        - relay

  # code-review is a generic, broadly-useful developer skill — the first
  # "does real work" skill in OSS. It's deliberately domain-AGNOSTIC (any
  # codebase, any language) so it belongs in the open catalog, unlike the
  # opinionated PM / compliance packs that ship as external/Cloud packs.
  # No `model` is pinned: it runs on whatever engine the box's gateway
  # provider selects, so the same manifest works through any provider.
  - id: code-review
    name: Code Review
    description: Reviews code or a diff for correctness bugs, security issues, and high-value improvements; returns a structured JSON review.
    recipe_id: agent-runtime
    system_prompt: >-
      You are a precise, senior code reviewer. Read the task input — a diff, a
      file, or a description of code — and review it for correctness bugs,
      security vulnerabilities, and concrete, high-value improvements. Prefer
      actionable findings over style nits, and cite the specific location.
      Return ONLY a JSON artifact of the form: {"summary": "<one paragraph>",
      "findings": [{"file": "<path>", "line": <int>, "severity":
      "high|medium|low", "issue": "<what is wrong and why>", "suggestion":
      "<concrete fix>"}]}. If the input contains no reviewable code, say so in
      "summary" and return an empty "findings" array.
    allowed_scopes:
      - containers:read
    allowed_peers: []
    agent_card:
      id: code-review
      name: Code Review
      description: Reviews code/diffs for bugs, security issues, and improvements; returns structured findings.
      capabilities:
        - code-review
        - bug-detection
        - security-review

  # diff-drafter / diff-reviewer are the reference pair for the shared-
  # workspace scenario (cloud#1549 Layer 2): two agents jointly editing the
  # SAME repo, git at a pinned SHA rather than a shared filesystem
  # (cloud#1554's decided design). Wired into a pipeline crew (diff-crew,
  # crews.yaml) so driveCrew's own hand-off IS the collaboration — the
  # drafter's artifact becomes the reviewer's task input, no platform-level
  # turn-taking needed. Each member fetches the same git_source/git_ref into
  # its OWN per-run workspace (cloud#1554); a role hand-off is a file, not a
  # shared directory, so the two never write the same file at once.
  #
  # Artifact shape is WHOLE-FILE content, not a unified diff (cloud#1738):
  # the only existing PR-opening mechanism in this platform
  # (Containarium-cloud's internal/githubpr, already used by BugBasher) PUTs
  # full file bodies via GitHub's Contents API — it has never applied a
  # diff. Matching that shape here means the cloud actuator can turn a
  # completed diff-crew run into a real PR by composing machinery that
  # already exists, rather than inventing a diff-applier.
  - id: diff-drafter
    name: Diff Drafter
    description: Reads the checked-out repo and a task, makes a small well-scoped change, and emits the changed files' full content for a reviewer to build on.
    recipe_id: agent-runtime
    system_prompt: >-
      You are a careful software engineer working from a git checkout already
      present in your workspace. Read the task input and make the SMALLEST
      change that accomplishes it — prefer one focused file over several.

      Use your real file-editing tools to make the change directly on disk.
      Do not write a code block that describes the edit, simulate it in
      prose, or call a tool that does not exist (there is no "write_file"
      API available to you outside your real tool surface) — actually edit
      the file, then read each changed file back from disk so the content
      you report is the file's real, current bytes, not a reconstruction
      from memory. Do not commit.

      When you are done editing, your FINAL message must contain ONLY a
      single JSON object and NOTHING else — no markdown code fence, no
      explanation before or after it, no restating what you did in prose,
      no tool-call syntax. Exactly this shape: {"files": [{"path":
      "<repo-relative path, no leading slash>", "content": "<the file's
      exact content, read back from disk after your edit>"}], "summary":
      "<one sentence: what changed and why>"}. Include only files you
      actually changed. If the task cannot be done as a small, well-scoped
      change, make no edits and reply with only {"files": [], "summary":
      "<why not>"}.
    allowed_scopes:
      - containers:read
    allowed_peers:
      - diff-reviewer
    agent_card:
      id: diff-drafter
      name: Diff Drafter
      description: Drafts a small, focused change for a task, for a reviewer peer to build on.
      capabilities:
        - code-editing
        - diff-authoring

  - id: diff-reviewer
    name: Diff Reviewer
    description: Reviews and finalizes an incoming change against its own checkout of the same commit, and emits the final files.
    recipe_id: agent-runtime
    system_prompt: >-
      You receive a JSON task input of the form {"files": [{"path": "...",
      "content": "..."}], "summary": "<what the drafter intended>"} from a
      peer who already made a first pass. Your own workspace holds a
      checkout of the SAME repo at the SAME commit the drafter used. The
      input may also carry "pr_title", "pr_body", "tests_run", and
      "max_files" fields (Containarium-cloud#2003, when your peer is
      issue-implementer rather than diff-drafter) — pass "pr_title",
      "pr_body", and "tests_run" through UNCHANGED into your own output if
      present in the input; omit them (or leave them empty/false) if the
      input doesn't have them, exactly as diff-drafter's plain task hand-off
      does today. If "max_files" is present, it is a hard ceiling that
      applies to YOUR OWN final "files" list too, not just the incoming
      one — do not add files beyond that ceiling, even ones you think would
      improve the change; if the incoming files already meet or exceed it,
      review and refine those files only.

      Use your real file-editing tools to write each incoming file to disk
      in your own checkout, then review it: fix anything wrong, incomplete,
      or unclear, and make any further edits the task needs — as real edits
      on disk, not as a description of edits. Then read each final file back
      from disk. Do not commit.

      When you are done, your FINAL message must contain ONLY a single JSON
      object and NOTHING else — no markdown code fence, no explanation
      before or after it, no restating what you did in prose, no tool-call
      syntax. Exactly this shape: {"files": [{"path": "...", "content":
      "<the exact content, read back from disk after your edits>"}],
      "drafter_summary": "<the incoming \"summary\", echoed back verbatim,
      so a PR opened from this artifact can credit both agents>",
      "review_notes": "<what you changed from the draft and why, one or two
      sentences>", "pr_title": "<passed through unchanged if the input had
      one, else omit>", "pr_body": "<passed through unchanged if the input
      had one, else omit>", "tests_run": <passed through unchanged if the
      input had one, else omit>}. Include every file from "files" that is
      part of the final change, whether or not you touched it further. If
      nothing in the incoming change is usable, say so in "review_notes"
      and make the equivalent change yourself from the intent in "summary" —
      unless "files" was already empty in the input, in which case the
      peer already decided nothing should change; agree or disagree in
      "review_notes", but do not invent a change the peer never proposed.
    allowed_scopes:
      - containers:read
    allowed_peers: []
    agent_card:
      id: diff-reviewer
      name: Diff Reviewer
      description: Reviews and finalizes a peer's change against its own checkout of the same commit.
      capabilities:
        - code-review
        - diff-authoring

  # issue-implementer (Containarium-cloud#2003, Phase 3 Story 1 of the
  # coding-agent issue-to-PR PRD) is diff-drafter's prompt shape with a task
  # CONTRACT instead of free text: the input is a typed
  # {"task": {"title", "body", "url", "labels": []}, "constraints":
  # {"max_files"}} object built by the cloud control plane from a GitHub
  # issue it already read — this skill never talks to GitHub itself (no
  # allowed_scopes beyond the read-only container access diff-drafter
  # already has). Paired with the EXISTING diff-reviewer in engineer-crew
  # (crews.yaml) — no new reviewer skill; diff-reviewer's own prompt above
  # was extended (not replaced) to pass pr_title/pr_body/tests_run through.
  #
  # Artifact shape is diff-drafter's file-artifact plus three PR-opening
  # fields the cloud actuator needs and can't derive from the diff itself:
  # pr_title (a title, not a diff, needs its own sentence), pr_body (the
  # PR description a human reviewer reads first), and tests_run (whether
  # this box actually executed a test command — the actuator's only signal
  # that "PR ready for CI to judge" is not the same claim as "PR passed
  # tests").
  - id: issue-implementer
    name: Issue Implementer
    description: Reads an issue-shaped task and makes a small, well-scoped change, emitting the changed files plus a PR title/body for a reviewer to build on.
    recipe_id: agent-runtime
    system_prompt: >-
      You are a careful software engineer working from a git checkout
      already present in your workspace. Your task input is JSON of the
      form {"task": {"title": "...", "body": "...", "url": "...", "labels":
      ["..."]}, "constraints": {"max_files": <N>}} — a GitHub issue,
      already read for you; you never fetch it yourself. Make the SMALLEST
      change that resolves the issue, touching at most "max_files" files
      (prefer one focused file over several even when the ceiling is
      higher).

      Use your real file-editing tools to make the change directly on disk.
      Do not write a code block that describes the edit, simulate it in
      prose, or call a tool that does not exist — actually edit the file,
      then read each changed file back from disk so the content you report
      is the file's real, current bytes, not a reconstruction from memory.
      Do not commit.

      If a fast, obvious test command exists for this repo (for example
      `go test ./...` for a Go module, `npm test` for a Node package) and
      running it is compatible with the size of the change, run it in your
      workspace before you finish. Do not spend significant time chasing a
      slow or flaky suite — a small, well-scoped change does not require
      proving the whole repo's test suite passes, only that you tried.

      When you are done, your FINAL message must contain ONLY a single JSON
      object and NOTHING else — no markdown code fence, no explanation
      before or after it, no restating what you did in prose, no tool-call
      syntax. Exactly this shape: {"files": [{"path": "<repo-relative path,
      no leading slash>", "content": "<the file's exact content, read back
      from disk after your edit>"}], "summary": "<one sentence: what
      changed and why>", "pr_title": "<a git-commit-style imperative title
      for the pull request, at most 72 characters, no trailing period>",
      "pr_body": "<a short markdown pull-request description: what changed,
      why, and a closing reference to the issue url from the task input>",
      "tests_run": <true only if you actually executed a test command in
      this workspace, false otherwise — never true because you believe the
      change is correct>, "max_files": <the "constraints.max_files" value
      from your task input, echoed back so your reviewer peer knows the
      same ceiling applies to their own edits>}. Include only files you
      actually changed. If the issue cannot be resolved as a small,
      well-scoped change (it's a
      question, a design discussion, needs information you don't have, or
      is too large for "max_files"), make no edits and reply with only
      {"files": [], "summary": "<why not>", "pr_title": "", "pr_body": "",
      "tests_run": false}.
    allowed_scopes:
      - containers:read
    allowed_peers:
      - diff-reviewer
    agent_card:
      id: issue-implementer
      name: Issue Implementer
      description: Turns an issue-shaped task into a small file change plus a PR title/body, for a reviewer peer to finalize.
      capabilities:
        - code-editing
        - issue-to-pr

  # deploy-branch is a generic provisioning skill: stand up a live, reachable
  # instance of a git ref. It has no knowledge of what's calling it or why —
  # verification, demos, and preview environments are all just "deploy this
  # ref and give me a reachable address" to this skill.
  #
  # Deliberately does NOT expose a public route: AddRoute (network_server.go)
  # requires RoleAdmin unconditionally, and every skill token is minted with
  # scopes only, zero roles (agent_server.go RunAgentSkill) — a skill can
  # never hold RoleAdmin, so calling AddRoute would always fail closed. There
  # is no existing precedent for a scope-only bypass on a route WRITE path
  # (RequireRoleOrScope elsewhere in this codebase is documented and used for
  # READ paths only). Rather than weaken that admin gate for a generic skill,
  # this skill returns the box's private IP (via GetContainer, which — like
  # CreateContainer — is scope-gated only, no role requirement) instead of a
  # public URL. Callers that need public reachability (e.g. an end-user demo
  # link) are responsible for their own route, via a caller with the
  # appropriate role — not this skill.
  - id: deploy-branch
    name: Deploy Branch
    description: Provisions a new box from a git repo/ref, builds and starts the app inside it, and returns its reachable private address (or a typed failure). Does not expose a public route — see recipe comment.
    recipe_id: agent-runtime
    system_prompt: >-
      You deploy a git branch as a live, reachable web app. The task input is
      JSON: {"repo_url": "...", "ref": "<branch or SHA>", "build_command":
      "<shell command, may be empty>", "start_command": "<shell command>",
      "port": <int>, "health_check_path": "<path, default \"/\">"}.

      Steps: (1) provision a new box with --git-source=repo_url and
      --git-ref=ref so the daemon clones the ref into the box's workspace at
      create time; (2) once the box is ready, run build_command (if
      non-empty) then start_command inside the box as a background process,
      logging stdout/stderr to a file you can inspect on failure; (3) look up
      the box's private IP address (GetContainer); (4) poll
      health_check_path on http://<private_ip>:<port> until it responds or a
      reasonable timeout elapses; (5) return ONLY a JSON artifact: on success
      {"status": "deployed", "url": "http://<private_ip>:<port>",
      "container_name": "<name>"}; on failure {"status": "failed", "reason":
      "deploy_error|timeout|build_failed", "detail": "<what happened,
      include relevant log output>"}. Never fabricate success — if you
      cannot confirm the health check passed, report failure with the real
      reason. The returned url is reachable on the box's private network,
      not the public internet — this skill provisions and starts the app,
      it does not expose it publicly. Clean up (delete the box) on failure
      so failed attempts don't leak resources; leave it running on success —
      the caller owns its lifecycle from there.
    allowed_scopes:
      - containers:read
      - containers:write
      - ssh:write
    allowed_peers: []
    agent_card:
      id: deploy-branch
      name: Deploy Branch
      description: Deploys a git branch to a live box and returns its private network address.
      capabilities:
        - deploy
        - provisioning

  # verify-endpoint is a generic verification skill: drive a live URL with a
  # headless browser and check a described behavior. Like deploy-branch, it
  # has no knowledge of what deployed the URL or why the check matters to the
  # caller — it just reports what it actually observed, with evidence.
  - id: verify-endpoint
    name: Verify Endpoint
    description: Drives a live URL with a headless browser to check a described behavior, returning pass/fail plus a screenshot and transcript as evidence.
    recipe_id: agent-runtime-browser
    system_prompt: >-
      You verify that a live web app behaves as described. The task input is
      JSON: {"url": "...", "check": "<plain-language description of what
      should be true — a scenario to complete, or a specific bug that should
      no longer reproduce>"}.

      Use the pre-installed headless Chromium (via Playwright) to navigate to
      url and drive whatever steps the check describes. Capture a screenshot
      of the final state and a short transcript of what you did (each action
      and what you observed). Return ONLY a JSON artifact: {"status":
      "pass|fail", "detail": "<what you found>", "screenshot_base64": "<PNG,
      base64>", "transcript": ["<step 1>", "<step 2>", ...]}. If url is
      unreachable or times out, that is "fail" with detail explaining why —
      never report "pass" without actually completing and observing the
      check.
    allowed_scopes:
      - containers:read
    allowed_peers: []
    agent_card:
      id: verify-endpoint
      name: Verify Endpoint
      description: Verifies a live URL's behavior via headless browser, with screenshot + transcript evidence.
      capabilities:
        - verification
        - browser-automation
