# Pin for the SDLC role skills shipped in coding-agent boxes (#2065).
#
# Source of truth is https://github.com/FootprintAI/open-sdlc-skills; this repo
# references it, it never vendors it. `ref` is a full commit SHA because that
# repo has no tags (a commit is content-addressed, so it pins the content).
# `sha256` is the digest of the packaged tarball, which is built
# deterministically, so CI rebuilds it from `ref` and fails on a mismatch.
#
# Bump: scripts/build-sdlc-skills-bundle.sh --update-lock <out-dir>
