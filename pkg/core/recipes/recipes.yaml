# Containarium Recipe Catalog
#
# A recipe deploys a GPU/app workload as a NEW dedicated container. The
# container is an Ubuntu LXC (with optional GPU passthrough); the recipe's
# image runs inside it via Podman in the post_start commands — the same
# pattern the kubeflow stack uses to run k3s inside an LXC.
#
# Deploy-time parameters are exported to post_start as
# CONTAINARIUM_PARAM_<UPPER_NAME> environment variables.
#
# These recipes ship in-tree and are reviewed; post_start runs with the same
# trust level as a stack's post_install. Remote/community catalogs are a
# separate, signed mechanism (not loaded here).

recipes:
  - id: ollama
    name: Ollama
    description: Run Ollama with GPU acceleration and pull a model on first boot.
    image: ollama/ollama
    requires_gpu: true
    resources:
      cpu: "8"
      memory: 16GB
      disk: 200GB
    ports:
      - container_port: 11434
        subdomain: ollama
    volumes:
      - name: ollama-models
        path: /root/.ollama
    parameters:
      - name: model
        label: Model
        description: Model to pull after the server starts (e.g. llama3, qwen2.5).
        type: string
        default: llama3
    post_start:
      - podman volume create ollama-models
      - podman run -d --name ollama --restart=always --device nvidia.com/gpu=all -p 11434:11434 -v ollama-models:/root/.ollama docker.io/ollama/ollama
      - 'podman exec ollama ollama pull "$CONTAINARIUM_PARAM_MODEL"'

  - id: llamacpp
    name: llama.cpp server
    description: Run the llama.cpp OpenAI-compatible server with CUDA, serving a HuggingFace GGUF model.
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    requires_gpu: true
    resources:
      cpu: "8"
      memory: 16GB
      disk: 100GB
    ports:
      - container_port: 8080
        subdomain: llamacpp
    volumes:
      - name: llamacpp-models
        path: /models
    parameters:
      - name: hf_repo
        label: HuggingFace GGUF repo
        description: HuggingFace repo to serve, in -hf form (e.g. ggml-org/gemma-3-1b-it-GGUF).
        type: string
        default: ggml-org/gemma-3-1b-it-GGUF
        required: true
    post_start:
      - podman volume create llamacpp-models
      - 'podman run -d --name llamacpp --restart=always --device nvidia.com/gpu=all -p 8080:8080 -v llamacpp-models:/models ghcr.io/ggml-org/llama.cpp:server-cuda -hf "$CONTAINARIUM_PARAM_HF_REPO" --host 0.0.0.0 --port 8080'

  # agent-runtime is the box an AgentSkill runs in (AgentSkillService). It is a
  # plain Ubuntu LXC; the skill's system prompt, scoped token, and task input
  # are seeded under /etc/containarium/agent by RunAgentSkill, and the in-box
  # agent loop (agent-runtime/, the Node sibling package) consumes them and
  # writes artifact.json back. No GPU and no exposed ports by default — a skill
  # that needs either declares its own box.
  #
  # post_start assembles the box (design-note open question #5, addressed via
  # the release-artifact path): install Node 20, then run
  # scripts/install-agent-runtime.sh, which pulls the agent-box binary +
  # agent-runtime bundle from the named release and installs `agent-box` +
  # `agent-runtime` onto PATH. The daemon then execs `agent-runtime` (run mode)
  # or starts serve mode; both resolve via the PATH launcher.
  #
  # `release` selects the release tag the artifacts are pulled from (built by
  # `make build-agent-box-all` + `make bundle-agent-runtime`, published to the
  # GitHub release). `repo` overrides the source repo (forks/mirrors).
  - id: agent-runtime
    name: Agent Runtime
    description: Box for running an AgentSkill — Ubuntu LXC with Node + agent-box + the in-box agent loop; reads prompt/token/input from /etc/containarium/agent and writes artifact.json.
    image: images:ubuntu/24.04
    requires_gpu: false
    resources:
      cpu: "2"
      memory: 4GB
      disk: 20GB
    parameters:
      # release is optional: the daemon passes its own version when it
      # provisions a skill's box (so artifacts match the daemon); a human
      # `recipe deploy` may pass it too. When empty (or the release lacks the
      # artifacts), assembly is skipped and the box runs without the in-box loop
      # (the daemon's exec then degrades to an empty artifact — best-effort).
      - name: release
        label: Release tag
        description: Containarium release tag to pull agent-box + the agent-runtime bundle from (e.g. v0.27.0). Empty skips assembly.
        type: string
      - name: repo
        label: Source repo
        description: GitHub owner/repo the release artifacts live in.
        type: string
        default: FootprintAI/Containarium
    post_start:
      - mkdir -p /etc/containarium/agent
      - 'curl -fsSL https://deb.nodesource.com/setup_20.x | bash -'
      - DEBIAN_FRONTEND=noninteractive apt-get install -y nodejs
      # Best-effort assembly: never fail provisioning if the release lacks the
      # artifacts (|| echo keeps the line green under `set -e`).
      - 'if [ -n "$CONTAINARIUM_PARAM_RELEASE" ]; then curl -fsSL "https://raw.githubusercontent.com/$CONTAINARIUM_PARAM_REPO/$CONTAINARIUM_PARAM_RELEASE/scripts/install-agent-runtime.sh" | REPO="$CONTAINARIUM_PARAM_REPO" RELEASE="$CONTAINARIUM_PARAM_RELEASE" bash || echo "agent-runtime assembly skipped/failed for release=$CONTAINARIUM_PARAM_RELEASE; box runs without the in-box loop"; fi'

  # agent-runtime-browser is agent-runtime plus a headless Chromium (via
  # Playwright), for skills that need to drive or inspect a live web UI
  # rather than just call APIs. Kept as its own recipe — same "a skill that
  # needs [...] declares its own box" convention agent-runtime's own comment
  # states above — so skills that don't need a browser (the common case)
  # don't pay the extra provisioning cost of installing it.
  - id: agent-runtime-browser
    name: Agent Runtime (Browser)
    description: Agent Runtime plus a headless Chromium via Playwright, for skills that need to drive or inspect a live web UI.
    image: images:ubuntu/24.04
    requires_gpu: false
    resources:
      cpu: "2"
      memory: 4GB
      disk: 20GB
    parameters:
      - name: release
        label: Release tag
        description: Containarium release tag to pull agent-box + the agent-runtime bundle from (e.g. v0.27.0). Empty skips assembly.
        type: string
      - name: repo
        label: Source repo
        description: GitHub owner/repo the release artifacts live in.
        type: string
        default: FootprintAI/Containarium
    post_start:
      - mkdir -p /etc/containarium/agent
      - 'curl -fsSL https://deb.nodesource.com/setup_20.x | bash -'
      - DEBIAN_FRONTEND=noninteractive apt-get install -y nodejs
      - 'if [ -n "$CONTAINARIUM_PARAM_RELEASE" ]; then curl -fsSL "https://raw.githubusercontent.com/$CONTAINARIUM_PARAM_REPO/$CONTAINARIUM_PARAM_RELEASE/scripts/install-agent-runtime.sh" | REPO="$CONTAINARIUM_PARAM_REPO" RELEASE="$CONTAINARIUM_PARAM_RELEASE" bash || echo "agent-runtime assembly skipped/failed for release=$CONTAINARIUM_PARAM_RELEASE; box runs without the in-box loop"; fi'
      - npm install -g playwright@1.48.0
      - npx --yes playwright install --with-deps chromium

  # agent-workspace is the HUMAN-IN-THE-LOOP chat workspace: a web chat UI
  # (Claude/ChatGPT-style) with a live preview pane and multiple persisted
  # conversations, all running inside one always-on box. Where agent-runtime is
  # headless (seeded task → artifact.json), this is a place a user sits and
  # co-works with a coding agent, then ships what they build to a separate box.
  #
  # Rather than build a chat UI + agent loop + session store from scratch, this
  # recipe packages OpenHands (https://github.com/All-Hands-AI/OpenHands, MIT)
  # as the in-box engine. OpenHands already gives us: a web chat UI, a coding
  # agent, an in-container workspace + browser/preview, multiple conversations
  # persisted to disk, and bring-your-own Anthropic key. Containarium's value is
  # the wrapper: an isolated always-on box, eBPF/audit/secrets trust fabric, and
  # one-click ship-to-box via the platform MCP. OpenHands' web port is exposed
  # as a subdomain (the `ports` block) so the whole chat+preview surface is
  # reachable in the browser; conversations live under /opt/openhands-state in
  # the box, so "all sessions stored inside a box" holds.
  #
  # The OpenHands "Agent Canvas" build runs the coding agent IN the app
  # container (the box is the sandbox) — no docker/podman socket, no separate
  # runtime image. Conversations persist to the mounted state dir, so "all
  # sessions stored inside a box" holds. Validated live on a backend
  # (2026-06-18, see docs/AGENT-WORKSPACE-SPIKE.md): the app comes up on :8000
  # and serves the chat UI; bind mounts need Podman's `:U` so the non-root
  # `openhands` user can write its SQLite DB.
  #
  # Auth lives IN the box, not at the edge: OpenHands binds to 127.0.0.1 and an
  # in-box Caddy basic-auth proxy fronts it on the exposed port (:8080). So the
  # box self-protects — the platform edge just forwards plain HTTP to :8080 and
  # terminates TLS — and a box is never reachable without credentials. The
  # auth_password parameter is required for exactly that reason. Validated live
  # (2026-06-18): no/wrong creds → 401, correct creds → 200; OpenHands itself is
  # not directly reachable. Auth + transport flow validated end to end in-box.
  #
  # The Anthropic key/model are set in the OpenHands settings UI on first visit
  # (the run command takes no LLM env). Production hardening: seed credentials
  # via the tenant secrets mechanism once the env contract is confirmed. Still
  # pending live acceptance: a real model call (needs a key). Resource sizing is
  # generous; trim after profiling.
  - id: agent-workspace
    name: Agent Workspace
    description: Web chat workspace (chat + live preview + multiple persisted sessions) running OpenHands inside an always-on box, behind in-box basic auth; co-work with a coding agent in the browser, then ship to a box.
    image: images:ubuntu/24.04
    requires_gpu: false
    resources:
      cpu: "4"
      memory: 8GB
      disk: 60GB
    ports:
      # The in-box auth proxy — fronts the OpenHands UI (chat + preview +
      # conversation list). OpenHands itself stays on 127.0.0.1.
      - container_port: 8080
        subdomain: workspace
    parameters:
      - name: auth_password
        label: Workspace password
        description: Password for the in-box basic-auth proxy in front of the workspace UI. Required — the box is never exposed without it.
        type: password
        required: true
      - name: auth_user
        label: Workspace username
        description: Username for the in-box basic-auth proxy.
        type: string
        default: admin
      - name: openhands_version
        label: OpenHands version
        description: OpenHands Agent Canvas image tag to run (pin for reproducibility).
        type: string
        default: 1.0.0-rc.11
    post_start:
      - mkdir -p /opt/openhands-state /opt/openhands-projects /opt/wsauth
      - podman pull docker.io/library/caddy:2 >/dev/null
      # Idempotent: drop any prior containers so a re-run of post_start (retry,
      # re-deploy) doesn't abort under `set -e` on "name already in use".
      - podman rm -f openhands wsauth 2>/dev/null || true
      # Run the OpenHands web app bound to localhost: chat + preview + persisted
      # conversations. `:U` chowns the bind mounts to the container's non-root
      # user so it can write its SQLite state (validated 2026-06-18).
      - |
        podman run -d --name openhands --restart=always \
          -p 127.0.0.1:8000:8000 \
          -v /opt/openhands-state:/home/openhands/.openhands:U \
          -v /opt/openhands-projects:/projects:U \
          "ghcr.io/openhands/agent-canvas:${CONTAINARIUM_PARAM_OPENHANDS_VERSION}"
      # In-box auth proxy on :8080 → 127.0.0.1:8000. Two ways in: HTTP basic
      # auth, OR a session cookie the proxy itself issues on a successful
      # basic-auth response. The cookie is SameSite=None so the browser sends it
      # to this box even from an iframe embedded in the console on another
      # origin — so after one top-level sign-in the embedded workspace loads with
      # no prompt (browsers suppress basic-auth prompts in cross-origin iframes).
      # The cookie value is a per-box random token; the console needs no secret.
      # The password is bcrypt-hashed at deploy; the hash's '$' come from
      # variable expansion and are not re-expanded by the heredoc. auto_https
      # off: the edge terminates TLS, the in-box proxy speaks plain HTTP.
      - |
        WS_HASH=$(podman run --rm docker.io/library/caddy:2 caddy hash-password --plaintext "$CONTAINARIUM_PARAM_AUTH_PASSWORD")
        WS_TOKEN=$(head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n')
        # Fail loudly rather than write a malformed auth config (empty hash →
        # a degenerate basic_auth entry, empty token → no cookie gate).
        [ -n "$WS_HASH" ] && [ -n "$WS_TOKEN" ] || { echo "agent-workspace: empty auth hash/token; aborting" >&2; exit 1; }
        # Persist the token (mode 0600) so the daemon can read it and hand the
        # console a zero-click bootstrap URL (RecipeService.GetWorkspaceAccess).
        printf '%s' "$WS_TOKEN" > /opt/wsauth/token
        chmod 600 /opt/wsauth/token
        cat > /opt/wsauth/Caddyfile <<EOF
        {
          auto_https off
        }
        :8080 {
          # Zero-click bootstrap: the console opens /__ws_login?t=<token>; the
          # proxy sets the SameSite=None cookie and redirects to the app, so no
          # sign-in prompt is ever shown in the embedded iframe.
          @login {
            path /__ws_login
            query t=$WS_TOKEN
          }
          handle @login {
            header +Set-Cookie "ws_auth=$WS_TOKEN; Path=/; HttpOnly; Secure; SameSite=None"
            # `redir * / 302`: the explicit `*` matcher keeps Caddy from reading
            # the leading `/` as a path matcher (which makes the redirect a no-op).
            redir * / 302
          }
          # Cookie path: seamless once the cookie is set. Anchored to the
          # cookie name=value boundary so a crafted cookie can't slip the token
          # in as a substring of another value.
          @authed header_regexp Cookie "(^|;\s*)ws_auth=$WS_TOKEN($|;)"
          handle @authed {
            reverse_proxy 127.0.0.1:8000
          }
          # Fallback: HTTP basic auth, which also issues the cookie.
          handle {
            basic_auth {
              $CONTAINARIUM_PARAM_AUTH_USER $WS_HASH
            }
            reverse_proxy 127.0.0.1:8000 {
              header_down +Set-Cookie "ws_auth=$WS_TOKEN; Path=/; HttpOnly; Secure; SameSite=None"
            }
          }
        }
        EOF
      - |
        podman run -d --name wsauth --restart=always --network host \
          -v /opt/wsauth/Caddyfile:/etc/caddy/Caddyfile:ro \
          docker.io/library/caddy:2

  # librechat is the MANAGED CHAT WORKSPACE: LibreChat (github.com/danny-avila/
  # LibreChat, MIT) packaged in a box and wired to the platform model-gateway.
  # Where agent-workspace (OpenHands) is a bring-your-own-key coding canvas, this
  # is the command-center surface: the OPERATOR picks the models, the box talks
  # to them through the daemon's gateway (provider key on the HOST, never in the
  # box, metered), and a user can SWITCH among the curated models but cannot
  # supply their own key — LibreChat's custom endpoint takes its key from the
  # box env (the seeded gateway token), so there is no user-key field to lock.
  #
  # The gateway wiring is automatic via `model_gateway_provider: gemini-openai`:
  # the daemon seeds CONTAINARIUM_MODEL_GATEWAY_URL + CONTAINARIUM_GATEWAY_TOKEN
  # into post_start (internal/server/recipe_server.go gatewayEnvForRecipe). On a
  # self-hosted daemon with no provider key those are absent and the box comes up
  # with an empty endpoint set (LibreChat then uses its own config — OSS fallback).
  #
  # LibreChat + MongoDB run via Podman on the box's host network; the web UI
  # (:3080) is exposed as a subdomain. The admin user is created from the
  # auth_email/auth_password params (first user = admin), then self-registration
  # is locked off so only that admin can sign in.
  - id: librechat
    name: LibreChat Workspace
    description: Managed chat workspace — LibreChat wired to the platform model-gateway (curated models, no user keys) in an isolated always-on box.
    image: images:ubuntu/24.04
    requires_gpu: false
    resources:
      cpu: "4"
      memory: 4GB
      disk: 20GB
    model_gateway_provider: gemini-openai
    ports:
      # The exposed port is the in-box zero-click proxy (lcproxy / Caddy), NOT
      # LibreChat directly. The proxy fronts LibreChat on 127.0.0.1:3080: it adds
      # a /__ws_login?t= bootstrap (one-time login → SameSite=None session cookie)
      # so the console can embed the workspace in an iframe with no re-login, and
      # rewrites LibreChat's SameSite=Strict session cookies to None so they
      # survive the cross-site iframe. LibreChat's own /login still works through
      # the proxy as a fallback.
      - container_port: 8080
        subdomain: chat
    parameters:
      - name: auth_email
        label: Owner email
        description: Email for the workspace owner login (created at deploy; self-registration is then disabled). The cloud sets this to the deploying user's email.
        type: string
        default: admin@workspace.local
      - name: auth_name
        label: Owner name
        description: Display name for the workspace owner (and derived username). The cloud sets this to the deploying user's name; falls back to "Admin".
        type: string
        default: Admin
      - name: auth_password
        label: Owner password
        description: Password for the workspace owner login. If not supplied, the cloud control plane generates a strong random password and returns it in the deploy response (shown once in the webui). Never left open.
        type: password
      - name: librechat_version
        label: LibreChat image tag
        description: LibreChat image tag to run (pin for reproducibility).
        type: string
        default: latest
      - name: librechat_ui
        label: Embedded UI mode
        description: >-
          How much of LibreChat the embedded iframe shows. "full" (default)
          embeds the whole LibreChat UI — left nav, conversation history, agents
          builder, the tools/MCP menu, presets. "chat" hides the left nav so the
          iframe shows only the chat pane. Either way the enforced model-spec
          still pins the assistant, and zero-click login is unchanged.
        type: string
        default: full
      - name: skills
        label: Installed skills (hidden personas)
        description: >-
          JSON array of the workspace's installed skills, as
          [{"name":"...","instructions":"..."}]. Each becomes a hidden model-spec
          the user picks BY NAME in LibreChat's selector — the conversation then
          runs under that skill's instructions, which are never shown in the UI
          (they live server-side in librechat.yaml, so they stay hidden even with
          the full UI embedded). The cloud injects the org's installed set; empty
          leaves only the default general assistant.
        type: string
      # Optional: inject the Containarium MCP so the chat agent can operate the
      # platform from the conversation (list/deploy boxes, expose ports, run
      # skills). Both must be set to enable it. The TOKEN must be scoped +
      # revocable and LEAST-PRIVILEGE — a chat agent is prompt-injectable, so it
      # should carry only read + recipes:deploy + agents:run scopes, never
      # delete / secrets / route-write. Scoping is the minter's job (the cloud
      # mints an org-scoped token at deploy); the recipe wires what it's handed.
      - name: mcp_server_url
        label: MCP target API URL
        description: Containarium API URL the in-box MCP targets (e.g. https://cloud.containarium.dev). Empty disables MCP injection.
        type: string
      - name: mcp_token
        label: MCP scoped token
        description: Scoped, revocable least-privilege Containarium token for the in-box MCP. Empty disables MCP injection.
        type: password
    post_start:
      - mkdir -p /opt/lc /opt/lc/mongo
      - command -v curl >/dev/null 2>&1 && command -v openssl >/dev/null 2>&1 && command -v python3 >/dev/null 2>&1 || { export DEBIAN_FRONTEND=noninteractive; apt-get update -qq && apt-get install -y -qq curl openssl python3 >/dev/null; }
      - podman pull docker.io/library/mongo:7 >/dev/null
      - 'podman pull "ghcr.io/danny-avila/librechat:${CONTAINARIUM_PARAM_LIBRECHAT_VERSION}" >/dev/null'
      # LibreChat config: one custom endpoint at the platform gateway. apiKey is
      # the seeded gateway token (LibreChat env-expands ${CTN_GATEWAY_TOKEN}), so
      # the box holds no real provider key and users can't supply their own. No
      # gateway seeded → empty config, LibreChat falls back to its own provider.
      - |
        if [ -n "${CONTAINARIUM_MODEL_GATEWAY_URL:-}" ] && [ -n "${CONTAINARIUM_GATEWAY_TOKEN:-}" ]; then
          printf 'version: 1.2.1\ncache: true\nendpoints:\n  custom:\n    - name: "Containarium (Gemini)"\n      apiKey: "${CTN_GATEWAY_TOKEN}"\n      baseURL: "%s/v1beta/openai"\n      models:\n        default: ["gemini-2.5-flash-lite", "gemini-flash-latest", "gemini-2.5-flash"]\n        fetch: false\n      titleConvo: true\n      titleModel: "gemini-flash-latest"\n      modelDisplayLabel: "Containarium Gemini"\n' "$CONTAINARIUM_MODEL_GATEWAY_URL" > /opt/lc/librechat.yaml
        else
          printf 'version: 1.2.1\ncache: true\n' > /opt/lc/librechat.yaml
          echo 'librechat: no managed gateway seeded; configure a provider in LibreChat' >&2
        fi
      # Optional MCP injection: when mcp_server_url + mcp_token are set, install
      # the Containarium MCP (stdio) and wire it into LibreChat so the chat agent
      # can operate the platform (list/deploy boxes, expose ports, run skills),
      # scoped to whatever the token allows (enforced server-side). LibreChat
      # spawns the MCP command INSIDE its own container, so the binary + token are
      # mounted in via $LC_MCP_MOUNTS (added to the librechat run below).
      - |
        LC_MCP_MOUNTS=""
        if [ -n "${CONTAINARIUM_PARAM_MCP_SERVER_URL:-}" ] && [ -n "${CONTAINARIUM_PARAM_MCP_TOKEN:-}" ]; then
          MCP_DL_URL="https://github.com/FootprintAI/Containarium/releases/latest/download/mcp-server-linux-amd64"
          MCP_MIN_BYTES=5242880
          MCP_DL_OK=0
          if curl --retry 3 --retry-delay 2 --retry-all-errors -fSL -m 180 \
               "$MCP_DL_URL" -o /opt/lc/mcp-server; then
            ACTUAL=$(stat -c%s /opt/lc/mcp-server 2>/dev/null || echo 0)
            if [ "$ACTUAL" -ge "$MCP_MIN_BYTES" ]; then
              MCP_DL_OK=1
            else
              echo "librechat: mcp-server download truncated (${ACTUAL}B < ${MCP_MIN_BYTES}B); skipping MCP injection" >&2
            fi
          else
            echo 'librechat: mcp-server download failed after retries; skipping MCP injection' >&2
          fi
          if [ "$MCP_DL_OK" = "1" ]; then
            chmod +x /opt/lc/mcp-server
            printf '%s' "$CONTAINARIUM_PARAM_MCP_TOKEN" > /opt/lc/ctn-token
            # Owned by the in-image 'node' user (uid 1000) with 0600. The
            # mcp-server runs as node and REFUSES a token file with any non-owner
            # r/w bit (insecure-perms guard) — so 0644 is rejected — but a
            # root-owned 0600 is unreadable by node. uid-1000-owned 0600 satisfies
            # both (rootful podman maps container uid 1000 → host uid 1000). The
            # token is bind-mounted read-only; it's a scoped, revocable,
            # least-privilege credential.
            chown 1000:1000 /opt/lc/ctn-token
            chmod 600 /opt/lc/ctn-token
            # Box→cloud reachability: a box on the workhorse host CAN'T reach the
            # public cloud apex — it hairpins back to the same host (so both the
            # in-box MCP and the skill live-sync would get connection failures).
            # But core-caddy — the host reverse proxy that already serves the apex
            # vhost (with the valid wildcard cert) — is reachable on the container
            # bridge BY NAME. So point the apex hostname at core-caddy via
            # /etc/hosts and keep using https:// — core-caddy's :443 proxy_protocol
            # wrapper only REQUIRES a PROXY header from the sentinel subnet; a
            # bridge client's plain TLS is accepted and matched to the wildcard
            # cert by SNI. Same scheme + valid TLS as an external client; the only
            # change is the internal name resolution. Falls back to the original
            # URL when core-caddy isn't resolvable (standalone / non-cloud deploys
            # reach the apex directly).
            APEX_HOST=$(printf '%s' "$CONTAINARIUM_PARAM_MCP_SERVER_URL" | sed -E 's#^[a-z]+://##; s#/.*##; s#:.*##')
            CADDY_IP=$(getent hosts containarium-core-caddy 2>/dev/null | awk '{print $1}' | head -1)
            if [ -n "$CADDY_IP" ] && [ -n "$APEX_HOST" ]; then
              grep -q " $APEX_HOST\$" /etc/hosts 2>/dev/null || echo "$CADDY_IP $APEX_HOST" >> /etc/hosts
              MCP_URL="https://$APEX_HOST"
            else
              MCP_URL="$CONTAINARIUM_PARAM_MCP_SERVER_URL"
            fi
            printf 'mcpServers:\n  containarium:\n    type: stdio\n    command: /usr/local/bin/mcp-server\n    args: []\n    env:\n      CONTAINARIUM_SERVER_URL: "%s"\n      CONTAINARIUM_JWT_TOKEN_FILE: "/opt/lc/ctn-token"\n' "$MCP_URL" >> /opt/lc/librechat.yaml
            LC_MCP_MOUNTS="-v /opt/lc/mcp-server:/usr/local/bin/mcp-server:ro -v /opt/lc/ctn-token:/opt/lc/ctn-token:ro"
            # Drop the live-sync config (URL + token path + apex host for the sync
            # script /etc/hosts self-heal). This file's PRESENCE later arms the
            # timer (the units are written + enabled further down, after they
            # exist — this MCP step runs before them).
            printf 'SKILLS_URL=%s/v1/recipes/workspace/skills\nTOKEN_FILE=/opt/lc/ctn-token\nAPEX_HOST=%s\n' "$MCP_URL" "$APEX_HOST" > /opt/lc/skills-sync.env
          fi
        fi
      - |
        {
          echo "HOST=0.0.0.0"
          echo "PORT=3080"
          echo "MONGO_URI=mongodb://127.0.0.1:27017/LibreChat"
          echo "CONFIG_PATH=/app/librechat.yaml"
          echo "ALLOW_REGISTRATION=true"
          echo "ALLOW_EMAIL_LOGIN=true"
          echo "SEARCH=false"
          echo "JWT_SECRET=$(openssl rand -hex 32)"
          echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)"
          echo "CREDS_KEY=$(openssl rand -hex 32)"
          echo "CREDS_IV=$(openssl rand -hex 16)"
          echo "CTN_GATEWAY_TOKEN=${CONTAINARIUM_GATEWAY_TOKEN:-}"
        } > /opt/lc/.env
      - podman rm -f mongo librechat 2>/dev/null || true
      - podman run -d --name mongo --restart=always --network host -v /opt/lc/mongo:/data/db docker.io/library/mongo:7 >/dev/null
      - 'podman run -d --name librechat --restart=always --network host --env-file /opt/lc/.env -v /opt/lc/librechat.yaml:/app/librechat.yaml:ro ${LC_MCP_MOUNTS:-} "ghcr.io/danny-avila/librechat:${CONTAINARIUM_PARAM_LIBRECHAT_VERSION}" >/dev/null'
      # Wait for the API, create the OWNER from params (first user = owner), named
      # after the deploying user (the cloud passes auth_name/auth_email). NOTE: the
      # agents API rejects requests with no User-Agent ("Illegal request"), so all
      # agent/auth calls below send one.
      - |
        UA="Mozilla/5.0 (X11; Linux x86_64) Chrome/120 Safari/537.36"
        for i in $(seq 1 60); do
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3080/ 2>/dev/null || echo 000)
          if [ "$code" = "200" ]; then break; fi
          sleep 3
        done
        # Username derived from the email local-part (sanitized to a valid handle).
        LC_USER=$(printf '%s' "${CONTAINARIUM_PARAM_AUTH_EMAIL%%@*}" | tr -cd 'a-zA-Z0-9._-' | cut -c1-40)
        [ -n "$LC_USER" ] || LC_USER=owner
        curl -fsS -A "$UA" -X POST http://127.0.0.1:3080/api/auth/register -H 'Content-Type: application/json' \
          -d "{\"name\":\"$CONTAINARIUM_PARAM_AUTH_NAME\",\"username\":\"$LC_USER\",\"email\":\"$CONTAINARIUM_PARAM_AUTH_EMAIL\",\"password\":\"$CONTAINARIUM_PARAM_AUTH_PASSWORD\",\"confirm_password\":\"$CONTAINARIUM_PARAM_AUTH_PASSWORD\"}" \
          >/dev/null 2>&1 || echo 'librechat: owner register failed (may already exist)' >&2
      # Model-specs = SKILLS as hidden personas. Each installed skill becomes a
      # model-spec the user picks BY NAME in LibreChat's selector; the whole
      # conversation then runs under that skill's `promptPrefix` (its hidden
      # instructions). The prompt is NEVER shown in the UI — it lives here in
      # librechat.yaml, server-side, so it stays hidden even with the full UI
      # embedded (a LibreChat "agent" would expose its instructions in the agents
      # builder; a model-spec promptPrefix does not). A default "Containarium
      # Workspace" general assistant is always present and is the default pick.
      #
      # The DEFAULT "Containarium Workspace" spec uses the CUSTOM endpoint with
      # ephemeralAgent.mcp: ["containarium"] when MCP is wired (#773). This
      # auto-attaches the in-box MCP tools without routing through the agents
      # endpoint (which enforced specs don't reach — #771). Skill personas stay on
      # the custom endpoint (chat-only, advisory — no tools); with no MCP the
      # default also uses the custom endpoint with no tools. Skills come from the
      # `skills` param (JSON, the cloud injects the org's installed set). Built
      # with python3 so multi-line SKILL.md prompts serialize safely
      # (json.dumps → valid YAML scalars). Needs the gateway; emits nothing without
      # it (LibreChat falls back). The model-spec generator is written to a FILE
      # (not run inline) so the live-sync timer below can re-run it on the same
      # logic. It reads a skills JSON on stdin — either a bare array or a
      # {"skills":[...]} object (the cloud's /v1/recipes/workspace/skills shape) —
      # and emits the modelSpecs YAML.
      - |
        cat > /opt/lc/gen_modelspecs.py <<'PYEOF'
        import json, sys, os
        DEFAULT = ("You are the Containarium workspace assistant. Help the user with "
                   "software development, DevOps, system design, and general technical "
                   "questions. Be concise and helpful. If you genuinely should not do "
                   "something, explain why on the merits.")
        raw = sys.stdin.read().strip() or "[]"
        try:
            data = json.loads(raw)
            skills = data.get("skills", []) if isinstance(data, dict) else data
            if not isinstance(skills, list):
                skills = []
        except Exception:
            skills = []
        MCP_WIRED = os.path.exists("/opt/lc/mcp-server")
        def slug(name):
            s = "".join(c.lower() if c.isalnum() else "-" for c in name).strip("-")
            while "--" in s:
                s = s.replace("--", "-")
            return ("skill-" + s)[:60] if s else "skill"
        specs, seen = [], set()
        for sk in skills:
            if not isinstance(sk, dict):
                continue
            name = (sk.get("name") or sk.get("label") or "").strip()
            instr = (sk.get("instructions") or sk.get("prompt") or "").strip()
            if not name or not instr:
                continue
            nm = slug(name)
            if nm in seen:
                continue
            seen.add(nm)
            specs.append((nm, name, instr, False))
        # The general assistant is always present and is the default pick.
        specs.append(("containarium-workspace", "Containarium Workspace", DEFAULT, True))
        out = ["modelSpecs:", "  enforce: true", "  prioritize: true", "  list:"]
        for nm, label, instr, dflt in specs:
            out.append("    - name: " + json.dumps(nm))
            out.append("      label: " + json.dumps(label))
            out.append("      default: " + ("true" if dflt else "false"))
            out.append("      preset:")
            out.append('        endpoint: "Containarium (Gemini)"')
            out.append('        endpointType: "custom"')
            if dflt and MCP_WIRED:
                # Tool-equipped default: custom endpoint + ephemeralAgent.mcp
                # auto-attaches the in-box MCP server without the agents endpoint
                # (enforced specs don't route there — #773). gemini-2.5-flash-lite
                # uses standard function-calling; the thinking model requires a
                # thought_signature echo that LibreChat can't carry (#771).
                out.append('        model: "gemini-2.5-flash-lite"')
                out.append("        promptPrefix: " + json.dumps(instr))
                out.append('        ephemeralAgent:')
                out.append('          mcp:')
                out.append('            - "containarium"')
            else:
                # Chat-only persona (skills) or no-MCP fallback.
                out.append('        model: "gemini-flash-latest"')
                out.append("        promptPrefix: " + json.dumps(instr))
        print("\n".join(out))
        PYEOF
      # Render the initial specs from the injected `skills` param. Gated on the
      # gateway (no gateway → no specs; LibreChat falls back to its own provider).
      - |
        if [ -n "${CONTAINARIUM_MODEL_GATEWAY_URL:-}" ] && [ -n "${CONTAINARIUM_GATEWAY_TOKEN:-}" ]; then
          printf '%s' "${CONTAINARIUM_PARAM_SKILLS:-}" | python3 /opt/lc/gen_modelspecs.py >> /opt/lc/librechat.yaml
        fi
      # Live-sync script: re-render the personas from the cloud's current
      # installed-skill set WITHOUT a redeploy. Pulls /v1/recipes/workspace/skills
      # with the in-box MCP token, regenerates modelSpecs, and restarts LibreChat
      # ONLY when the rendered file actually changed (rare — admin installs /
      # uninstalls). Inert unless the timer is enabled (only when MCP is wired).
      - |
        cat > /opt/lc/sync-skills.sh <<'SH'
        #!/bin/sh
        set -eu
        [ -f /opt/lc/skills-sync.env ] || exit 0
        . /opt/lc/skills-sync.env
        [ -f /opt/lc/gen_modelspecs.py ] || exit 0
        TOK=$(cat "${TOKEN_FILE:-/opt/lc/ctn-token}" 2>/dev/null) || exit 0
        [ -n "$TOK" ] || exit 0
        # Self-heal the apex->core-caddy /etc/hosts entry (a box restart can
        # regenerate /etc/hosts, which would break the http-to-core-caddy route).
        if [ -n "${APEX_HOST:-}" ]; then
          CADDY_IP=$(getent hosts containarium-core-caddy 2>/dev/null | awk '{print $1}' | head -1)
          if [ -n "$CADDY_IP" ] && ! grep -q " $APEX_HOST\$" /etc/hosts 2>/dev/null; then
            echo "$CADDY_IP $APEX_HOST" >> /etc/hosts
          fi
        fi
        JSON=$(curl -fsS -m 10 -H "Authorization: Bearer $TOK" "$SKILLS_URL" 2>/dev/null) || exit 0
        NEW=$(printf '%s' "$JSON" | python3 /opt/lc/gen_modelspecs.py) || exit 0
        [ -n "$NEW" ] || exit 0
        sed '/^modelSpecs:/,$d' /opt/lc/librechat.yaml > /opt/lc/librechat.yaml.new
        printf '%s\n' "$NEW" >> /opt/lc/librechat.yaml.new
        if cmp -s /opt/lc/librechat.yaml.new /opt/lc/librechat.yaml; then
          rm -f /opt/lc/librechat.yaml.new
        else
          mv /opt/lc/librechat.yaml.new /opt/lc/librechat.yaml
          podman restart librechat >/dev/null 2>&1 || true
        fi
        SH
        chmod +x /opt/lc/sync-skills.sh
        printf '[Unit]\nDescription=LibreChat workspace skill live-sync\n[Service]\nType=oneshot\nExecStart=/bin/sh /opt/lc/sync-skills.sh\n' > /etc/systemd/system/lc-skills-sync.service
        printf '[Unit]\nDescription=Poll cloud for installed skills + re-render LibreChat personas\n[Timer]\nOnBootSec=90\nOnUnitActiveSec=60\n[Install]\nWantedBy=timers.target\n' > /etc/systemd/system/lc-skills-sync.timer
        systemctl daemon-reload >/dev/null 2>&1 || true
        # Arm the timer only when MCP was wired (skills-sync.env present → the box
        # has the token + URL to poll). Without it the script stays inert.
        [ -f /opt/lc/skills-sync.env ] && systemctl enable --now lc-skills-sync.timer >/dev/null 2>&1 || true
      - sed -i 's/^ALLOW_REGISTRATION=true/ALLOW_REGISTRATION=false/' /opt/lc/.env
      - podman restart librechat >/dev/null 2>&1 || true
      # --- Zero-click iframe access ---------------------------------------
      # LibreChat has its own login (JWT + refreshToken cookie) and rotates the
      # refresh token on use, so a pre-stored session can't be replayed — the
      # console must establish a FRESH session each time it embeds the workspace.
      # Two in-box pieces do that, both on the box's host network:
      #   * bootstrap.py (127.0.0.1:9099): /__mint issues a single-use, 120s
      #     handoff token (only reachable in-box — the daemon's GetWorkspaceAccess
      #     curls it); /__ws_login?t= validates+consumes the token, logs into
      #     LibreChat once with the admin creds, and re-emits the session cookies
      #     as SameSite=None;Secure so they survive a cross-site iframe.
      #   * lcproxy (Caddy :8080, the EXPOSED port): routes /__ws_login* to the
      #     helper and everything else to LibreChat :3080, rewriting LibreChat's
      #     SameSite=Strict session cookies to None so rotation keeps working in
      #     the iframe. /login still works through the proxy as a fallback.
      - mkdir -p /opt/wsauth
      - podman pull docker.io/library/caddy:2 >/dev/null
      # Admin creds for the helper's server-side login. 0600: only root reads it;
      # the user owns the box anyway (they set this password), and it never leaves
      # the box. Written via python3 so any special chars in the password survive.
      - |
        python3 - <<'PYEOF'
        import json, os
        json.dump({"email": os.environ["CONTAINARIUM_PARAM_AUTH_EMAIL"],
                   "password": os.environ["CONTAINARIUM_PARAM_AUTH_PASSWORD"]},
                  open("/opt/wsauth/lc-creds", "w"))
        PYEOF
      - chmod 600 /opt/wsauth/lc-creds
      - |
        cat > /opt/wsauth/bootstrap.py <<'PYEOF'
        # Zero-click auth bootstrap for the LibreChat workspace (stdlib only).
        # /__mint        -> single-use, short-lived handoff token (in-box only)
        # /__ws_login?t= -> consume token, fresh LibreChat login, set the session
        #                   cookies rewritten to SameSite=None;Secure, redirect to /
        import http.server, urllib.request, json, secrets, time, re
        from urllib.parse import urlparse, parse_qs

        LC = "http://127.0.0.1:3080"
        CREDS = "/opt/wsauth/lc-creds"
        TTL = 120
        _tokens = {}  # token -> expiry epoch

        def _gc():
            now = time.time()
            for k in [k for k, v in _tokens.items() if v < now]:
                _tokens.pop(k, None)

        def _samesite_none(c):
            c = re.sub(r';\s*SameSite=\w+', '', c, flags=re.I)
            if 'secure' not in c.lower():
                c += '; Secure'
            return c + '; SameSite=None'

        class H(http.server.BaseHTTPRequestHandler):
            def log_message(self, *a):
                pass

            def do_GET(self):
                u = urlparse(self.path)
                if u.path == "/__mint":
                    _gc()
                    t = secrets.token_urlsafe(24)
                    _tokens[t] = time.time() + TTL
                    self._raw(200, t.encode(), "text/plain")
                    return
                if u.path in ("/", ""):
                    # Chat-only: serve LibreChat's SPA shell with a <style> that
                    # hides the left nav so the embedded iframe shows only the chat
                    # pane (our Manage drawer is the single sidebar). Purely
                    # additive — if a selector misses, the nav just stays visible.
                    self._shell()
                    return
                if u.path == "/__ws_login":
                    _gc()
                    t = (parse_qs(u.query).get("t") or [""])[0]
                    if not t or _tokens.pop(t, None) is None:  # missing/expired/used
                        self._redirect("/login")
                        return
                    cookies = self._login()
                    if not cookies:
                        self._redirect("/login")
                        return
                    self.send_response(302)
                    self.send_header("Location", "/")
                    for c in cookies:
                        self.send_header("Set-Cookie", c)
                    self.end_headers()
                    return
                self._raw(404, b"not found", "text/plain")

            def _shell(self):
                try:
                    with urllib.request.urlopen(LC + "/", timeout=10) as r:
                        html = r.read().decode("utf-8", "replace")
                        ct = r.headers.get("Content-Type", "text/html; charset=utf-8")
                except Exception:
                    self._redirect("/login")
                    return
                css = ("<style>/* Containarium chat-only */"
                       "nav,aside.nav,[data-testid=\"nav\"],#nav{display:none!important}"
                       "main,[role=\"main\"]{margin-left:0!important;width:100%!important}"
                       "</style>")
                if "</head>" in html:
                    html = html.replace("</head>", css + "</head>", 1)
                else:
                    html = css + html
                self._raw(200, html.encode("utf-8"), ct)

            def _login(self):
                try:
                    creds = json.load(open(CREDS))
                    body = json.dumps({"email": creds["email"],
                                       "password": creds["password"]}).encode()
                    req = urllib.request.Request(
                        LC + "/api/auth/login", data=body,
                        headers={"Content-Type": "application/json"}, method="POST")
                    with urllib.request.urlopen(req, timeout=10) as r:
                        return [_samesite_none(c) for c in (r.headers.get_all("Set-Cookie") or [])]
                except Exception:
                    return None

            def _raw(self, code, body, ctype):
                self.send_response(code)
                self.send_header("Content-Type", ctype)
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)

            def _redirect(self, loc):
                self.send_response(302)
                self.send_header("Location", loc)
                self.end_headers()

        if __name__ == "__main__":
            http.server.HTTPServer(("127.0.0.1", 9099), H).serve_forever()
        PYEOF
      - |
        cat > /etc/systemd/system/wsauth-bootstrap.service <<'EOF'
        [Unit]
        Description=LibreChat zero-click auth bootstrap
        After=network.target
        [Service]
        ExecStart=/usr/bin/python3 /opt/wsauth/bootstrap.py
        Restart=always
        [Install]
        WantedBy=multi-user.target
        EOF
        systemctl daemon-reload
        systemctl enable --now wsauth-bootstrap.service >/dev/null 2>&1 || true
      - |
        # Built with echo (not a fixed heredoc) so the chat-only "/" route is
        # conditional on librechat_ui. In "full" mode (default) "/" falls through
        # to LibreChat → the whole UI (nav, history, agents, tools menu) embeds.
        # In "chat" mode the helper serves "/" with nav-hiding CSS so only the
        # chat pane shows. /__ws_login (zero-click) + the SameSite rewrite are the
        # same either way.
        {
          echo '{'
          echo '  auto_https off'
          echo '}'
          echo ':8080 {'
          echo '  handle /__ws_login* {'
          echo '    reverse_proxy 127.0.0.1:9099'
          echo '  }'
          if [ "${CONTAINARIUM_PARAM_LIBRECHAT_UI:-full}" = "chat" ]; then
            echo '  @root path /'
            echo '  handle @root {'
            echo '    reverse_proxy 127.0.0.1:9099'
            echo '  }'
          fi
          echo '  handle {'
          echo '    reverse_proxy 127.0.0.1:3080 {'
          echo '      header_down Set-Cookie "SameSite=Strict" "SameSite=None"'
          echo '    }'
          echo '  }'
          echo '}'
        } > /opt/wsauth/Caddyfile
      - podman rm -f lcproxy 2>/dev/null || true
      - |
        podman run -d --name lcproxy --restart=always --network host \
          -v /opt/wsauth/Caddyfile:/etc/caddy/Caddyfile:ro \
          docker.io/library/caddy:2 >/dev/null

  # RisingWave is a streaming database that speaks the Postgres wire protocol.
  # `single_node` collapses meta + compute + frontend + compactor into one
  # process backed by an embedded SQLite meta store and a local-FS object
  # store, so the box needs no MinIO/Postgres sidecars — which is what makes
  # it a one-box recipe rather than a compose stack.
  #
  # Two of its three interesting ports are HTTP and therefore routable:
  #   :5691  dashboard
  #   :4560  webhook source — POST events straight into a table over HTTPS
  # The third, :4566, is Postgres wire protocol. Recipe ports become Caddy
  # HTTP reverse-proxy routes, so :4566 is deliberately NOT listed here; it is
  # published on the box and reached over SSH local-forward instead:
  #   ssh -L 4566:localhost:4566 <box>
  #   psql -h localhost -p 4566 -d dev -U root
  #
  # TCP passthrough does exist on the platform (`containarium passthrough add`,
  # iptables DNAT) — it just isn't reachable from a recipe, because RecipePort
  # has no protocol field. See #1462; when that lands, :4566 moves into the
  # port list as a TCP route and the tunnel becomes optional.
  #
  # Scaling past one box (S3/MinIO state store, external meta store) means the
  # multi-service `standalone` topology, which is a compose stack in a
  # docker-stack box — not this recipe. See docs/integrations/risingwave.md.
  - id: risingwave
    name: RisingWave
    description: Streaming database in single-node mode — Postgres-compatible SQL on :4566, dashboard and webhook ingestion on public hostnames, state on a persistent Podman volume.
    image: images:ubuntu/24.04
    requires_gpu: false
    resources:
      cpu: "8"
      memory: 16GB
      disk: 100GB
    ports:
      - container_port: 5691
        subdomain: dashboard
      - container_port: 4560
        subdomain: webhook
    volumes:
      - name: risingwave-data
        path: /var/lib/risingwave
    parameters:
      - name: version
        label: RisingWave version
        description: Image tag of risingwavelabs/risingwave to run.
        type: string
        default: v3.0.0
      - name: total_memory_bytes
        label: Total memory (bytes)
        description: >-
          Memory RisingWave divides between frontend, compute, and compactor.
          Empty lets it auto-detect, which reads the HOST's available memory
          from inside the LXC and can over-commit the box — set this to
          roughly 80% of the box's memory limit for anything long-lived.
        type: string
        default: ""
      - name: parallelism
        label: Compute parallelism
        description: Streaming/batch parallelism for the compute node. Empty auto-detects from CPU count.
        type: string
        default: ""
    post_start:
      - podman volume create risingwave-data
      - 'podman pull "docker.io/risingwavelabs/risingwave:${CONTAINARIUM_PARAM_VERSION}" >/dev/null'
      - podman rm -f risingwave >/dev/null 2>&1 || true
      # No --user override: the image sets no User, so it already runs as root
      # and writes the root-owned named volume fine (verified on a live box,
      # v3.0.0). An explicit --user root would be a no-op that reads like a
      # deliberate privilege choice.
      #
      # --listen-addr is passed explicitly even though 0.0.0.0:4566 is the
      # frontend default: a loopback bind would silently make the published
      # port unreachable, and that failure looks like a hung psql.
      - |
        podman run -d --name risingwave --restart=always \
          -p 4566:4566 -p 5691:5691 -p 4560:4560 \
          -v risingwave-data:/var/lib/risingwave \
          -e RUST_BACKTRACE=1 \
          "docker.io/risingwavelabs/risingwave:${CONTAINARIUM_PARAM_VERSION}" \
          single_node \
          --store-directory /var/lib/risingwave \
          --listen-addr 0.0.0.0:4566 \
          ${CONTAINARIUM_PARAM_TOTAL_MEMORY_BYTES:+--total-memory-bytes "$CONTAINARIUM_PARAM_TOTAL_MEMORY_BYTES"} \
          ${CONTAINARIUM_PARAM_PARALLELISM:+--parallelism "$CONTAINARIUM_PARAM_PARALLELISM"} >/dev/null
      # Block until SQL accepts connections so a boot failure — most often a
      # host without the AVX2/NEON SIMD extensions RisingWave requires —
      # surfaces at deploy time instead of on the user's first psql.
      - |
        for _ in $(seq 1 90); do
          if (exec 3<>/dev/tcp/127.0.0.1/4566) 2>/dev/null; then
            echo "risingwave: SQL up on :4566, dashboard :5691, webhook :4560"
            exit 0
          fi
          sleep 2
        done
        echo "risingwave: :4566 did not open in 180s -- check 'podman logs risingwave'" >&2
        exit 1

  # mem0 is the AGENT MEMORY service: a long-lived box running the mem0
  # OSS REST server (FastAPI) over pgvector, so agents get durable
  # add/search memory scoped by user_id / agent_id / run_id instead of
  # starting every run blank.
  #
  # Built from source on purpose. The only published mem0 API image
  # (docker.io/mem0/mem0-api-server) is arm64-only and a single stale
  # tag, so an amd64 host cannot run it; server/Dockerfile is a plain
  # python:3.12-slim build that pulls mem0ai from PyPI and builds on
  # both arches. Upstream's own docker-compose is explicitly a DEV
  # stack (uvicorn --reload, source bind-mounted over the image) — this
  # recipe deliberately does not reuse it.
  - id: mem0
    name: Mem0
    description: Agent memory server — mem0's REST API on :8000 backed by pgvector Postgres, with optional dashboard. Memories scoped by user_id/agent_id/run_id and persisted on a box volume.
    image: images:ubuntu/24.04
    requires_gpu: false
    resources:
      cpu: "4"
      memory: 8GB
      disk: 40GB
    ports:
      - container_port: 8000
        subdomain: api
      - container_port: 3000
        subdomain: dashboard
    volumes:
      - name: mem0-data
        path: /var/lib/mem0
    # Route mem0's own LLM + embedding calls through the managed model-gateway.
    # mem0 honours OPENAI_BASE_URL for both its LLM and its embedder, so the box
    # never holds a real provider key and every extraction/embedding call is
    # metered per tenant. Inert when the daemon holds no OpenAI key — the box
    # then falls back to the openai_api_key parameter (self-hosted default).
    model_gateway_provider: openai
    parameters:
      - name: version
        label: Mem0 version
        description: Git tag of mem0ai/mem0 to build the API server from.
        type: string
        default: v2.0.18
      - name: postgres_password
        label: Postgres password
        description: Password for the bundled pgvector Postgres. Never leaves the box — Postgres binds 127.0.0.1 only.
        type: password
        required: true
      - name: admin_email
        label: Admin email
        description: >-
          Email for the first (admin) mem0 account, created at deploy. Must be a
          real, non-reserved domain: mem0 validates it with pydantic's EmailStr,
          which rejects special-use domains (.local, .localhost, .invalid, .test)
          with a 422 that would fail the deploy at the seeding step.
        type: string
        default: admin@example.com
      - name: admin_password
        label: Admin password
        description: Password for the admin account. Empty generates one and writes it to /var/lib/mem0/credentials in the box.
        type: password
        default: ""
      - name: jwt_secret
        label: JWT secret
        description: Signing secret for mem0's own dashboard sessions. Empty generates one.
        type: password
        default: ""
      - name: openai_api_key
        label: OpenAI API key
        description: >-
          Provider key, used ONLY when the daemon seeds no managed
          model-gateway. Leave empty on a platform that brokers models — the
          gateway token is injected instead and no real key enters the box.
          REQUIRED when there is no gateway: mem0 constructs its embedder at
          import, so a keyless box never finishes starting.
        type: password
        default: ""
      - name: llm_model
        label: LLM model
        description: Model mem0 uses to extract facts from conversations.
        type: string
        default: gpt-5-mini
      - name: embedder_model
        label: Embedding model
        description: Model mem0 uses to embed memories for semantic search.
        type: string
        default: text-embedding-3-small
      - name: dashboard_url
        label: Public API URL for the dashboard
        description: >-
          Public https URL this box's API port will be reachable at (the
          `api` subdomain route). The dashboard is a browser app, so it needs
          the URL the BROWSER can reach, which the box cannot know itself.
          Empty skips the dashboard and runs API-only.
        type: string
        default: ""
    post_start:
      - mkdir -p /var/lib/mem0/pgdata /var/lib/mem0/history
      - command -v curl >/dev/null 2>&1 && command -v git >/dev/null 2>&1 && command -v openssl >/dev/null 2>&1 && command -v python3 >/dev/null 2>&1 || { export DEBIAN_FRONTEND=noninteractive; apt-get update -qq && apt-get install -y -qq curl git openssl python3 >/dev/null; }
      # pgvector is pinned to a multi-arch tag (amd64 + arm64). Bound to
      # 127.0.0.1: the box shares one netns with its podman containers, and
      # only ports named in `ports:` are routed publicly — binding loopback
      # keeps Postgres off the box's routable interface regardless.
      - 'podman pull docker.io/pgvector/pgvector:0.8.6-pg17 >/dev/null'
      - podman rm -f mem0-pg >/dev/null 2>&1 || true
      - |
        podman run -d --name mem0-pg --restart=always --network host \
          --shm-size 128m \
          -e POSTGRES_USER=postgres \
          -e "POSTGRES_PASSWORD=${CONTAINARIUM_PARAM_POSTGRES_PASSWORD}" \
          -v /var/lib/mem0/pgdata:/var/lib/postgresql/data \
          docker.io/pgvector/pgvector:0.8.6-pg17 \
          -c listen_addresses=127.0.0.1 >/dev/null
      - |
        for _ in $(seq 1 60); do
          if podman exec mem0-pg pg_isready -q -U postgres 2>/dev/null; then break; fi
          sleep 2
        done
        podman exec mem0-pg pg_isready -q -U postgres || {
          echo "mem0: Postgres did not become ready in 120s -- check 'podman logs mem0-pg'" >&2; exit 1; }
      # Two databases, mirroring upstream's init-db.sh: `postgres` holds the
      # vector memories, `mem0_app` holds users/api-keys/audit. Both idempotent
      # so a re-run is safe.
      # Postgres has no CREATE DATABASE IF NOT EXISTS, so this is a
        # check-then-create. Upstream's init-db.sh uses psql's \gexec, which is
        # a META-command: it works only on stdin (their heredoc), and is sent as
        # literal SQL — a syntax error — when passed through `psql -c`.
      - |
        podman exec -u postgres mem0-pg psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'mem0_app'" | grep -q 1 \
          || podman exec -u postgres mem0-pg createdb mem0_app
        podman exec -u postgres mem0-pg psql -v ON_ERROR_STOP=1 -d postgres \
          -c "CREATE EXTENSION IF NOT EXISTS vector" >/dev/null
      # stdout is silenced, stderr deliberately is NOT: a bad tag or a network
        # failure otherwise surfaces as a bare "exit 128" with no reason. The
        # guard makes a re-run a no-op instead of a clone-into-non-empty-dir
        # failure.
      - |
        if [ ! -d /var/lib/mem0/src/.git ]; then
          rm -rf /var/lib/mem0/src
          git -c advice.detachedHead=false clone --depth 1 --branch "${CONTAINARIUM_PARAM_VERSION}" \
            https://github.com/mem0ai/mem0 /var/lib/mem0/src >/dev/null
        fi
      # Upstream's server/requirements.txt asks for plain `psycopg`, the
        # pure-Python distribution, while server/Dockerfile builds on
        # python:3.12-slim — which ships no libpq. The image builds clean and
        # then cannot reach Postgres at all ("no pq wrapper available") on
        # every startup. psycopg[binary] is a manylinux wheel with libpq
        # bundled, so this needs no apt layer. Drop when upstream fixes it.
      - |
        grep -q 'psycopg\[binary\]' /var/lib/mem0/src/server/requirements.txt \
          || printf '\npsycopg[binary]>=3.2.8\n' >> /var/lib/mem0/src/server/requirements.txt
      # Build context is server/ — its Dockerfile is self-contained (installs
      # mem0ai from PyPI), unlike dev.Dockerfile which needs the repo root.
      - 'podman build -t "localhost/mem0-api-server:${CONTAINARIUM_PARAM_VERSION}" /var/lib/mem0/src/server >/dev/null'
      # env-file semantics keep values literal (base64 secrets contain '=' and
      # '/'; nothing here is shell-expanded) — never bash-source this file.
      - |
        JWT="${CONTAINARIUM_PARAM_JWT_SECRET}"
        [ -n "$JWT" ] || JWT="$(openssl rand -base64 48 | tr -d '\n')"
        # Managed gateway wins over any user-supplied key. The OpenAI SDK
        # appends /chat/completions and /embeddings to its base URL, and the
        # gateway strips the /v1/model/<provider> prefix before forwarding —
        # so the base must carry the upstream's own /v1.
        if [ -n "${CONTAINARIUM_MODEL_GATEWAY_URL:-}" ] && [ -n "${CONTAINARIUM_GATEWAY_TOKEN:-}" ]; then
          KEY="$CONTAINARIUM_GATEWAY_TOKEN"
          BASE="${CONTAINARIUM_MODEL_GATEWAY_URL}/v1"
        else
          KEY="${CONTAINARIUM_PARAM_OPENAI_API_KEY}"
          BASE="https://api.openai.com/v1"
          # mem0's server builds its embedder at IMPORT time (main.py's
          # module-level initialize_state), so an absent key is not a degraded
          # box that fails on add/search -- uvicorn dies before it binds and
          # --restart=always turns that into a silent crash loop. Fail the
          # deploy here, where the reason is still visible.
          if [ -z "$KEY" ]; then
            echo "mem0: no managed model-gateway is seeded, so the openai_api_key parameter is required -- redeploy with it set" >&2
            exit 1
          fi
        fi
        umask 077
        {
          echo "POSTGRES_HOST=127.0.0.1"
          echo "POSTGRES_PORT=5432"
          echo "POSTGRES_DB=postgres"
          echo "POSTGRES_USER=postgres"
          echo "POSTGRES_PASSWORD=${CONTAINARIUM_PARAM_POSTGRES_PASSWORD}"
          echo "POSTGRES_COLLECTION_NAME=memories"
          echo "APP_DB_NAME=mem0_app"
          echo "JWT_SECRET=$JWT"
          echo "AUTH_DISABLED=false"
          echo "MEM0_TELEMETRY=false"
          echo "MEM0_DEFAULT_LLM_MODEL=${CONTAINARIUM_PARAM_LLM_MODEL}"
          echo "MEM0_DEFAULT_EMBEDDER_MODEL=${CONTAINARIUM_PARAM_EMBEDDER_MODEL}"
          echo "OPENAI_API_KEY=$KEY"
          echo "OPENAI_BASE_URL=$BASE"
          echo "DASHBOARD_URL=${CONTAINARIUM_PARAM_DASHBOARD_URL}"
          echo "PYTHONUNBUFFERED=1"
        } > /var/lib/mem0/env
      # The image's own CMD carries uvicorn --reload (upstream ships one
      # Dockerfile for dev and prod) and nothing runs migrations. Override with
      # an explicit alembic-then-serve: alembic is idempotent, so --restart
      # replays it harmlessly.
      - podman rm -f mem0-api >/dev/null 2>&1 || true
      - |
        podman run -d --name mem0-api --restart=always --network host \
          --env-file /var/lib/mem0/env \
          -v /var/lib/mem0/history:/app/history \
          "localhost/mem0-api-server:${CONTAINARIUM_PARAM_VERSION}" \
          sh -c "alembic upgrade head && exec uvicorn main:app --host 0.0.0.0 --port 8000" >/dev/null
      - |
        for _ in $(seq 1 90); do
          if curl -fsS http://127.0.0.1:8000/auth/setup-status >/dev/null 2>&1; then break; fi
          sleep 2
        done
        curl -fsS http://127.0.0.1:8000/auth/setup-status >/dev/null || {
          echo "mem0: API did not come up in 180s -- check 'podman logs mem0-api'" >&2; exit 1; }
      # Headless equivalent of upstream's scripts/seed.sh: register the first
      # admin, log in, mint an API key. Done here rather than left to the
      # dashboard wizard so the box is usable from the CLI the moment it is up,
      # and so a dashboard-less (API-only) deploy is still complete.
      - |
        umask 077
        ADMIN_PW="${CONTAINARIUM_PARAM_ADMIN_PASSWORD}"
        [ -n "$ADMIN_PW" ] || ADMIN_PW="$(openssl rand -base64 18 | tr -d '\n')"
        NEEDS="$(curl -fsS http://127.0.0.1:8000/auth/setup-status | python3 -c 'import sys,json; print(json.load(sys.stdin).get("needsSetup", True))')"
        if [ "$NEEDS" = "True" ]; then
          EMAIL="${CONTAINARIUM_PARAM_ADMIN_EMAIL}" PW="$ADMIN_PW" python3 -c 'import json,os; print(json.dumps({"name":"Admin","email":os.environ["EMAIL"],"password":os.environ["PW"]}))' > /var/lib/mem0/.register.json
          curl -fsS -X POST http://127.0.0.1:8000/auth/register -H 'Content-Type: application/json' -d @/var/lib/mem0/.register.json >/dev/null
          rm -f /var/lib/mem0/.register.json
        fi
        EMAIL="${CONTAINARIUM_PARAM_ADMIN_EMAIL}" PW="$ADMIN_PW" python3 -c 'import json,os; print(json.dumps({"email":os.environ["EMAIL"],"password":os.environ["PW"]}))' > /var/lib/mem0/.login.json
        TOKEN="$(curl -fsS -X POST http://127.0.0.1:8000/auth/login -H 'Content-Type: application/json' -d @/var/lib/mem0/.login.json | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')"
        rm -f /var/lib/mem0/.login.json
        API_KEY="$(curl -fsS -X POST http://127.0.0.1:8000/api-keys -H 'Content-Type: application/json' -H "Authorization: Bearer $TOKEN" -d '{"label": "recipe-deploy"}' | python3 -c 'import sys,json; print(json.load(sys.stdin)["key"])')"
        {
          echo "email=${CONTAINARIUM_PARAM_ADMIN_EMAIL}"
          echo "password=$ADMIN_PW"
          echo "api_key=$API_KEY"
        } > /var/lib/mem0/credentials
        echo "mem0: admin=${CONTAINARIUM_PARAM_ADMIN_EMAIL} api_key=$API_KEY (also at /var/lib/mem0/credentials, mode 0600)"
      # Dashboard is optional and needs the PUBLIC api URL, because it runs in
      # the operator's browser, not in the box. Its image substitutes
      # NEXT_PUBLIC_* at container start (entrypoint.sh), so one build serves
      # any hostname.
      - |
        if [ -n "${CONTAINARIUM_PARAM_DASHBOARD_URL}" ]; then
          podman build -t "localhost/mem0-dashboard:${CONTAINARIUM_PARAM_VERSION}" /var/lib/mem0/src/server/dashboard >/dev/null
          podman rm -f mem0-dashboard >/dev/null 2>&1 || true
          podman run -d --name mem0-dashboard --restart=always --network host \
            -e "NEXT_PUBLIC_API_URL=${CONTAINARIUM_PARAM_DASHBOARD_URL}" \
            -e API_INTERNAL_URL=http://127.0.0.1:8000 \
            -e NEXT_PUBLIC_INSTANCE_NAME=Containarium \
            "localhost/mem0-dashboard:${CONTAINARIUM_PARAM_VERSION}" >/dev/null
          echo "mem0: dashboard on :3000 (API ${CONTAINARIUM_PARAM_DASHBOARD_URL})"
        else
          echo "mem0: dashboard skipped (dashboard_url empty) -- API-only deploy"
        fi
      - 'echo "mem0: REST API up on :8000 -- POST /memories, POST /search, header X-API-Key"'
  # oci-service is the GENERIC single-container service mechanism: run ANY
  # caller-specified OCI image as an always-on service in an isolated box.
  # It is deliberately application-agnostic (open-core line: OSS ships the
  # mechanism); higher layers parameterize it — e.g. the cloud runtime API
  # deploys OpenHands' agent-server image through it. The service's container
  # port is published on the box's port 8080 (the recipe's exposed port), so
  # ingress/expose machinery has one stable port to route regardless of what
  # the image listens on.
  - id: oci-service
    name: OCI Service
    description: Run an OCI image as an always-on service in an isolated box — pull, run with --restart=always, publish one port. Application-agnostic building block.
    image: images:ubuntu/24.04
    requires_gpu: false
    resources:
      cpu: "4"
      memory: 8GB
      disk: 30GB
    ports:
      - container_port: 8080
        subdomain: svc
    parameters:
      - name: oci_image
        label: OCI image
        description: Fully-qualified image reference to run (e.g. ghcr.io/org/app:tag). Must be pullable from the box.
        type: string
        required: true
      - name: service_port
        label: Service port
        description: Port the service listens on INSIDE its container. Published on box port 8080.
        type: string
        default: "8080"
      - name: command
        label: Command
        description: Optional command override — the first token becomes the container entrypoint, the rest its arguments. Empty keeps the image's own entrypoint/cmd.
        type: string
        default: ""
      - name: env_lines
        label: Environment
        description: Optional newline-separated KEY=VALUE lines injected into the container (podman --env-file semantics — everything after '=' is literal, no shell quoting).
        type: string
        default: ""
    post_start:
      - mkdir -p /opt/ocisvc
      # env-file semantics keep values literal (commas/spaces safe) — never
      # bash-source this file.
      - 'printf "%s\n" "${CONTAINARIUM_PARAM_ENV_LINES}" > /opt/ocisvc/env'
      - 'podman pull "${CONTAINARIUM_PARAM_OCI_IMAGE}" >/dev/null'
      # Split the optional command into entrypoint + args. An image whose
      # entrypoint already launches the service would otherwise re-receive
      # its own path as an argument.
      - |
        set -- ${CONTAINARIUM_PARAM_COMMAND}
        ENTRY="${1:-}"
        [ "$#" -gt 0 ] && shift
        podman rm -f ocisvc >/dev/null 2>&1 || true
        podman run -d --name ocisvc --restart=always \
          -p "8080:${CONTAINARIUM_PARAM_SERVICE_PORT}" \
          --env-file /opt/ocisvc/env \
          ${ENTRY:+--entrypoint "$ENTRY"} \
          "${CONTAINARIUM_PARAM_OCI_IMAGE}" "$@" >/dev/null
        echo "oci-service: ${CONTAINARIUM_PARAM_OCI_IMAGE} up on box port 8080 (container port ${CONTAINARIUM_PARAM_SERVICE_PORT})"

  # agentcore-cli puts AWS's own agent toolchain (@aws/agentcore) INSIDE a box,
  # so the box becomes the control plane for agents that run on Amazon Bedrock
  # AgentCore. The runtime stays AWS's; the operator surface becomes ours.
  #
  # This is docs/integrations/pi.md's shape — run the tooling inside the box —
  # applied to AWS's CLI instead of an agent. What it buys (see
  # docs/AGENTCORE-GATEWAY-INTERCEPTOR-SPIKE.md, "Placement C"):
  #
  #   - every `agentcore deploy` / `invoke` is a shell_exec through agent-box,
  #     so the deploy and invoke path is auditable by construction;
  #   - AWS credentials live in the tenant secrets mount (/run/secrets, tmpfs,
  #     0440) instead of on a laptop or in CI;
  #   - the invoke path crosses OUR egress, so eBPF netpolicy and the Tier-3
  #     WAF apply to it — that is the ingress interposition we otherwise have
  #     no place to stand for;
  #   - the box is where the Gateway interceptor Lambda gets built and
  #     registered (examples/agentcore-interceptor/).
  #
  # Credentials are deliberately NOT recipe parameters — a parameter would be
  # recorded in the deploy request. Mount them as a secret named
  # `aws-credentials` (standard AWS shared-credentials INI) and the profile
  # script below points the SDK at it; the file never leaves tmpfs.
  #
  # `agentcore deploy` builds remotely via CodeBuild and pushes to ECR, so it
  # needs no local container runtime and should work in a plain LXC box.
  # `agentcore dev` runs containers locally with source mounted at /app —
  # nested containers in LXC are historically fragile (cf. kind, which cannot
  # run nested at all: /dev/kmsg is blocked). This recipe does NOT promise the
  # `dev` path works; test it before relying on it.
  - id: agentcore-cli
    name: AgentCore CLI
    description: Box preloaded with AWS's @aws/agentcore CLI (Node 20 + uv + awscli) for creating, deploying, and invoking agents on Amazon Bedrock AgentCore. Credentials come from the `aws-credentials` secret, never from a parameter.
    image: images:ubuntu/24.04
    requires_gpu: false
    resources:
      cpu: "2"
      memory: 4GB
      disk: 30GB
    parameters:
      - name: aws_region
        label: AWS region
        description: Region AgentCore resources are created in. Note AgentCore is not available in every region — check availability before choosing.
        type: string
        default: us-west-2
      - name: agentcore_version
        label: AgentCore CLI version
        description: npm version spec for @aws/agentcore (e.g. 1.2.3). Empty installs the latest published version.
        type: string
        default: ""
    post_start:
      - DEBIAN_FRONTEND=noninteractive apt-get update -qq
      - DEBIAN_FRONTEND=noninteractive apt-get install -y curl unzip git ca-certificates
      - 'curl -fsSL https://deb.nodesource.com/setup_20.x | bash -'
      - DEBIAN_FRONTEND=noninteractive apt-get install -y nodejs
      - 'npm install -g "@aws/agentcore${CONTAINARIUM_PARAM_AGENTCORE_VERSION:+@$CONTAINARIUM_PARAM_AGENTCORE_VERSION}"'
      # uv is required for Python agents (the default template language).
      - 'curl -fsSL https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin sh'
      # awscli is how the interceptor Lambda gets deployed and how the gateway
      # is wired; the agentcore CLI does not cover those verbs.
      # `uname -m` yields exactly the suffixes AWS publishes (x86_64 /
      # aarch64), so this is a 1:1 map — hardcoding x86_64 failed
      # provisioning outright on an arm64 host, since this step is not
      # best-effort.
      - 'curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-$(uname -m).zip" -o /tmp/awscli.zip && unzip -q /tmp/awscli.zip -d /tmp && /tmp/aws/install --update && rm -rf /tmp/awscli.zip /tmp/aws'
      - mkdir -p /opt/agentcore
      # Point the SDK at the secrets mount rather than copying anything to
      # disk. Conditional, so a box provisioned before the secret exists still
      # comes up green and picks the credentials up on the next login.
      # Unquoted heredoc so the region is baked in at provision time; the
      # runtime references stay literal via backslash escapes.
      - |
        cat > /etc/profile.d/10-agentcore.sh <<PROFILE
        export AWS_REGION="${CONTAINARIUM_PARAM_AWS_REGION:-us-west-2}"
        export AWS_DEFAULT_REGION="\$AWS_REGION"
        if [ -r /run/secrets/aws-credentials ]; then
          export AWS_SHARED_CREDENTIALS_FILE=/run/secrets/aws-credentials
        fi
        PROFILE
      - chmod 0644 /etc/profile.d/10-agentcore.sh
      - 'echo "agentcore-cli: $(agentcore --version 2>/dev/null || echo installed), region ${CONTAINARIUM_PARAM_AWS_REGION:-us-west-2}; set the aws-credentials secret to authenticate"'
