# Containarium Crew Catalog
#
# A crew is a collaborating set of skills bound to a task purpose. The crew
# mechanism is generic; the single entry below is a deliberately task-agnostic
# reference crew that proves the runtime end-to-end. Opinionated/domain crews
# (compliance, research, etc.) are built on this mechanism and ship OUTSIDE
# this repo.
#
# topology: pipeline | orchestrator | freeform
# RunCrew validates that every A2A edge the topology implies is permitted by
# the members' allowed_peers (and thus by the Phase 2 network policy) before
# provisioning anything — so a crew's wiring can never ask for a hop the trust
# fabric would drop.

crews:
  - id: hello-crew
    name: Hello Crew
    description: Neutral reference crew. relay-agent forwards a task to hello-agent; proves crew topology + A2A wiring end-to-end.
    topology: pipeline
    skill_ids:
      - relay-agent   # relay-agent.allowed_peers includes hello-agent, so the
      - hello-agent   # pipeline edge relay -> hello is permitted.

  # freeform-crew is the reference crew for the freeform topology (#1552).
  # FREEFORM implies no required edges (crewRequiredEdges in crew_server.go) —
  # members coordinate within whatever their own allowed_peers permit, rather
  # than the crew dictating a fixed pipeline/orchestrator order — so it reuses
  # the same two neutral skills as hello-crew: relay-agent (entry) delegates to
  # hello-agent within its existing allowed_peers. Exists so a freeform crew is
  # actually runnable rather than only documented (list_crews already
  # advertises freeform as an option); no eventual task content required.
  - id: freeform-crew
    name: Freeform Crew
    description: Neutral reference crew using freeform topology. relay-agent is the entry point and may delegate to hello-agent within its allowed_peers; proves the freeform code path end-to-end.
    topology: freeform
    skill_ids:
      - relay-agent
      - hello-agent

  # diff-crew is the reference crew for the shared-workspace joint-editing
  # scenario (cloud#1549 Layer 2). Pipeline topology: diff-drafter's artifact
  # (whole-file content, cloud#1738) becomes diff-reviewer's task input via
  # driveCrew's own PIPELINE hand-off — no new turn-taking mechanism needed,
  # the existing A2A chain IS the collaboration. Run with git_source/git_ref
  # set (cloud#1554) so both members check out the SAME commit into their
  # own per-run workspace; the crew's own artifact (the reviewer's final
  # files) is the joint result of both agents, and — on the cloud side —
  # what an "opens-pr"-capable catalog entry turns into a real PR (cloud#1738).
  - id: diff-crew
    name: Diff Crew
    description: Two agents jointly edit a repo — diff-drafter proposes a small change, diff-reviewer finalizes it against its own checkout of the same commit.
    topology: pipeline
    skill_ids:
      - diff-drafter   # diff-drafter.allowed_peers includes diff-reviewer,
      - diff-reviewer  # so the pipeline edge drafter -> reviewer is permitted.

  # engineer-crew (Containarium-cloud#2003, Phase 3 Story 1 of the
  # coding-agent issue-to-PR PRD): a GitHub issue in, a reviewed change with
  # a PR title/body out. Reuses diff-crew's own reviewer stage unchanged in
  # role — issue-implementer's artifact IS diff-reviewer's task input via
  # the same PIPELINE hand-off diff-crew uses, no new turn-taking mechanism.
  # This skill makes no GitHub calls itself: reading the issue and opening
  # the PR from this artifact are both the cloud control plane's job
  # (FootprintAI/Containarium-cloud, not this repo) — `containarium crew run
  # engineer-crew --git-source <url> --git-ref <ref> --input-json <task>`
  # is fully generic already (crew_ops.go), so no CLI/MCP changes were
  # needed to make this runnable.
  - id: engineer-crew
    name: Engineer Crew
    description: Turns a GitHub issue into a reviewed file change with a PR title and body. issue-implementer reads the issue-shaped task and makes the change; diff-reviewer finalizes it against its own checkout of the same commit.
    topology: pipeline
    skill_ids:
      - issue-implementer  # issue-implementer.allowed_peers includes
      - diff-reviewer      # diff-reviewer, so this pipeline edge is permitted.
