version: v2
deps:
  - buf.build/googleapis/googleapis
  - buf.build/grpc-ecosystem/grpc-gateway
modules:
  - path: proto
lint:
  # Legacy names kept for wire/API compatibility (#2481). Waived here rather
  # than with in-source buf:lint:ignore comments, which are copied into the
  # generated swagger and Go docs (#2549). Do not add new entries for new RPCs.
  use:
    - STANDARD
  ignore_only:
    ENUM_ZERO_VALUE_SUFFIX:
      - proto/containarium/v1/container.proto
    RPC_REQUEST_RESPONSE_UNIQUE:
      - proto/containarium/cloud/v1/actuation_service.proto
      - proto/containarium/v1/anonbox.proto
      - proto/containarium/v1/network_policy.proto
      - proto/containarium/v1/ssh_authz.proto
    RPC_REQUEST_STANDARD_NAME:
      - proto/containarium/v1/guardrail.proto
      - proto/containarium/v1/sandbox.proto
      - proto/containarium/v1/ssh_authz.proto
    RPC_RESPONSE_STANDARD_NAME:
      - proto/containarium/cloud/v1/actuation_service.proto
      - proto/containarium/v1/anonbox.proto
      - proto/containarium/v1/events.proto
      - proto/containarium/v1/guardrail.proto
      - proto/containarium/v1/network.proto
      - proto/containarium/v1/network_policy.proto
      - proto/containarium/v1/sandbox.proto
      - proto/containarium/v1/ssh_authz.proto
      - proto/containarium/v1/traffic.proto
breaking:
  use:
    - FILE
  # #2733 (slice B of #2263) deliberately removes the bridge-DNS status
  # surface: the GetBridgeDNSStatus RPC, its request/response messages and the
  # BridgeDNSState enum. Decision recorded on #2733: waive only these three
  # rules for only these two files, no deprecated stub RPC. The gate compares
  # against the PR base, so once #2733 is on main nothing here is needed any
  # more; delete these entries in the next proto change rather than leaving
  # the two files exempt from delete checks.
  ignore_only:
    ENUM_NO_DELETE:
      - proto/containarium/v1/config.proto
    MESSAGE_NO_DELETE:
      - proto/containarium/v1/config.proto
    RPC_NO_DELETE:
      - proto/containarium/v1/service.proto
