syntax = "proto3";

package containarium.v1;

option go_package = "github.com/footprintai/containarium/pkg/pb/containarium/v1;containariumv1";

import "containarium/v1/config.proto";
import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

// NetworkPolicyService — the control-plane CRUD for per-tenant network
// isolation policies (Phase A of the eBPF network-isolation design, #315).
//
// This is the policy *store* surface: operators (and the cloud control plane)
// set/get/list/delete a tenant's NetworkPolicy here; the per-veth TC_INGRESS
// BPF loader (a later increment) consumes the stored policies and programs the
// kernel. Admin-only — policies are fleet-shaping config, not tenant-editable.
service NetworkPolicyService {
  // SetNetworkPolicy creates or replaces a tenant's policy (upsert by tenant).
  // The policy is validated + normalized; the stored form is echoed back.
  rpc SetNetworkPolicy(SetNetworkPolicyRequest) returns (SetNetworkPolicyResponse) {
    option (google.api.http) = {
      post: "/v1/network-policies"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Set network policy";
      description: "Create or replace a tenant's network-isolation policy (validated + normalized). Admin-only.";
      tags: "NetworkPolicy";
    };
  }

  // GetNetworkPolicy returns a tenant's policy, or NotFound if none is set.
  rpc GetNetworkPolicy(GetNetworkPolicyRequest) returns (GetNetworkPolicyResponse) {
    option (google.api.http) = {
      get: "/v1/network-policies/{tenant}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get network policy";
      description: "Return a tenant's network-isolation policy. Admin-only.";
      tags: "NetworkPolicy";
    };
  }

  // ListNetworkPolicies returns every tenant's policy.
  rpc ListNetworkPolicies(ListNetworkPoliciesRequest) returns (ListNetworkPoliciesResponse) {
    option (google.api.http) = {
      get: "/v1/network-policies"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List network policies";
      description: "List every tenant's network-isolation policy. Admin-only.";
      tags: "NetworkPolicy";
    };
  }

  // DeleteNetworkPolicy removes a tenant's policy. Idempotent — deleting a
  // missing policy is not an error.
  rpc DeleteNetworkPolicy(DeleteNetworkPolicyRequest) returns (DeleteNetworkPolicyResponse) {
    option (google.api.http) = {
      delete: "/v1/network-policies/{tenant}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Delete network policy";
      description: "Remove a tenant's network-isolation policy (idempotent). Admin-only.";
      tags: "NetworkPolicy";
    };
  }

  // PatchNetworkPolicyDenyRules atomically adds/removes a tenant's virtual-patch
  // deny rules (#660) under a store-side lock, so concurrent edits don't lose
  // updates and `SetNetworkPolicy` (the allow-policy) never has to round-trip
  // through the client to preserve them. Echoes the normalized stored policy.
  rpc PatchNetworkPolicyDenyRules(PatchNetworkPolicyDenyRulesRequest) returns (SetNetworkPolicyResponse) {
    option (google.api.http) = {
      post: "/v1/network-policies/deny-rules"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Patch network-policy deny rules";
      description: "Atomically add/remove a tenant's virtual-patch deny rules (#660). Admin-only.";
      tags: "NetworkPolicy";
    };
  }

  // PlanNetworkPolicy reports which destinations a tenant's boxes reached
  // that the tenant's policy denied (log-only) or dropped (enforce) in a recent
  // window, aggregated by destination, so an allow-list can be written from
  // what the tenant actually does and checked before it is armed (#2440).
  // Read-only; it changes nothing.
  rpc PlanNetworkPolicy(PlanNetworkPolicyRequest) returns (PlanNetworkPolicyResponse) {
    option (google.api.http) = {
      get: "/v1/network-policies/{tenant}/plan"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Plan network policy";
      description: "List the destinations a tenant's boxes reached that its policy denied or dropped in a recent window, so an egress allow-list can be written from observed behaviour and checked before enforcement. Admin-only.";
      tags: "NetworkPolicy";
    };
  }

  // GetNetworkPolicyStatus reports what THIS daemon has actually loaded into
  // the kernel for a tenant: the effective modes after the host's enforce
  // guard, when it was last reconciled, whether enforcement is armed here, and the
  // traffic the eBPF program does not cover. It reads the applied BPF state,
  // not the stored policy, and says unknown when it cannot tell. Read-only.
  rpc GetNetworkPolicyStatus(GetNetworkPolicyStatusRequest) returns (GetNetworkPolicyStatusResponse) {
    option (google.api.http) = {
      get: "/v1/network-policies/{tenant}/status"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get network policy status";
      description: "Report what this daemon has actually loaded for a tenant: effective mode and egress mode (after the host's enforce guard), last reconcile time, whether enforcement is armed on this host, and uncovered traffic paths. Reads the applied state, not the stored policy. Admin-only.";
      tags: "NetworkPolicy";
    };
  }

  // SetNetworkPolicySignature creates or replaces a global operator exploit
  // signature (#661 Tier 2, upsert by name). Validated + normalized; the stored
  // form (with its assigned id) is echoed back.
  rpc SetNetworkPolicySignature(SetNetworkPolicySignatureRequest) returns (SetNetworkPolicySignatureResponse) {
    option (google.api.http) = {
      post: "/v1/network-policy-signatures"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Set network-policy signature";
      description: "Create or replace a global cleartext exploit signature (#661). Admin-only.";
      tags: "NetworkPolicy";
    };
  }

  // ListNetworkPolicySignatures returns every operator-managed signature (the
  // built-in curated set is implicit and not listed here).
  rpc ListNetworkPolicySignatures(ListNetworkPolicySignaturesRequest) returns (ListNetworkPolicySignaturesResponse) {
    option (google.api.http) = {
      get: "/v1/network-policy-signatures"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List network-policy signatures";
      description: "List every operator-managed exploit signature (#661). Admin-only.";
      tags: "NetworkPolicy";
    };
  }

  // DeleteNetworkPolicySignature removes an operator signature by name.
  // Idempotent.
  rpc DeleteNetworkPolicySignature(DeleteNetworkPolicySignatureRequest) returns (DeleteNetworkPolicySignatureResponse) {
    option (google.api.http) = {
      delete: "/v1/network-policy-signatures/{name}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Delete network-policy signature";
      description: "Remove an operator-managed exploit signature (#661, idempotent). Admin-only.";
      tags: "NetworkPolicy";
    };
  }
}

// PlanNetworkPolicyRequest selects the tenant and the look-back window.
message PlanNetworkPolicyRequest {
  // Tenant to plan for (required).
  string tenant = 1;
  // Look-back window in minutes. <= 0 means 60; capped at 10080 (one week).
  int32 since_minutes = 2;
}

// PlanDestination is one destination the tenant's policy denied or dropped,
// aggregated over the window.
message PlanDestination {
  // Destination IPv4 address.
  string ip = 1;
  // Destination port (0 when the flow had none, e.g. ICMP).
  uint32 port = 2;
  // IP protocol: "tcp", "udp", or the number for anything else.
  string protocol = 3;
  // Number of denied/dropped flows seen (per-flow audit rows).
  uint32 count = 4;
  // True when at least one of the flows was actually dropped (enforce armed),
  // false when all were only logged (log-only or enforcement not armed).
  bool dropped = 5;
  // When the most recent such flow was seen.
  google.protobuf.Timestamp last_seen = 6;
}

// PlanNetworkPolicyResponse is the aggregated would-block / blocked set.
message PlanNetworkPolicyResponse {
  string tenant = 1;
  // Window actually used, in minutes (after defaulting and capping).
  int32 since_minutes = 2;
  // Destinations the policy denied, busiest first. Excludes any destination
  // the tenant's current egress CIDRs (or the preset's implicit resolver)
  // already allow, so stale rows from before an allow-list edit do not show.
  repeated PlanDestination destinations = 3;
  // Audit rows examined.
  uint32 rows_scanned = 4;
  // True when the row cap was hit, so the list may be missing the oldest
  // flows in the window.
  bool truncated = 5;
  // Caveats the caller should show, e.g. that destinations allowed by
  // egress_domains are not subtracted.
  repeated string notes = 6;
}

// GetNetworkPolicyStatusRequest names the tenant to report on.
message GetNetworkPolicyStatusRequest {
  // Tenant to report on (required).
  string tenant = 1;
}

// GetNetworkPolicyStatusResponse carries the tenant's applied state.
message GetNetworkPolicyStatusResponse {
  NetworkPolicyStatus status = 1;
}

// NetworkPolicyAppliedState says whether this daemon has a tenant's policy
// loaded, and so whether the effective modes can be read at all.
enum NetworkPolicyAppliedState {
  // The daemon cannot tell (e.g. the enforcer is running but has not yet
  // completed a reconcile pass). Effective modes are UNSPECIFIED.
  NETWORK_POLICY_APPLIED_STATE_UNSPECIFIED = 0;
  // No eBPF enforcer is running on this daemon (not configured, or it failed
  // to load), so nothing is enforced or observed. Effective modes are
  // UNSPECIFIED.
  NETWORK_POLICY_APPLIED_STATE_ENFORCER_NOT_RUNNING = 1;
  // The enforcer is running but no running box of this tenant has a policy
  // loaded (no running boxes, or none could be attached). Effective modes are
  // UNSPECIFIED.
  NETWORK_POLICY_APPLIED_STATE_NOT_LOADED = 2;
  // Every running box of the tenant has its policy loaded; the effective
  // modes are what the kernel holds for all of them.
  NETWORK_POLICY_APPLIED_STATE_LOADED = 3;
  // Some, but not all, of the tenant's running boxes have the policy loaded
  // (boxes_not_loaded > 0). The effective modes are what the kernel holds for
  // the loaded boxes only; the traffic of the other boxes is not policed, so
  // the tenant is NOT fully covered.
  NETWORK_POLICY_APPLIED_STATE_PARTIALLY_LOADED = 4;
  // The last completed reconcile pass is too old to trust (older than three
  // reconcile intervals): the reconciler is stalled, e.g. every pass fails
  // to read the containers or the policy store. What the kernel holds now is
  // unknown, so the effective modes and box counts are UNSPECIFIED;
  // last_reconciled_at shows how old the last good pass is.
  NETWORK_POLICY_APPLIED_STATE_STALE = 5;
}

// NetworkPolicyUncoveredPath is traffic the eBPF policy does not decide.
enum NetworkPolicyUncoveredPath {
  NETWORK_POLICY_UNCOVERED_PATH_UNSPECIFIED = 0;
  // IPv6: the program parses IPv4 only, so IPv6 traffic passes unchecked.
  NETWORK_POLICY_UNCOVERED_PATH_IPV6 = 1;
  // Domain entries: egress_domains are re-resolved on a refresh loop (at
  // most every 60 seconds, sooner for a shorter record TTL), so an address a
  // domain moves to is denied, and an address it left still allowed, until
  // the next refresh and reconcile.
  NETWORK_POLICY_UNCOVERED_PATH_DOMAIN_REFRESH_LAG = 2;
  // The host kernel cannot run egress enforcement. Reserved: not reported
  // yet; the host kernel check that sets it is tracked separately (#2972).
  NETWORK_POLICY_UNCOVERED_PATH_KERNEL_UNSUPPORTED = 3;
  // The tenant's egress allow-list in the kernel is not what its policy says:
  // the last reconcile pass failed to add or remove at least one entry. In
  // enforce mode a missing entry denies traffic the policy allows, and an entry
  // that could not be removed keeps allowing traffic the policy no longer does.
  // The failed entries are retried on the next pass.
  NETWORK_POLICY_UNCOVERED_PATH_EGRESS_ALLOWLIST_INCOMPLETE = 4;
}

// NetworkPolicyStatus is a tenant's applied network policy on this daemon.
message NetworkPolicyStatus {
  string tenant = 1;
  // Whether the policy is loaded here; the modes below are only meaningful
  // when it is LOADED or PARTIALLY_LOADED (for PARTIALLY_LOADED they cover
  // the loaded boxes only).
  NetworkPolicyAppliedState state = 2;
  // Mode the kernel applies to the cross-tenant, intra-tenant, metadata,
  // virtual-patch and signature checks, after the host's enforce guard.
  // UNSPECIFIED = unknown.
  NetworkPolicyMode effective_mode = 3;
  // Mode the kernel applies to the egress allow-list, after the host's
  // enforce guard. UNSPECIFIED = unknown.
  NetworkPolicyMode effective_egress_mode = 4;
  // End of the last successful reconcile pass on this daemon. Passes run
  // about every 10 seconds (and on container events) and rewrite the kernel
  // config each time, so this is refreshed continuously: it is NOT the time
  // the policy last changed. A value older than a few reconcile intervals
  // means the reconciler is stalled; past three intervals the daemon reports
  // STALE. Unset when no pass has completed (or the enforcer is not running).
  google.protobuf.Timestamp last_reconciled_at = 5;
  // Whether this host arms enforcement (CONTAINARIUM_NETWORK_POLICY_ENFORCE).
  // When false, a requested ENFORCE is loaded as LOG_ONLY.
  bool enforcement_armed = 6;
  // Running boxes of the tenant whose policy is loaded.
  uint32 boxes_loaded = 7;
  // Running boxes of the tenant whose policy could not be loaded (veth not
  // resolved, map write or attach failed). Their traffic is not policed.
  uint32 boxes_not_loaded = 8;
  // Traffic the loaded policy does not decide.
  repeated NetworkPolicyUncoveredPath uncovered_paths = 9;
}
