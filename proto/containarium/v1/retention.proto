syntax = "proto3";

package containarium.v1;

option go_package = "github.com/footprintai/containarium/pkg/pb/containarium/v1;containariumv1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

// Retention policy and legal holds (#2576, slice A #2875;
// docs/security/DATA-FLOW-AND-RETENTION.md).
//
// This service stores the policy (one window per data class for the whole
// daemon, and a legal hold per org) and reports what a sweep would remove
// (#2876). Nothing is swept or deleted by anything in this file; enforcement
// is a later slice (#2877, #2878, #2879).

// RetentionClass is a kind of customer data with its own retention window.
enum RetentionClass {
  RETENTION_CLASS_UNSPECIFIED = 0;
  // Prompts sent to a model or an agent (default 30 days).
  RETENTION_CLASS_PROMPTS = 1;
  // Model and agent responses (default 30 days).
  RETENTION_CLASS_RESPONSES = 2;
  // Gateway and API access logs (default 90 days).
  RETENTION_CLASS_GATEWAY_LOGS = 3;
  // Session transcripts and session records (default 90 days).
  RETENTION_CLASS_SESSION_TRANSCRIPTS = 4;
  // Evidence bundles such as Proof Packs (default 365 days).
  RETENTION_CLASS_EVIDENCE_BUNDLES = 5;
}

// RetentionWindow is how long one class is kept, at most.
message RetentionWindow {
  RetentionClass class = 1;
  // Days a record of this class is kept, at most. Must be between 1 and
  // 36500 (100 years); the cap keeps a sweeper's cutoff arithmetic in range.
  int32 days = 2;
  // True when no admin has set this class and days is the built-in default.
  // Ignored on a set.
  bool is_default = 3;
}

// RetentionPolicy is the daemon-wide policy: one window for every class.
message RetentionPolicy {
  // Every class, in enum order, set or default.
  repeated RetentionWindow windows = 1;
  // 0 until the first set; every set adds 1.
  int64 revision = 2;
  google.protobuf.Timestamp updated_at = 3;
  string updated_by = 4;
}

// LegalHold stops deletion of an org's records, in every class, until an
// admin releases it. A hold has no expiry.
message LegalHold {
  string org_id = 1;
  string reason = 2;
  string set_by = 3;
  google.protobuf.Timestamp set_at = 4;
}

// RetentionMode is what the sweeper does with the records it finds past
// their window.
enum RetentionMode {
  RETENTION_MODE_UNSPECIFIED = 0;
  // Count and report only; delete nothing. The default.
  RETENTION_MODE_DRY_RUN = 1;
  // Delete the records a dry run lists as eligible: past their class window
  // and not kept by a legal hold. Only the stores outside the hash chain are
  // swept (#2877); the audit_logs classes and evidence bundles are not.
  RETENTION_MODE_ENFORCE = 2;
}

// RetentionSweepStatus is how one store came out of a sweep.
enum RetentionSweepStatus {
  RETENTION_SWEEP_STATUS_UNSPECIFIED = 0;
  // The store was counted; the counts are valid.
  RETENTION_SWEEP_STATUS_COUNTED = 1;
  // The sweeper does not count this store; note says why and where it is
  // handled.
  RETENTION_SWEEP_STATUS_NOT_SWEPT = 2;
  // Counting failed; note carries the error and the counts are zero.
  RETENTION_SWEEP_STATUS_ERROR = 3;
}

// RetentionStoreReport is one (class, store) pair in a retention report. A
// store that holds two classes (a crew run keeps a prompt and a response in
// one row) appears once per class, each against its own window.
message RetentionStoreReport {
  RetentionClass class = 1;
  // The store, such as "agent_tasks"; a table name where there is one.
  string store = 2;
  RetentionSweepStatus status = 3;
  // The class window the cutoff was computed from.
  int32 window_days = 4;
  // Records older than this are past the window. Unset when not swept.
  google.protobuf.Timestamp cutoff = 5;
  // Records past the window, held or not.
  int64 older_than_cutoff = 6;
  // Records an enforcing sweep would remove: past the window and not held.
  int64 eligible = 7;
  // Records past the window that a legal hold keeps. While any hold is
  // active a record with no org attribution counts as held.
  int64 held = 8;
  // Why a store is not swept, or the error of a failed count.
  string note = 9;
  // Records this sweep deleted. Always 0 unless the report's enforced flag is
  // set. A store shared by two classes (a crew run) is deleted once, by the
  // longer of the two windows, and reports the deletion on the class with
  // that window.
  int64 removed = 10;
}

// RetentionReport is the result of one sweep.
message RetentionReport {
  RetentionMode mode = 1;
  google.protobuf.Timestamp generated_at = 2;
  // Revision of the policy the windows came from.
  int64 policy_revision = 3;
  // Legal holds active during the sweep.
  int64 active_holds = 4;
  // Every store, in class then store order.
  repeated RetentionStoreReport stores = 5;
  // True when this sweep deleted the eligible records: the periodic sweep ran
  // in ENFORCE mode. False for a count-only sweep (DRY_RUN mode, or a
  // refresh=true preview, which never deletes).
  bool enforced = 6;
}

// RetentionModeState is the daemon-wide retention mode.
message RetentionModeState {
  RetentionMode mode = 1;
  // Unset until the first set, when the mode is the DRY_RUN default.
  google.protobuf.Timestamp updated_at = 2;
  string updated_by = 3;
}

message GetRetentionModeRequest {}

message GetRetentionModeResponse {
  RetentionModeState state = 1;
}

message SetRetentionModeRequest {
  // DRY_RUN or ENFORCE; UNSPECIFIED or an unknown value is INVALID_ARGUMENT.
  RetentionMode mode = 1;
}

message SetRetentionModeResponse {
  RetentionModeState state = 1;
}

message GetRetentionReportRequest {
  // Run a sweep now instead of returning the last periodic one.
  bool refresh = 1;
}

message GetRetentionReportResponse {
  RetentionReport report = 1;
}

message GetRetentionPolicyRequest {}

message GetRetentionPolicyResponse {
  RetentionPolicy policy = 1;
}

message SetRetentionPolicyRequest {
  // The classes to change. Classes not listed keep their window. A class may
  // appear once; UNSPECIFIED, an unknown class, or days outside 1..36500 is
  // INVALID_ARGUMENT.
  repeated RetentionWindow windows = 1;
}

message SetRetentionPolicyResponse {
  RetentionPolicy policy = 1;
}

message ListLegalHoldsRequest {}

message ListLegalHoldsResponse {
  // Active holds, ordered by org id.
  repeated LegalHold holds = 1;
}

message SetLegalHoldRequest {
  // Required; must not contain '/' (it travels in one REST path segment).
  string org_id = 1;
  // Why the hold exists (a case or ticket reference). Required.
  string reason = 2;
}

message SetLegalHoldResponse {
  LegalHold hold = 1;
}

message ReleaseLegalHoldRequest {
  string org_id = 1;
}

message ReleaseLegalHoldResponse {
  // The hold that was released.
  LegalHold hold = 1;
}

// RetentionService stores the retention policy and legal holds and reports
// what a sweep would remove. Every RPC is
// admin-only. A set, a hold and a release write an audit entry naming the
// caller when the daemon has an audit store; a failed audit write fails the
// change and leaves the store unchanged.
service RetentionService {
  rpc GetRetentionPolicy(GetRetentionPolicyRequest) returns (GetRetentionPolicyResponse) {
    option (google.api.http) = {
      get: "/v1/retention/policy"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get the retention policy";
      description: "Return the window for every data class: the stored value, or the built-in default (30 days prompts and responses, 90 days gateway logs and session transcripts, 365 days evidence bundles) with is_default=true. Nothing is swept by this service. Admin role only.";
      tags: "Retention";
    };
  }
  rpc SetRetentionPolicy(SetRetentionPolicyRequest) returns (SetRetentionPolicyResponse) {
    option (google.api.http) = {
      put: "/v1/retention/policy"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Set retention windows";
      description: "Change the window of the listed classes; other classes keep theirs. UNSPECIFIED, an unknown or repeated class, or days outside 1..36500 is INVALID_ARGUMENT and nothing changes. Increments the revision. With an audit store it writes an audit entry naming the caller while the change is still uncommitted, and a failed write fails the call with INTERNAL and nothing changes (if the commit itself fails after the entry was written, the log keeps an entry for a change that never happened); with no audit store (no Postgres, REST disabled, or an audit store that failed to start) the change succeeds and writes no entry. Admin role only.";
      tags: "Retention";
    };
  }
  rpc ListLegalHolds(ListLegalHoldsRequest) returns (ListLegalHoldsResponse) {
    option (google.api.http) = {
      get: "/v1/retention/holds"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List legal holds";
      description: "Return every active legal hold, ordered by org id. Admin role only.";
      tags: "Retention";
    };
  }
  rpc SetLegalHold(SetLegalHoldRequest) returns (SetLegalHoldResponse) {
    option (google.api.http) = {
      put: "/v1/retention/holds/{org_id}"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Place a legal hold on an org";
      description: "Hold every record of the org until the hold is released; a hold has no expiry. An empty org_id or reason, or an org_id containing '/', is INVALID_ARGUMENT; an org already on hold is ALREADY_EXISTS. Audited like a policy set. Admin role only.";
      tags: "Retention";
    };
  }
  rpc ReleaseLegalHold(ReleaseLegalHoldRequest) returns (ReleaseLegalHoldResponse) {
    option (google.api.http) = {
      delete: "/v1/retention/holds/{org_id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Release an org's legal hold";
      description: "Remove the org's hold. Its records past their window become eligible on the next sweep, with no grace period. An org with no hold is NOT_FOUND. Audited like a policy set. Admin role only.";
      tags: "Retention";
    };
  }
  rpc GetRetentionReport(GetRetentionReportRequest) returns (GetRetentionReportResponse) {
    option (google.api.http) = {
      get: "/v1/retention/report"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get the retention report";
      description: "Return the last sweep: per data class and store, how many records are past the class window, how many a legal hold keeps, and how many an enforcing sweep would remove (and, when the report's enforced flag is set, how many it removed). The daemon sweeps periodically and deletes only in ENFORCE mode; refresh=true runs a count-only preview now and never deletes. The hash-chained audit_logs classes and evidence bundles are listed as NOT_SWEPT with the slice that handles them. Admin role only.";
      tags: "Retention";
    };
  }
  rpc GetRetentionMode(GetRetentionModeRequest) returns (GetRetentionModeResponse) {
    option (google.api.http) = {
      get: "/v1/retention/mode"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get the retention mode";
      description: "Return DRY_RUN (the default: sweeps count and delete nothing) or ENFORCE (sweeps delete the eligible records of the stores outside the hash chain). Admin role only.";
      tags: "Retention";
    };
  }
  rpc SetRetentionMode(SetRetentionModeRequest) returns (SetRetentionModeResponse) {
    option (google.api.http) = {
      put: "/v1/retention/mode"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Set the retention mode";
      description: "Switch between DRY_RUN and ENFORCE. In ENFORCE the next periodic sweep permanently deletes records past their class window that no legal hold keeps, in agent_tasks, agent_task_results, crew_runs and the gateway traffic tables. UNSPECIFIED or an unknown mode is INVALID_ARGUMENT. With an audit store the change writes an audit entry naming the caller while it is still uncommitted, and a failed write fails the call with INTERNAL and nothing changes; with no audit store the change succeeds and writes no entry. Admin role only.";
      tags: "Retention";
    };
  }
}
