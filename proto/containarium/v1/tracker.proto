syntax = "proto3";

package containarium.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/footprintai/containarium/pkg/pb/containarium/v1;containariumv1";

// TrackerProvider identifies the issue tracker / forge a TrackerConnection
// points at. Always explicit, never inferred from base_url's hostname — a
// self-managed host named "git.<company>" can be either product. See
// docs/architecture/agent-tracker-broker.md.
enum TrackerProvider {
  TRACKER_PROVIDER_UNSPECIFIED = 0;

  // github.com (base_url empty) or GitHub Enterprise Server (base_url set).
  TRACKER_PROVIDER_GITHUB = 1;

  // gitlab.com (base_url empty) or self-managed GitLab, including the
  // Free tier's single-assignee-per-issue constraint.
  TRACKER_PROVIDER_GITLAB = 2;
}

// TrackerIssueState is the provider-neutral state of an issue or change
// request (GitHub pull request / GitLab merge request) — one enum
// rather than GitHub's "open"/"closed" and GitLab's "opened"/"closed"/
// "merged" strings.
enum TrackerIssueState {
  TRACKER_ISSUE_STATE_UNSPECIFIED = 0;
  TRACKER_ISSUE_STATE_OPEN = 1;
  TRACKER_ISSUE_STATE_CLOSED = 2;

  // Changes (pull/merge requests) only — never set on a plain issue,
  // which has no merge concept. Kept on this shared enum rather than a
  // separate one because the two states can never be ambiguous: only a
  // TrackerChange ever carries MERGED.
  TRACKER_ISSUE_STATE_MERGED = 3;
}

// TrackerCiVerdict is the provider-neutral CI/pipeline outcome for a
// change request, normalized from GitHub's combined-status states and
// GitLab's pipeline statuses. manual / skipped / canceled (GitLab) map
// to NONE, never SUCCESS — an agent deciding whether to act on "CI
// passed" must not be misled by a pipeline that never actually ran.
enum TrackerCiVerdict {
  TRACKER_CI_VERDICT_UNSPECIFIED = 0;
  // No CI configured, or no verdict recorded yet (including GitLab's
  // manual / skipped / canceled statuses — see the enum-level comment).
  TRACKER_CI_VERDICT_NONE = 1;
  TRACKER_CI_VERDICT_PENDING = 2;
  TRACKER_CI_VERDICT_SUCCESS = 3;
  TRACKER_CI_VERDICT_FAILED = 4;
}

// TrackerCredentialBreadth classifies a tracker credential against the
// provider's narrowest ("preferred") type — see the design note's
// "Preferred credential types" table. It bounds what a DAEMON compromise
// can do, as distinct from the broker's verb set (tracker:read /
// tracker:write), which bounds what a BOX can do.
enum TrackerCredentialBreadth {
  // Breadth could not be determined — the probe that would classify it
  // failed (e.g. the tracker was unreachable) before classification was
  // possible.
  TRACKER_CREDENTIAL_BREADTH_UNSPECIFIED = 0;

  // The narrowest type for the provider: a GitLab project access token,
  // or a GitHub App installation token / single-repository fine-grained
  // PAT.
  TRACKER_CREDENTIAL_BREADTH_PREFERRED = 1;

  // Wider than preferred: a GitLab group or personal access token, or a
  // GitHub classic PAT. Still accepted — this is a warning, not a
  // rejection.
  TRACKER_CREDENTIAL_BREADTH_BROAD = 2;
}

// TrackerConnection is a tenant-scoped record naming where a tracker is
// and which broker-only secret holds the credential the daemon uses to
// reach it. The credential itself never appears here or anywhere on this
// message's wire representation — only its name.
message TrackerConnection {
  // Username (tenant) that owns the connection.
  string username = 1;

  // Connection name, unique per tenant (e.g. "default"). Runs bind to a
  // connection by this name via a JWT claim (#1922).
  string name = 2;

  TrackerProvider provider = 3;

  // Empty selects the provider's SaaS endpoint (github.com / gitlab.com).
  // Set for GitHub Enterprise Server or self-managed GitLab.
  string base_url = 4;

  // "owner/repo" (GitHub) or "group/subgroup/project" (GitLab).
  string project = 5;

  // Name of a secret owned by the same tenant, in
  // SECRET_DELIVERY_BROKER_ONLY mode. SetTrackerConnection rejects a
  // secret in any delivering mode.
  string credential_secret = 6;

  // Surfaced, not enforced — populated from the upstream's own
  // introspection of the credential (DescribeCredential, #1921 step 3)
  // so an approaching expiry is visible before agents start failing.
  // Unset until that lands.
  google.protobuf.Timestamp credential_expires_at = 7;

  // Connection-level guardrails for agent-filed follow-ups (#2024).
  // Unset (or any zero-valued field) means the documented defaults —
  // see TrackerPolicy.
  TrackerPolicy policy = 8;
}

// SetTrackerConnectionRequest creates or updates a tenant's named tracker
// connection. Idempotent, like SetSecret: repeated calls with the same
// (username, name) replace the connection's fields.
message SetTrackerConnectionRequest {
  string username = 1;
  string name = 2;
  TrackerProvider provider = 3;
  string base_url = 4;
  string project = 5;

  // Must name a secret already stored in SECRET_DELIVERY_BROKER_ONLY mode
  // (SetSecret with delivery_mode = SECRET_DELIVERY_BROKER_ONLY) owned by
  // the same username. The daemon validates this at write time rather
  // than trusting the caller.
  string credential_secret = 6;

  // Optional guardrails (#2024). Set replaces every field, so an
  // omitted policy clears any previously stored one back to defaults.
  TrackerPolicy policy = 7;
}

message SetTrackerConnectionResponse {
  // Operator-facing summary ("connection created" / "connection updated").
  string message = 1;
  TrackerConnection connection = 2;
}

// GetTrackerConnectionRequest reads a single named connection.
message GetTrackerConnectionRequest {
  string username = 1;
  string name = 2;
}

message GetTrackerConnectionResponse {
  TrackerConnection connection = 1;
}

// ListTrackerConnectionsRequest enumerates a tenant's connections.
message ListTrackerConnectionsRequest {
  string username = 1;
}

message ListTrackerConnectionsResponse {
  repeated TrackerConnection connections = 1;
}

// DeleteTrackerConnectionRequest removes a named connection. Does not
// delete the underlying secret — the credential may be shared or the
// operator may want to keep it for a future reconnect.
message DeleteTrackerConnectionRequest {
  string username = 1;
  string name = 2;
}

message DeleteTrackerConnectionResponse {
  string message = 1;
}

// ---------------------------------------------------------------------
// Scope routes (#2021) — which skill a `scope:<role>` label starts on a
// connection. See docs/architecture/issue-triggered-agents.md. Route
// CRUD is tracker:admin, same as connection CRUD: choosing what a label
// runs is an operator decision, never a run's.
// ---------------------------------------------------------------------

// TrackerRoute maps a scope label on one connection to a skill. Unique
// per (username, connection, scope). A `scope:*` label with no route is
// never dispatched.
message TrackerRoute {
  string username = 1;
  string connection = 2;

  // The label suffix: "product" matches the label "scope:product". The
  // "scope:" prefix itself is rejected, as is anything outside
  // [A-Za-z0-9._-] (max 64 chars, no leading punctuation).
  string scope = 3;

  // Agent skill id (as listed by ListAgentSkills) the dispatcher starts
  // for an issue carrying this scope label.
  string skill_id = 4;
}

// SetTrackerRouteRequest creates or updates a route. Idempotent:
// repeated calls with the same (username, connection, scope) replace
// skill_id. The connection must already exist.
message SetTrackerRouteRequest {
  string username = 1;
  string connection = 2;
  string scope = 3;
  string skill_id = 4;
}

message SetTrackerRouteResponse {
  // "route created" / "route updated".
  string message = 1;
  TrackerRoute route = 2;
}

// ListTrackerRoutesRequest enumerates one connection's routes, ordered
// by scope.
message ListTrackerRoutesRequest {
  string username = 1;
  string connection = 2;
}

message ListTrackerRoutesResponse {
  repeated TrackerRoute routes = 1;
}

// DeleteTrackerRouteRequest removes one route. Deleting a connection
// removes all of its routes.
message DeleteTrackerRouteRequest {
  string username = 1;
  string connection = 2;
  string scope = 3;
}

message DeleteTrackerRouteResponse {
  string message = 1;
}

// ---------------------------------------------------------------------
// End scope routes (#2021).
// ---------------------------------------------------------------------

// ---------------------------------------------------------------------
// Dispatch (#2022) — a routed `scope:<role>` label on an open issue
// starts the routed skill exactly once. See
// docs/architecture/issue-triggered-agents.md ("Dispatch state
// machine", "Exactly-once"). Dispatch is tracker:admin: starting runs
// from a tracker is an operator's decision, never a run's.
// ---------------------------------------------------------------------

// TrackerDispatchState is the durable state of one dispatch row.
// queued/running are "active" — at most one active row exists per
// (username, connection, issue) by a partial unique index, which is
// the whole exactly-once guarantee. done/failed are terminal; a re-run
// is a new row.
enum TrackerDispatchState {
  TRACKER_DISPATCH_STATE_UNSPECIFIED = 0;
  TRACKER_DISPATCH_STATE_QUEUED = 1;
  TRACKER_DISPATCH_STATE_RUNNING = 2;
  TRACKER_DISPATCH_STATE_DONE = 3;
  TRACKER_DISPATCH_STATE_FAILED = 4;
}

// TrackerDispatch is one durable dispatch: which issue, which scope
// label matched, which skill was started as which run, and where the
// run is in its state machine.
message TrackerDispatch {
  string id = 1;
  string username = 2;
  string connection = 3;
  int64 issue_number = 4;
  // The matched label's suffix ("product" for "scope:product").
  string scope = 5;
  string skill_id = 6;
  // The run id the dispatcher chose before starting the run, so the
  // run JWT's run_id claim and this row always agree.
  string run_id = 7;
  // Lineage depth of the issue (a human-created issue is 0).
  int32 depth = 8;
  TrackerDispatchState state = 9;
  // Set when state is FAILED: why (start-run error, timeout, ...).
  string failure_reason = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp started_at = 12;
  google.protobuf.Timestamp ended_at = 13;
}

// TrackerDispatchInput is EXACTLY the run's input_json (protojson
// encoded) for a dispatched run: the issue REFERENCE and the dispatch
// id, never the issue body. The run fetches the body itself through
// GetTrackerIssue under its own tracker:read, so it arrives as
// brokered, untrusted data like every other read — never smuggled
// through the launch payload.
message TrackerDispatchInput {
  string connection = 1;
  int64 issue_number = 2;
  string scope = 3;
  string dispatch_id = 4;
  int32 depth = 5;
  // The tenant the run is dispatched for (#2023). Every broker verb the
  // run calls (GetTrackerIssue, CommentOnTrackerIssue,
  // SubmitTrackerChange) names it; it is the run token's own subject,
  // so it widens nothing.
  string username = 6;
}

// DispatchTrackerIssuesRequest runs ONE dispatcher tick for a
// connection: list open issues, filter, insert a dispatch row, start
// the routed skill, label agent:queued. `containarium tracker
// dispatch --interval` calls this in a loop.
message DispatchTrackerIssuesRequest {
  string username = 1;
  string connection = 2;
}

message DispatchTrackerIssuesResponse {
  // Dispatches this tick inserted and started: RUNNING once the run
  // registered (#2023), QUEUED if the starter did not report a start.
  repeated TrackerDispatch started = 1;

  // Reserved for the run-timeout sweep (#2026): RUNNING rows this tick
  // failed for exceeding the connection policy's run timeout.
  repeated TrackerDispatch timed_out = 2;

  // Issues carrying agent:needs-approval — a human has not released
  // them yet.
  int32 skipped_needs_approval = 3;

  // Issues already carrying another agent:* state label, or with an
  // active dispatch row (the exactly-once index said no).
  int32 skipped_active = 4;

  // Issues whose scope:* label(s) have no route on this connection.
  // Each gets exactly one stamped warning comment, ever, not one per
  // tick.
  int32 skipped_unrouted = 5;

  // Dispatches this tick inserted but could not start (state FAILED,
  // failure_reason set, issue labeled agent:failed).
  repeated TrackerDispatch failed = 6;
}

// ListTrackerDispatchesRequest enumerates a connection's dispatch
// rows, newest first.
message ListTrackerDispatchesRequest {
  string username = 1;
  string connection = 2;
  // UNSPECIFIED matches any state.
  TrackerDispatchState state = 3;
}

message ListTrackerDispatchesResponse {
  repeated TrackerDispatch dispatches = 1;
}

// ---------------------------------------------------------------------
// End dispatch (#2022).
// ---------------------------------------------------------------------

// GetTrackerStatusRequest probes a named connection's credential live,
// against the tracker itself.
message GetTrackerStatusRequest {
  string username = 1;
  string name = 2;
}

message GetTrackerStatusResponse {
  TrackerConnection connection = 1;

  // False if the tracker itself could not be reached at all (DNS,
  // connect, TLS, timeout) — no credential was ever presented, so
  // nothing below this field is meaningful.
  bool reachable = 2;

  // False if the tracker was reached but rejected the credential
  // (401/403). Meaningless (left false) when reachable is false.
  bool credential_valid = 3;

  // UNSPECIFIED when reachable && credential_valid are not both true —
  // classification needs a successful probe.
  TrackerCredentialBreadth credential_breadth = 4;

  // Provider-native scope/permission strings, from the provider's own
  // introspection. May be empty even for a valid credential — not every
  // provider exposes scopes for every credential type.
  repeated string credential_scopes = 5;

  // From the provider's own introspection. Unset means "no expiry, or
  // the provider doesn't report one for this credential type" — treat
  // unset as unknown, not as "never expires".
  google.protobuf.Timestamp credential_expires_at = 6;

  // Human-readable detail when reachable or credential_valid is false.
  // Empty when both are true.
  string detail = 7;

  // host_git_version and host_git_sufficient (#1923, decision D2) let
  // an operator see SubmitTrackerChange's preflight before an agent
  // hits it: the daemon host's `git version` output, and whether it
  // meets the >= 2.31 minimum the submit path needs
  // (GIT_CONFIG_COUNT/KEY_N/VALUE_N env-based config). Daemon-wide, not
  // connection-specific — every connection on this daemon shares the
  // same host git. An empty host_git_version means git was not found
  // on the daemon host's PATH at all.
  string host_git_version = 8;
  bool host_git_sufficient = 9;
}

// TrackerComment is one normalized issue or change-request comment.
message TrackerComment {
  string author = 1;
  google.protobuf.Timestamp created_at = 2;
  string body = 3;
}

// TrackerIssue is the provider-neutral shape of a tracker issue — one
// `number` rather than GitHub's number vs GitLab's iid, normalized
// state/labels/assignee. No provider-specific field name or string
// reaches the caller.
message TrackerIssue {
  int64 number = 1;
  string title = 2;
  string body = 3;
  TrackerIssueState state = 4;
  repeated string labels = 5;

  // Provider username; empty when unassigned. Single value even on
  // GitHub (which allows several) — the broker only needs "is this
  // claimed," and GitLab Free's single-assignee model is what claiming
  // is designed around.
  string assignee = 6;

  // Populated only by GetTrackerIssue — ListTrackerIssues never
  // includes comments (an N+1 call pattern neither provider's rate
  // limits are generous with).
  repeated TrackerComment comments = 7;
}

// TrackerChange is the provider-neutral shape of a GitHub pull request
// or GitLab merge request.
message TrackerChange {
  int64 number = 1;
  TrackerIssueState state = 2;
  TrackerCiVerdict ci_verdict = 3;
  string url = 4;
  // branch is the daemon-chosen branch the change request's head points
  // at (#1923). Populated by SubmitTrackerChange's response; empty on
  // GetTrackerChange, which has no reason to resolve it for an
  // already-open change.
  string branch = 5;
}

// GetTrackerIssueRequest reads a single issue, including its comments.
message GetTrackerIssueRequest {
  string username = 1;
  // Connection name. A run-scoped JWT's tracker_conn claim must match
  // this field once run binding lands (#1922 step 6); an operator
  // token may name any connection in its tenant.
  string connection = 2;
  int64 number = 3;
}

message GetTrackerIssueResponse {
  TrackerIssue issue = 1;
}

// ListTrackerIssuesRequest enumerates issues, optionally filtered.
message ListTrackerIssuesRequest {
  string username = 1;
  string connection = 2;

  // UNSPECIFIED matches any state.
  TrackerIssueState state = 3;

  // Non-empty requires ALL of these labels present (both providers'
  // native list APIs support this as an AND filter).
  repeated string labels = 4;

  // Free-text query against title/body, passed through to the
  // provider's own search — best-effort, not authoritative, since no
  // normalization is possible across two different search
  // implementations.
  string search = 5;
}

message ListTrackerIssuesResponse {
  repeated TrackerIssue issues = 1;
}

// GetTrackerChangeRequest reads a single change request's state and CI
// verdict.
message GetTrackerChangeRequest {
  string username = 1;
  string connection = 2;
  int64 number = 3;
}

message GetTrackerChangeResponse {
  TrackerChange change = 1;
}

// CommentOnTrackerIssueRequest posts a comment on an issue or change
// request, stamped with the acting run's platform identity (visible
// signature + hidden marker — see docs/architecture/agent-tracker-broker.md).
// body is agent-supplied text: sanitized server-side before it reaches
// the tracker (GitLab quick-action neutralization, forged-marker
// stripping) — never trusted or interpreted as anything but a comment
// body.
message CommentOnTrackerIssueRequest {
  string username = 1;
  string connection = 2;
  int64 number = 3;
  string body = 4;
}

message CommentOnTrackerIssueResponse {
  TrackerComment comment = 1;
}

// ClaimTrackerIssueRequest attempts to claim an issue for the calling
// run: posts a stamped claim comment and assigns the run's identity if
// the issue is unassigned, unless a live or recent claim from a
// different run already holds it.
message ClaimTrackerIssueRequest {
  string username = 1;
  string connection = 2;
  int64 number = 3;

  // How long a claim from a run this daemon can't confirm is still
  // running (e.g. made through a different daemon instance) is still
  // honored before being considered abandoned. 0 uses the daemon's
  // default (2 hours, per the design note).
  int64 stale_after_seconds = 4;
}

message ClaimTrackerIssueResponse {
  // True when the calling run holds the claim once this call returns
  // — either it just claimed the issue, took over a stale claim, or
  // already held it (idempotent re-claim).
  bool claimed = 1;

  // Set when claimed is false: the run id that holds a live-or-fresh
  // claim instead.
  string already_claimed_by_run_id = 2;

  // True if this call assigned the issue (never replaces an existing
  // assignee).
  bool assigned = 3;
}

// SetTrackerIssueLabelsRequest adds and/or removes labels on an issue.
// Both lists are checked against the connection's label allow-list
// (TrackerPolicy.label_allow_list, #2024) BEFORE any upstream call; a
// run-scoped token can additionally never write the dispatcher's
// agent:queued / agent:running / agent:done / agent:failed state
// labels, whatever the allow-list says.
message SetTrackerIssueLabelsRequest {
  string username = 1;
  string connection = 2;
  int64 number = 3;
  repeated string add_labels = 4;
  repeated string remove_labels = 5;
}

message SetTrackerIssueLabelsResponse {
  string message = 1;
}

// ---- Issue-triggered role agents: follow-up issues + policy (#2024) ----
// See docs/architecture/issue-triggered-agents.md ("Chain guards",
// "CreateTrackerIssue verb"). Routes / dispatch (#2021, #2022) are
// separate blocks.

// TrackerPolicy is a connection's guardrails for agent-filed follow-ups.
// Zero values mean the documented defaults, so an unset policy and an
// empty one behave identically.
message TrackerPolicy {
  // Glob patterns ('*' matches any run of characters, case-sensitive)
  // a label must match to be written through CreateTrackerIssue or
  // SetTrackerIssueLabels. Default: scope:*, model:*,
  // agent:needs-approval. The dispatcher's agent:queued / running /
  // done / failed state labels are reserved: a run-scoped token can
  // never write them even if a pattern here would match.
  repeated string label_allow_list = 1;

  // When true, follow-ups filed by a run are NOT gated with
  // agent:needs-approval. Default false: a human releases every hop.
  bool auto_chain = 2;

  // Maximum lineage depth of an agent-filed follow-up (a human-created
  // issue is depth 0). Default 3.
  int32 max_depth = 3;

  // Maximum follow-ups one run may file. Default 5.
  int32 max_children_per_run = 4;

  // Run timeout the dispatcher (#2026) applies. Default 3600.
  int64 run_timeout_seconds = 5;
}

// CreateTrackerIssueRequest files a follow-up issue. title/body/labels
// are agent-supplied text: sanitized server-side, labels allow-listed
// before any upstream call, and the body gets the parent link and the
// run's identity stamp appended from the verified token — never from a
// request field.
message CreateTrackerIssueRequest {
  string username = 1;
  string connection = 2;
  string title = 3;
  string body = 4;

  // Must every pass the connection's label allow-list. A run-scoped
  // token's follow-up additionally gets agent:needs-approval unless
  // the policy enables auto_chain.
  repeated string labels = 5;

  // Parent issue number. 0 = none — allowed for an operator token
  // only; a run-scoped token MUST set it (lineage, depth, fan-out).
  int64 parent_number = 6;
}

message CreateTrackerIssueResponse {
  TrackerIssue issue = 1;
}

// SubmitTrackerChangeRequest publishes the calling run's committed
// workspace and opens a change request referencing issue — see
// docs/architecture/agent-tracker-broker.md's "Submit path". Carries
// no remote, no target ref, and no credential: the daemon resolves the
// run's box, base commit, and connection itself from the verified JWT,
// and chooses the branch (never a request field — see
// internal/tracker/submit.BranchName).
message SubmitTrackerChangeRequest {
  string username = 1;
  string connection = 2;

  // issue this change closes/references. SubmitTrackerChange is always
  // in service of a claimed issue, never a standalone change.
  int64 issue = 3;

  string title = 4;
  string description = 5;

  // draft opens the change request as a draft/WIP — GitHub's native
  // draft flag, or GitLab's "Draft: " title-prefix convention.
  bool draft = 6;
}

message SubmitTrackerChangeResponse {
  TrackerChange change = 1;
}

// TrackerService manages tracker connections — the daemon-custody seam
// the tracker broker's issue/change-request verbs (#1922, #1923) build
// on. Connection CRUD is gated by tracker:admin, deliberately separate
// from the tracker:read / tracker:write scopes an agent's run-scoped JWT
// carries for the verbs themselves: naming where the tracker is and
// which credential to trust is an operator decision, not something a
// skill run should be able to change.
service TrackerService {
  // SetTrackerConnection creates or updates a tracker connection.
  rpc SetTrackerConnection(SetTrackerConnectionRequest) returns (SetTrackerConnectionResponse) {
    option (google.api.http) = {
      post: "/v1/tracker/connections"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Create or update a tracker connection";
      description: "Registers where a tenant's issue tracker is (provider, base URL, project) and which broker-only secret holds its credential. The credential itself is never accepted or returned here — only the secret's name. Requires tracker:admin.";
      tags: "Tracker";
    };
  }

  // GetTrackerConnection returns a single named connection.
  rpc GetTrackerConnection(GetTrackerConnectionRequest) returns (GetTrackerConnectionResponse) {
    option (google.api.http) = {
      get: "/v1/tracker/connections/{username}/{name}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get a tracker connection";
      description: "Returns a single named tracker connection's metadata. Never returns the credential value.";
      tags: "Tracker";
    };
  }

  // ListTrackerConnections returns every connection a tenant owns.
  rpc ListTrackerConnections(ListTrackerConnectionsRequest) returns (ListTrackerConnectionsResponse) {
    option (google.api.http) = {
      get: "/v1/tracker/connections/{username}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List tracker connections";
      description: "Lists every tracker connection owned by a tenant.";
      tags: "Tracker";
    };
  }

  // DeleteTrackerConnection removes a named connection.
  rpc DeleteTrackerConnection(DeleteTrackerConnectionRequest) returns (DeleteTrackerConnectionResponse) {
    option (google.api.http) = {
      delete: "/v1/tracker/connections/{username}/{name}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Delete a tracker connection";
      description: "Removes a named tracker connection. Does not delete the underlying credential secret.";
      tags: "Tracker";
    };
  }

  // --- Scope routes (#2021) -------------------------------------------

  // SetTrackerRoute maps a scope label on a connection to a skill.
  rpc SetTrackerRoute(SetTrackerRouteRequest) returns (SetTrackerRouteResponse) {
    option (google.api.http) = {
      put: "/v1/tracker/{username}/{connection}/routes/{scope}"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Set a tracker scope route";
      description: "Creates or updates the route that sends issues labeled scope:<scope> on this connection to skill_id. Idempotent. The connection must exist. Requires tracker:admin.";
      tags: "Tracker";
    };
  }

  // ListTrackerRoutes returns a connection's scope routes.
  rpc ListTrackerRoutes(ListTrackerRoutesRequest) returns (ListTrackerRoutesResponse) {
    option (google.api.http) = {
      get: "/v1/tracker/{username}/{connection}/routes"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List tracker scope routes";
      description: "Lists every scope -> skill route on a tracker connection, ordered by scope. Requires tracker:admin.";
      tags: "Tracker";
    };
  }

  // DeleteTrackerRoute removes one scope route.
  rpc DeleteTrackerRoute(DeleteTrackerRouteRequest) returns (DeleteTrackerRouteResponse) {
    option (google.api.http) = {
      delete: "/v1/tracker/{username}/{connection}/routes/{scope}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Delete a tracker scope route";
      description: "Removes the route for scope:<scope> on this connection; issues with that label are no longer dispatched. Requires tracker:admin.";
      tags: "Tracker";
    };
  }

  // --- End scope routes (#2021) ---------------------------------------

  // --- Dispatch (#2022) -----------------------------------------------

  // DispatchTrackerIssues runs one dispatcher tick for a connection.
  rpc DispatchTrackerIssues(DispatchTrackerIssuesRequest) returns (DispatchTrackerIssuesResponse) {
    option (google.api.http) = {
      post: "/v1/tracker/{username}/{connection}/dispatch"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Run one tracker dispatch tick";
      description: "Lists the connection's open issues and, for each one carrying a routed scope:<role> label and no agent:* state label (and not agent:needs-approval), inserts a durable dispatch row, starts the routed skill through the RunAgentSkill path with the issue reference as input, and labels the issue agent:queued. Exactly once per (issue) across restarts and concurrent dispatchers: a partial unique index on active rows makes the second inserter skip. An unrouted scope label gets exactly one stamped warning comment. Requires tracker:admin (and agents:run, to start the runs).";
      tags: "Tracker";
    };
  }

  // ListTrackerDispatches returns a connection's dispatch rows.
  rpc ListTrackerDispatches(ListTrackerDispatchesRequest) returns (ListTrackerDispatchesResponse) {
    option (google.api.http) = {
      get: "/v1/tracker/{username}/{connection}/dispatches"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List tracker dispatches";
      description: "Lists a connection's dispatch rows (issue, scope, skill, run id, state, failure reason, timestamps), newest first, optionally filtered by state. Requires tracker:admin.";
      tags: "Tracker";
    };
  }

  // --- End dispatch (#2022) -------------------------------------------

  // GetTrackerStatus probes a connection's credential live, against the
  // tracker itself.
  rpc GetTrackerStatus(GetTrackerStatusRequest) returns (GetTrackerStatusResponse) {
    option (google.api.http) = {
      get: "/v1/tracker/connections/{username}/{name}/status"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Check a tracker connection's live status";
      description: "Asks the tracker to describe the connection's own credential: reachability, whether the credential is still valid, its granted scopes and expiry, and whether it's broader than the provider's preferred credential type. Also reports the daemon host's git version and whether it meets SubmitTrackerChange's minimum. Requires tracker:admin.";
      tags: "Tracker";
    };
  }

  // GetTrackerIssue reads a single issue, including its comments.
  rpc GetTrackerIssue(GetTrackerIssueRequest) returns (GetTrackerIssueResponse) {
    option (google.api.http) = {
      get: "/v1/tracker/{username}/{connection}/issues/{number}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get a tracker issue";
      description: "Returns a single issue's body, state, labels, assignee, and comments, normalized across GitHub and GitLab. Requires tracker:read.";
      tags: "Tracker";
    };
  }

  // ListTrackerIssues enumerates issues, optionally filtered.
  rpc ListTrackerIssues(ListTrackerIssuesRequest) returns (ListTrackerIssuesResponse) {
    option (google.api.http) = {
      get: "/v1/tracker/{username}/{connection}/issues"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List tracker issues";
      description: "Lists issues, optionally filtered by state, labels (AND), or free-text search. Never includes comments — use GetTrackerIssue for a single issue's comments. Requires tracker:read.";
      tags: "Tracker";
    };
  }

  // GetTrackerChange reads a single change request's state and CI
  // verdict.
  rpc GetTrackerChange(GetTrackerChangeRequest) returns (GetTrackerChangeResponse) {
    option (google.api.http) = {
      get: "/v1/tracker/{username}/{connection}/changes/{number}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get a tracker change request";
      description: "Returns a pull/merge request's state and normalized CI verdict. Requires tracker:read.";
      tags: "Tracker";
    };
  }

  // CommentOnTrackerIssue posts a stamped, sanitized comment on an
  // issue or change request.
  rpc CommentOnTrackerIssue(CommentOnTrackerIssueRequest) returns (CommentOnTrackerIssueResponse) {
    option (google.api.http) = {
      post: "/v1/tracker/{username}/{connection}/issues/{number}/comments"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Comment on a tracker issue or change";
      description: "Posts a comment, stamped with the acting run's platform identity and sanitized against forged markers and GitLab quick-actions. Requires tracker:write.";
      tags: "Tracker";
    };
  }

  // ClaimTrackerIssue attempts to claim an issue for the calling run.
  rpc ClaimTrackerIssue(ClaimTrackerIssueRequest) returns (ClaimTrackerIssueResponse) {
    option (google.api.http) = {
      post: "/v1/tracker/{username}/{connection}/issues/{number}/claim"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Claim a tracker issue";
      description: "Posts a stamped claim comment and assigns the calling run if the issue is unassigned, unless a live or recent claim from a different run already holds it. Idempotent for the same run. Requires tracker:write.";
      tags: "Tracker";
    };
  }

  // SetTrackerIssueLabels adds and/or removes labels on an issue.
  rpc SetTrackerIssueLabels(SetTrackerIssueLabelsRequest) returns (SetTrackerIssueLabelsResponse) {
    option (google.api.http) = {
      post: "/v1/tracker/{username}/{connection}/issues/{number}/labels"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Set labels on a tracker issue";
      description: "Adds and/or removes labels on an issue. Requires tracker:write.";
      tags: "Tracker";
    };
  }

  // CreateTrackerIssue files a follow-up issue (#2024).
  rpc CreateTrackerIssue(CreateTrackerIssueRequest) returns (CreateTrackerIssueResponse) {
    option (google.api.http) = {
      post: "/v1/tracker/{username}/{connection}/issues"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Create a tracker issue";
      description: "Files an issue on the connection's tracker — the follow-up verb for issue-triggered role agents. Labels must pass the connection's label allow-list (checked before any upstream call). A run-scoped token must name a parent issue: the child is recorded in the issue lineage (depth and per-run fan-out are capped by the connection policy), gets agent:needs-approval unless the policy enables auto_chain, and its body ends with the parent link and the run's identity stamp; the parent gets one back-link comment. Requires tracker:write.";
      tags: "Tracker";
    };
  }

  // SubmitTrackerChange publishes the calling run's committed workspace
  // and opens a change request, without a push credential ever
  // entering the box.
  rpc SubmitTrackerChange(SubmitTrackerChangeRequest) returns (SubmitTrackerChangeResponse) {
    option (google.api.http) = {
      post: "/v1/tracker/{username}/{connection}/changes"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Submit a tracker change request";
      description: "Bundles the run's committed workspace out of the box and pushes it from a fresh temporary bare repository on the host to a daemon-chosen branch, then opens a change request referencing issue — no push credential ever enters the box. Requires tracker:write and a run with a recorded git_source. Opened as a draft when draft is true.";
      tags: "Tracker";
    };
  }
}
