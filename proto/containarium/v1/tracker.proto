syntax = "proto3";

package containarium.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/footprintai/containarium/pkg/pb/containarium/v1;containariumv1";

// TrackerProvider identifies the issue tracker / forge a TrackerConnection
// points at. Always explicit, never inferred from base_url's hostname — a
// self-managed host named "git.<company>" can be either product. See
// docs/architecture/agent-tracker-broker.md.
enum TrackerProvider {
  TRACKER_PROVIDER_UNSPECIFIED = 0;

  // github.com (base_url empty) or GitHub Enterprise Server (base_url set).
  TRACKER_PROVIDER_GITHUB = 1;

  // gitlab.com (base_url empty) or self-managed GitLab, including the
  // Free tier's single-assignee-per-issue constraint.
  TRACKER_PROVIDER_GITLAB = 2;
}

// TrackerCredentialBreadth classifies a tracker credential against the
// provider's narrowest ("preferred") type — see the design note's
// "Preferred credential types" table. It bounds what a DAEMON compromise
// can do, as distinct from the broker's verb set (tracker:read /
// tracker:write), which bounds what a BOX can do.
enum TrackerCredentialBreadth {
  // Breadth could not be determined — the probe that would classify it
  // failed (e.g. the tracker was unreachable) before classification was
  // possible.
  TRACKER_CREDENTIAL_BREADTH_UNSPECIFIED = 0;

  // The narrowest type for the provider: a GitLab project access token,
  // or a GitHub App installation token / single-repository fine-grained
  // PAT.
  TRACKER_CREDENTIAL_BREADTH_PREFERRED = 1;

  // Wider than preferred: a GitLab group or personal access token, or a
  // GitHub classic PAT. Still accepted — this is a warning, not a
  // rejection.
  TRACKER_CREDENTIAL_BREADTH_BROAD = 2;
}

// TrackerConnection is a tenant-scoped record naming where a tracker is
// and which broker-only secret holds the credential the daemon uses to
// reach it. The credential itself never appears here or anywhere on this
// message's wire representation — only its name.
message TrackerConnection {
  // Username (tenant) that owns the connection.
  string username = 1;

  // Connection name, unique per tenant (e.g. "default"). Runs bind to a
  // connection by this name via a JWT claim (#1922).
  string name = 2;

  TrackerProvider provider = 3;

  // Empty selects the provider's SaaS endpoint (github.com / gitlab.com).
  // Set for GitHub Enterprise Server or self-managed GitLab.
  string base_url = 4;

  // "owner/repo" (GitHub) or "group/subgroup/project" (GitLab).
  string project = 5;

  // Name of a secret owned by the same tenant, in
  // SECRET_DELIVERY_BROKER_ONLY mode. SetTrackerConnection rejects a
  // secret in any delivering mode.
  string credential_secret = 6;

  // Surfaced, not enforced — populated from the upstream's own
  // introspection of the credential (DescribeCredential, #1921 step 3)
  // so an approaching expiry is visible before agents start failing.
  // Unset until that lands.
  google.protobuf.Timestamp credential_expires_at = 7;
}

// SetTrackerConnectionRequest creates or updates a tenant's named tracker
// connection. Idempotent, like SetSecret: repeated calls with the same
// (username, name) replace the connection's fields.
message SetTrackerConnectionRequest {
  string username = 1;
  string name = 2;
  TrackerProvider provider = 3;
  string base_url = 4;
  string project = 5;

  // Must name a secret already stored in SECRET_DELIVERY_BROKER_ONLY mode
  // (SetSecret with delivery_mode = SECRET_DELIVERY_BROKER_ONLY) owned by
  // the same username. The daemon validates this at write time rather
  // than trusting the caller.
  string credential_secret = 6;
}

message SetTrackerConnectionResponse {
  // Operator-facing summary ("connection created" / "connection updated").
  string message = 1;
  TrackerConnection connection = 2;
}

// GetTrackerConnectionRequest reads a single named connection.
message GetTrackerConnectionRequest {
  string username = 1;
  string name = 2;
}

message GetTrackerConnectionResponse {
  TrackerConnection connection = 1;
}

// ListTrackerConnectionsRequest enumerates a tenant's connections.
message ListTrackerConnectionsRequest {
  string username = 1;
}

message ListTrackerConnectionsResponse {
  repeated TrackerConnection connections = 1;
}

// DeleteTrackerConnectionRequest removes a named connection. Does not
// delete the underlying secret — the credential may be shared or the
// operator may want to keep it for a future reconnect.
message DeleteTrackerConnectionRequest {
  string username = 1;
  string name = 2;
}

message DeleteTrackerConnectionResponse {
  string message = 1;
}

// GetTrackerStatusRequest probes a named connection's credential live,
// against the tracker itself.
message GetTrackerStatusRequest {
  string username = 1;
  string name = 2;
}

message GetTrackerStatusResponse {
  TrackerConnection connection = 1;

  // False if the tracker itself could not be reached at all (DNS,
  // connect, TLS, timeout) — no credential was ever presented, so
  // nothing below this field is meaningful.
  bool reachable = 2;

  // False if the tracker was reached but rejected the credential
  // (401/403). Meaningless (left false) when reachable is false.
  bool credential_valid = 3;

  // UNSPECIFIED when reachable && credential_valid are not both true —
  // classification needs a successful probe.
  TrackerCredentialBreadth credential_breadth = 4;

  // Provider-native scope/permission strings, from the provider's own
  // introspection. May be empty even for a valid credential — not every
  // provider exposes scopes for every credential type.
  repeated string credential_scopes = 5;

  // From the provider's own introspection. Unset means "no expiry, or
  // the provider doesn't report one for this credential type" — treat
  // unset as unknown, not as "never expires".
  google.protobuf.Timestamp credential_expires_at = 6;

  // Human-readable detail when reachable or credential_valid is false.
  // Empty when both are true.
  string detail = 7;
}

// TrackerService manages tracker connections — the daemon-custody seam
// the tracker broker's issue/change-request verbs (#1922, #1923) build
// on. Connection CRUD is gated by tracker:admin, deliberately separate
// from the tracker:read / tracker:write scopes an agent's run-scoped JWT
// carries for the verbs themselves: naming where the tracker is and
// which credential to trust is an operator decision, not something a
// skill run should be able to change.
service TrackerService {
  // SetTrackerConnection creates or updates a tracker connection.
  rpc SetTrackerConnection(SetTrackerConnectionRequest) returns (SetTrackerConnectionResponse) {
    option (google.api.http) = {
      post: "/v1/tracker/connections"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Create or update a tracker connection";
      description: "Registers where a tenant's issue tracker is (provider, base URL, project) and which broker-only secret holds its credential. The credential itself is never accepted or returned here — only the secret's name. Requires tracker:admin.";
      tags: "Tracker";
    };
  }

  // GetTrackerConnection returns a single named connection.
  rpc GetTrackerConnection(GetTrackerConnectionRequest) returns (GetTrackerConnectionResponse) {
    option (google.api.http) = {
      get: "/v1/tracker/connections/{username}/{name}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get a tracker connection";
      description: "Returns a single named tracker connection's metadata. Never returns the credential value.";
      tags: "Tracker";
    };
  }

  // ListTrackerConnections returns every connection a tenant owns.
  rpc ListTrackerConnections(ListTrackerConnectionsRequest) returns (ListTrackerConnectionsResponse) {
    option (google.api.http) = {
      get: "/v1/tracker/connections/{username}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List tracker connections";
      description: "Lists every tracker connection owned by a tenant.";
      tags: "Tracker";
    };
  }

  // DeleteTrackerConnection removes a named connection.
  rpc DeleteTrackerConnection(DeleteTrackerConnectionRequest) returns (DeleteTrackerConnectionResponse) {
    option (google.api.http) = {
      delete: "/v1/tracker/connections/{username}/{name}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Delete a tracker connection";
      description: "Removes a named tracker connection. Does not delete the underlying credential secret.";
      tags: "Tracker";
    };
  }

  // GetTrackerStatus probes a connection's credential live, against the
  // tracker itself.
  rpc GetTrackerStatus(GetTrackerStatusRequest) returns (GetTrackerStatusResponse) {
    option (google.api.http) = {
      get: "/v1/tracker/connections/{username}/{name}/status"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Check a tracker connection's live status";
      description: "Asks the tracker to describe the connection's own credential: reachability, whether the credential is still valid, its granted scopes and expiry, and whether it's broader than the provider's preferred credential type. Requires tracker:admin.";
      tags: "Tracker";
    };
  }
}
