syntax = "proto3";

package containarium.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/footprintai/containarium/pkg/pb/containarium/v1;containariumv1";

// ThreatSeverity ranks a security finding. Higher values are more severe.
enum ThreatSeverity {
  THREAT_SEVERITY_UNSPECIFIED = 0;
  THREAT_SEVERITY_LOW = 1;
  THREAT_SEVERITY_MEDIUM = 2;
  THREAT_SEVERITY_HIGH = 3;
  THREAT_SEVERITY_CRITICAL = 4;
}

// ThreatRuleId identifies which detection rule raised a finding.
enum ThreatRuleId {
  THREAT_RULE_ID_UNSPECIFIED = 0;
  // Flow to a known-bad destination (e.g. a mining pool).
  THREAT_RULE_ID_BAD_DESTINATION = 1;
  // Flow whose source and destination belong to different tenants.
  THREAT_RULE_ID_CROSS_TENANT_FLOW = 2;
  // Burst of policy denies for one tenant within a time window.
  THREAT_RULE_ID_DENY_BURST = 3;
  // A box's effective sshd configuration permitted password login, or the
  // platform-managed key-only drop-in had been removed or altered (#2424).
  // Raised by the box sshd posture reconciler after it re-asserts the
  // drop-in; the evidence names the offending directive and file.
  THREAT_RULE_ID_BOX_SSHD_PASSWORD_AUTH = 4;
  // A box is listening with an SSH server that is not the distro sshd
  // service on a port its sshd_config declares (#2439): a second sshd, a
  // dropbear, or the stock sshd started with its own config. Raised by the
  // same posture pass as rule 4; record-only, the platform never kills a
  // tenant's process. The evidence names the port, pid and binary.
  THREAT_RULE_ID_BOX_ROGUE_SSH_LISTENER = 5;
  // A box held sustained CPU while keeping a long-lived flow to a stratum
  // port or a listed bad destination (#2635): the shape of a cryptominer.
  // Subject is the destination ip:port; evidence is one CPUEvidence plus
  // the qualifying flow. Thresholds: MiningBehaviorThresholds.
  THREAT_RULE_ID_MINING_BEHAVIOR = 6;
  // Values 7 (MINER_SIGNATURE, #2638) and 8 (SENTRY_UNAVAILABLE, #2634) are
  // assigned by their own stories.
  //
  // A process action (throttle or freeze, #2636) reached its TTL with no
  // operator decision and was released automatically. MEDIUM, so an
  // unattended containment never silently becomes permanent. Subject is the
  // container name; the response on the original HIGH finding is EXPIRED.
  THREAT_RULE_ID_PROCESS_ACTION_EXPIRED = 9;
}

// FindingState is the lifecycle state of a security finding.
enum FindingState {
  FINDING_STATE_UNSPECIFIED = 0;
  FINDING_STATE_OPEN = 1;
  FINDING_STATE_RESOLVED = 2;
}

// FlowEvidence captures one triggering flow's 5-tuple and volume, attached to
// a finding as supporting evidence.
message FlowEvidence {
  string src_ip = 1;
  string dst_ip = 2;
  uint32 src_port = 3;
  uint32 dst_port = 4;
  // IP protocol name, e.g. "tcp", "udp", "icmp".
  string protocol = 5;
  int64 bytes = 6;
  int64 packets = 7;
  // When the flow was first and last seen (#2635). The kernel stamps flows
  // with a monotonic clock, so last_seen is the flow poll that reported the
  // flow and first_seen is last_seen minus the flow's own age. Set by the
  // mining-behavior rule; unset on other rules' evidence.
  google.protobuf.Timestamp first_seen = 8;
  google.protobuf.Timestamp last_seen = 9;
  // What qualified the flow: "port:<n>" for a stratum port, or
  // "bad-destination:<cidr>" for a listed destination (#2635).
  string matched = 10;
}

// DenyEvidence captures an aggregated count of policy-deny events matching a
// destination/reason pair, attached to a finding as supporting evidence.
message DenyEvidence {
  string dst_ip = 1;
  uint32 dst_port = 2;
  string protocol = 3;
  // Human-readable deny reason, e.g. "policy", "virtual_patch", "signature".
  string reason = 4;
  int64 count = 5;
}

// ConfigEvidence captures one configuration directive whose effective value
// violated policy, attached to a posture finding (#2424).
message ConfigEvidence {
  // File the effective value came from, or the directory when the exact
  // file could not be attributed.
  string path = 1;
  // Directive name, e.g. "PasswordAuthentication".
  string directive = 2;
  // Effective value at detection time, e.g. "yes".
  string value = 3;
  // Whether the platform re-asserted its managed configuration in the
  // same pass (the violation is closed on the stock service, and this
  // finding records that it happened).
  bool remediated = 4;
  // Free-text detail, e.g. "managed drop-in missing".
  string note = 5;
}

// ListenerEvidence is one listening socket held by an SSH server that is not
// the box's distro sshd service (#2439).
message ListenerEvidence {
  // TCP port the listener is bound to.
  uint32 port = 1;
  // Bind address as the box's kernel reports it, e.g. "127.0.0.1" or "::".
  // A loopback bind is the shape a reverse tunnel needs.
  string bind_address = 2;
  // Process id inside the box's pid namespace.
  uint32 pid = 3;
  // Executable the process runs, e.g. "/usr/sbin/dropbear".
  string binary = 4;
  // Why this listener is not the managed sshd, e.g. "port not in
  // sshd_config" or "started with -f".
  string note = 5;
}

// CPUEvidence summarises a container's CPU usage over a detection window
// (#2635), measured in cores (1.0 = one core fully busy).
message CPUEvidence {
  // Mean cores over the window's samples.
  double mean_cores = 1;
  // Highest single sample in the window.
  double peak_cores = 2;
  // Length of the window the samples cover.
  int64 window_seconds = 3;
  // Number of samples the mean was taken over.
  int32 samples = 4;
}

// Evidence bundles the flow, deny and configuration records that triggered
// a finding. Capped by the store to the most recent entries — see
// FindingStore.
message Evidence {
  repeated FlowEvidence flows = 1;
  repeated DenyEvidence denies = 2;
  repeated ConfigEvidence configs = 3;
  repeated ListenerEvidence listeners = 4;
  repeated CPUEvidence cpu = 5;
}

// MiningBehaviorThresholds tunes the mining-behavior rule (#2635). Persisted
// as protojson in the daemon config store under
// "threatdetect.mining_behavior.thresholds". A zero or empty field means
// "use the default" (in brackets below).
message MiningBehaviorThresholds {
  // Absolute CPU bar in cores [1.5]. The effective bar is
  // min(min_cores, min_fraction_of_limit x the box's limits.cpu); a box with
  // no CPU limit uses min_cores alone.
  double min_cores = 1;
  // Window the CPU mean is taken over [5m].
  google.protobuf.Duration window = 2;
  // Minimum age of a qualifying flow, seen within the window [3m].
  google.protobuf.Duration flow_min_age = 3;
  // Destination ports treated as stratum (mining pool) ports
  // [3333, 4444, 5555, 7777, 14444, 14433].
  repeated uint32 stratum_ports = 4;
  // Fraction of the box's CPU limit that also trips the bar [0.75].
  double min_fraction_of_limit = 5;
}

// Finding is a single security finding raised by the threat-detection
// engine: an open or resolved instance of a rule firing for one tenant.
message Finding {
  int64 id = 1;
  ThreatRuleId rule = 2;
  ThreatSeverity severity = 3;
  string tenant_id = 4;
  // Container name, when the finding is attributable to one container.
  string container = 5;
  string backend_id = 6;
  // Dedupe scope within (rule, tenant_id): destination IP, peer tenant id,
  // or "" — see FindingStore's open-finding unique index.
  string subject = 7;
  FindingState state = 8;
  // How many times this rule has fired for this (tenant, subject) since
  // first_seen, without a new row being created.
  int64 count = 9;
  Evidence evidence = 10;
  google.protobuf.Timestamp first_seen = 11;
  google.protobuf.Timestamp last_seen = 12;
  // What the process responder (#2636) did about this finding, if anything.
  // Unset for findings no policy acts on.
  FindingResponse response = 13;
}

// ProcessAction is what a HIGH mining finding does to its container (#2636).
// Every action is reversible with ReleaseProcessAction; none destroys data.
enum ProcessAction {
  PROCESS_ACTION_UNSPECIFIED = 0;
  // Record the finding, notify, do nothing to the container. The default.
  PROCESS_ACTION_ALERT = 1;
  // Record the box's current limits.cpu / limits.cpu.allowance, then set
  // limits.cpu.allowance to ProcessPolicy.throttle_allowance.
  PROCESS_ACTION_THROTTLE = 2;
  // Pause the instance through Incus (cgroup freezer): memory and disk kept,
  // no process runs until released.
  PROCESS_ACTION_FREEZE = 3;
}

// ResponseState is the lifecycle of one FindingResponse.
enum ResponseState {
  RESPONSE_STATE_UNSPECIFIED = 0;
  // The policy was ALERT: nothing was done to the container.
  RESPONSE_STATE_NONE = 1;
  // The action is in effect.
  RESPONSE_STATE_APPLIED = 2;
  // Incus refused the action; `error` says why. The responder does not retry
  // — the rule's next sweep re-fires the finding, which is the retry.
  RESPONSE_STATE_FAILED = 3;
  // An operator released the action (ReleaseProcessAction).
  RESPONSE_STATE_RELEASED = 4;
  // The TTL backstop released the action with no operator decision.
  RESPONSE_STATE_EXPIRED = 5;
}

// FindingResponse records what the process responder did about a finding
// and when, so the finding itself tells the operator whether a box is
// currently throttled or frozen because of it.
message FindingResponse {
  ProcessAction action = 1;
  ResponseState state = 2;
  // Reserved for the signature rule's additive kill (#2638).
  bool process_killed = 3;
  google.protobuf.Timestamp applied_at = 4;
  // When the TTL backstop will release the action if no operator does.
  google.protobuf.Timestamp expires_at = 5;
  google.protobuf.Timestamp released_at = 6;
  // "operator" or "ttl"; empty while the action is in effect.
  string released_by = 7;
  // Incus error text when state is FAILED.
  string error = 8;
}

// ProcessPolicy says what a HIGH mining finding does to its container
// (#2636). Stored per backend (the default) and optionally per container
// (an override, written by SetProcessPolicy with `container` set); the
// effective policy is override → backend default → built-in
// {ALERT, "10%", 24h}. Empty fields inherit from the next level down.
message ProcessPolicy {
  ProcessAction action = 1;
  // limits.cpu.allowance applied by THROTTLE: an Incus allowance such as
  // "10%" (share under contention) or "10ms/100ms" (hard CFS quota).
  // Default "10%".
  string throttle_allowance = 2;
  // How long an applied action stays in effect with no operator decision
  // before the TTL backstop releases it. Default 24h.
  google.protobuf.Duration ttl = 3;
  // Field 4 is kill_process (signature rule, #2638); it is assigned there.
  // Do not reuse the number.

  // Thresholds of the mining-behavior rule (#2635). Backend-wide: honoured
  // only on the backend default (container empty), rejected on a container
  // override. Unset on Set leaves the stored thresholds untouched.
  MiningBehaviorThresholds mining_behavior = 5;
}

message GetProcessPolicyRequest {
  // Empty reads the backend default; a container name reads that
  // container's override (policy is unset when none is stored).
  string container = 1;
}

message GetProcessPolicyResponse {
  // The policy stored at the requested level, unset if none is stored.
  ProcessPolicy policy = 1;
  // True when `container` was given and an override is stored for it.
  bool is_override = 2;
  // The fully-resolved policy the responder would apply at that level.
  ProcessPolicy effective = 3;
}

message SetProcessPolicyRequest {
  // Empty sets the backend default; a container name sets that container's
  // override.
  string container = 1;
  ProcessPolicy policy = 2;
  // With `container` set, removes the override instead of writing one.
  bool clear_override = 3;
}

message SetProcessPolicyResponse {
  ProcessPolicy effective = 1;
}

message ReleaseProcessActionRequest {
  string container = 1;
}

message ReleaseProcessActionResponse {
  // The finding the action belonged to, now resolved with its response in
  // state RELEASED.
  Finding finding = 1;
}

// SentryState is the overall on/off state of the background threat-detection
// engine, as reported by GetSentryStatus.
enum SentryState {
  SENTRY_STATE_UNSPECIFIED = 0;
  // CONTAINARIUM_THREAT_SENTRY is not set — the engine was never constructed.
  SENTRY_STATE_DISABLED = 1;
  // Sentry is enabled but the eBPF object isn't loaded (no flow/deny
  // signals to evaluate), or the FindingStore has no Postgres connection.
  // Never silently report "no findings" — always UNAVAILABLE with a reason.
  SENTRY_STATE_UNAVAILABLE = 2;
  // Running, but FindingStore has no Postgres connection: findings/events/
  // audit entries still flow, backed by a bounded in-memory ring instead of
  // persisted rows — they do not survive a daemon restart.
  SENTRY_STATE_DEGRADED = 3;
  // Running normally with Postgres-backed persistence.
  SENTRY_STATE_OK = 4;
}

// RuleStatus is one registered rule's health, so a single panicking rule is
// visible without taking down the sentry status as a whole.
message RuleStatus {
  ThreatRuleId rule = 1;
  bool healthy = 2;
  // Empty when healthy. Set to the last recovered panic/error otherwise.
  string last_error = 3;
  google.protobuf.Timestamp last_error_at = 4;
}

message GetSentryStatusRequest {}

message GetSentryStatusResponse {
  SentryState state = 1;
  // Human-readable explanation, always set for DISABLED/UNAVAILABLE.
  string reason = 2;
  repeated RuleStatus rules = 3;
}

// BadDestinationEntry is one entry in the known-bad-destination list (#1641)
// matched against flow destination IPs — a mining pool or other known-bad
// endpoint.
message BadDestinationEntry {
  // Exact IP ("203.0.113.7") or CIDR ("203.0.113.0/24").
  string cidr = 1;
  string label = 2;
  // "baseline" (embedded, versioned list, shipped with the daemon) or
  // "operator" (added via AddBadDestination, without a daemon rebuild).
  string source = 3;
}

message ListBadDestinationsRequest {}

message ListBadDestinationsResponse {
  repeated BadDestinationEntry entries = 1;
}

message AddBadDestinationRequest {
  string cidr = 1;
  string label = 2;
}

message AddBadDestinationResponse {
  BadDestinationEntry entry = 1;
}

message RemoveBadDestinationRequest {
  string cidr = 1;
}

message RemoveBadDestinationResponse {}

// ListFindingsRequest filters ListFindings. Every field is optional; an
// unset field matches everything. tenant_id is enforced by the server's RBAC
// interceptor the same way ListContainersRequest.username is: a non-admin
// caller may only ever see their own tenant_id, regardless of what (if
// anything) they set here.
message ListFindingsRequest {
  // Exact match. THREAT_SEVERITY_UNSPECIFIED (default) matches any severity.
  ThreatSeverity severity = 1;
  string tenant_id = 2;
  // Only findings last seen at or after this time. Unset matches everything.
  google.protobuf.Timestamp since = 3;
  // Exact match. FINDING_STATE_UNSPECIFIED (default) matches any state.
  FindingState state = 4;
  // <= 0 or > 200 is treated as the server default (50).
  int32 limit = 5;
}

message ListFindingsResponse {
  repeated Finding findings = 1;
}

message ResolveFindingRequest {
  int64 id = 1;
}

message ResolveFindingResponse {
  Finding finding = 1;
}

// ThreatDetectionService serves the background security-sentry's status and
// findings. GetSentryStatus ships with #1640 (background detection loop);
// *BadDestination* ships with #1641 (known-bad destination rule);
// ListFindings/ResolveFinding ship with #1643 (findings delivery + triage);
// rule-config RPCs remain unimplemented — see
// docs/architecture/continuous-threat-detection.md.
service ThreatDetectionService {
  // GetSentryStatus returns the detection engine's on/off state and the
  // health of every registered rule.
  rpc GetSentryStatus(GetSentryStatusRequest) returns (GetSentryStatusResponse) {
    option (google.api.http) = {
      get: "/v1/security/sentry/status"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get threat-detection sentry status";
      description: "Returns the background detection engine's on/off state (disabled, unavailable, degraded, ok) and per-rule health.";
      tags: "Security";
    };
  }

  // ListBadDestinations returns the merged baseline + operator-added
  // known-bad-destination list the bad-destination rule matches against.
  rpc ListBadDestinations(ListBadDestinationsRequest) returns (ListBadDestinationsResponse) {
    option (google.api.http) = {
      get: "/v1/security/bad-destinations"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List known-bad destinations";
      description: "Returns the merged baseline (embedded, versioned) and operator-added known-bad-destination list.";
      tags: "Security";
    };
  }

  // AddBadDestination adds an operator-supplied entry to the known-bad
  // destination list, persisted so it survives a daemon restart, without a
  // daemon rebuild.
  rpc AddBadDestination(AddBadDestinationRequest) returns (AddBadDestinationResponse) {
    option (google.api.http) = {
      post: "/v1/security/bad-destinations"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Add a known-bad destination";
      description: "Adds an operator-supplied CIDR or exact IP to the known-bad-destination list.";
      tags: "Security";
    };
  }

  // RemoveBadDestination removes a previously operator-added entry. Baseline
  // (embedded) entries cannot be removed this way — a bare "not found" error
  // covers the case since only additions are ever tracked as removable.
  rpc RemoveBadDestination(RemoveBadDestinationRequest) returns (RemoveBadDestinationResponse) {
    option (google.api.http) = {
      delete: "/v1/security/bad-destinations/{cidr=**}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Remove an operator-added bad destination";
      description: "Removes a previously operator-added entry from the known-bad-destination list. Baseline entries cannot be removed.";
      tags: "Security";
    };
  }

  // ListFindings lists security findings, most recently seen first.
  // Tenant-scoped: a non-admin caller only ever sees their own tenant_id.
  rpc ListFindings(ListFindingsRequest) returns (ListFindingsResponse) {
    option (google.api.http) = {
      get: "/v1/security/findings"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List security findings";
      description: "Lists security findings with optional severity/tenant/since/state filters, most recently seen first. Non-admin callers only see their own tenant.";
      tags: "Security";
    };
  }

  // ResolveFinding transitions an open finding to resolved. Fails if the
  // finding is already resolved or doesn't exist.
  rpc ResolveFinding(ResolveFindingRequest) returns (ResolveFindingResponse) {
    option (google.api.http) = {
      post: "/v1/security/findings/{id}/resolve"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Resolve a security finding";
      description: "Marks an open finding as resolved. Fails with FAILED_PRECONDITION if it's already resolved, NOT_FOUND if it doesn't exist.";
      tags: "Security";
    };
  }

  // GetProcessPolicy returns the process policy stored at one level (backend
  // default, or one container's override) and the effective policy the
  // responder applies there (#2636).
  rpc GetProcessPolicy(GetProcessPolicyRequest) returns (GetProcessPolicyResponse) {
    option (google.api.http) = {
      get: "/v1/security/process-policy"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get the process policy";
      description: "Returns the stored process policy (backend default, or a container's override when ?container= is given) and the effective policy after override → default → built-in ALERT resolution.";
      tags: "Security";
    };
  }

  // SetProcessPolicy writes the backend default, or one container's
  // override (clear_override removes it). Admin-only: the policy decides
  // what happens to a tenant's box.
  rpc SetProcessPolicy(SetProcessPolicyRequest) returns (SetProcessPolicyResponse) {
    option (google.api.http) = {
      put: "/v1/security/process-policy"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Set the process policy";
      description: "Sets what a HIGH mining finding does to its container: ALERT (default), THROTTLE or FREEZE, with the throttle allowance and TTL. With container set it writes a per-container override; clear_override removes one.";
      tags: "Security";
    };
  }

  // ReleaseProcessAction undoes the open action on a container: restores the
  // recorded CPU limit or unfreezes it, and resolves the finding.
  rpc ReleaseProcessAction(ReleaseProcessActionRequest) returns (ReleaseProcessActionResponse) {
    option (google.api.http) = {
      post: "/v1/security/process-policy/release"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Release a process action";
      description: "Restores the container's recorded CPU limit (THROTTLE) or unfreezes it (FREEZE), marks the action released by the operator, and resolves its finding. NOT_FOUND when no action is open on the container.";
      tags: "Security";
    };
  }
}
