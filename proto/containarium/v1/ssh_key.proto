syntax = "proto3";

package containarium.v1;

option go_package = "github.com/footprintai/containarium/pkg/pb/containarium/v1;containariumv1";

// SSHKeyType identifies the OpenSSH algorithm, including FIDO2-backed keys.
// Shared by device-key registration and the SSH live-authorization contract.
enum SSHKeyType {
  SSH_KEY_TYPE_UNSPECIFIED = 0;
  SSH_KEY_TYPE_ED25519 = 1;
  SSH_KEY_TYPE_RSA = 2;
  SSH_KEY_TYPE_ECDSA = 3;
  SSH_KEY_TYPE_SK_ED25519 = 4;
  SSH_KEY_TYPE_SK_ECDSA = 5;
}
