name: Sign and verify a container image
description: >
  Keyless cosign signature of one pushed image, by digest, verified against
  this repository's workflow at the release tag. The calling job needs
  `id-token: write` and registry login already done, must have checked out
  the repository, and should run this on release tags only
  (`if: startsWith(github.ref, 'refs/tags/v')`); the script refuses any other
  ref as well.

inputs:
  image:
    description: Repository without tag or digest, e.g. ghcr.io/<org>/<name>
    required: true
  digest:
    description: The pushed digest (docker/build-push-action `digest` output)
    required: true
  workflow-file:
    description: The workflow file that signs, e.g. sidecars.yml; pinned in the identity check
    required: true

runs:
  using: composite
  steps:
    # Same installer and cosign release as release.yml's sign-release job.
    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: v3.1.3

    - name: Sign and verify by digest
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        DIGEST: ${{ inputs.digest }}
        WORKFLOW_FILE: ${{ inputs.workflow-file }}
        EVIDENCE_DIR: ${{ runner.temp }}/image-signatures
      run: |
        "$GITHUB_WORKSPACE/scripts/release/sign-image.sh" \
          "$IMAGE" "$DIGEST" "$WORKFLOW_FILE" "$EVIDENCE_DIR"
        # Name the artifact after the image (artifact names are unique per run).
        echo "IMAGE_SIGNATURE_NAME=${IMAGE##*/}" >> "$GITHUB_ENV"

    - name: Save the signed digest as evidence
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: image-signature-${{ env.IMAGE_SIGNATURE_NAME }}
        path: ${{ runner.temp }}/image-signatures/
        if-no-files-found: error
