name: CLI client/server split gates

# Pins the guarantee docs/architecture/cli-client-server-split.md (#1769)
# exists for: the containarium CLIENT (cmd/containarium, -tags
# containarium_client) cannot fall into local mode because the code isn't
# there to fall into. Seven checks, from the design's Test strategy
# section and Rollout Phase 2:
#   1. dependency-graph gate — the client's link is free of daemon-only
#      packages (scripts/test-cli-split-deps.sh)
#   2. command-tree allow-list gate — the client's registered command set
#      matches a checked-in golden list exactly
#   3. untagged-build parity — containariumd's tree is a strict superset of
#      that golden list (the split never *loses* a command server-side).
#      Runs in proxyproto-e2e's full-tree default-tags job, not here.
#   4. both tag sets build here; the client tag set's go test runs here, and
#      the default tag set's in that full-tree job
#   5. stale install-path gate (#1781) — no host-side script/unit/terraform
#      file installs or downloads the daemon binary under the pre-rollout
#      /usr/local/bin/containarium path (scripts/test-old-binary-path-gate.sh)
#   6. release-artifact gate (#1784) — `make build-all` produces
#      containarium-* as the static client build (incl. windows) and
#      containariumd-* as the server build, checked on the built binaries
#      (scripts/test-release-artifacts.sh; build-release runs it too)
#   7. daemon-artifact-name gate (#1784) — no host-side installer,
#      provisioner or bundle fetches containarium-<os>-<arch> as the daemon
#      (scripts/test-daemon-artifact-name-gate.sh)
#   8. whole-tree constraint gate (#2864, #2886) — `go vet -tags
#      containarium_client ./...` and a Windows build of every package
#      outside the Linux-only daemon set (scripts/test-build-constraint-sets.sh)
#
# Regression guard on MCP: build-mcp/build-agent-box already exist as
# their own CI concerns elsewhere (release.yml's build-release covers
# them) and are UNAFFECTED by this split — internal/mcp defines its own
# API interface backed by internal/client, never imports internal/cmd, so
# neither cmd/mcp-server nor cmd/agent-box needed a line changed here.
# Nothing to add to this workflow for them; recorded so the next person
# doesn't assume a gap.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Release-PR fast path (.github/actions/release-only-diff): on a diff that
  # only cuts a release on top of a main commit that already passed this
  # workflow, the heavy jobs below skip. Any doubt runs them.
  changes:
    name: Release-only diff?
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      release-only: ${{ steps.diff.outputs.release-only }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Decide
        id: diff
        uses: ./.github/actions/release-only-diff

  dependency-graph:
    name: Dependency-graph gate (containarium_client)
    needs: changes
    # !cancelled(): a failed detector leaves the output empty and this job
    # RUNS. Without it the job would skip, and a skipped required check passes.
    if: ${{ !cancelled() && needs.changes.outputs.release-only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: ./.github/actions/setup-go-cached
        with:
          go-version: '1.26.10'
          cache-name: shared

      - name: Run test-cli-split-deps.sh
        run: ./scripts/test-cli-split-deps.sh

  old-binary-path-gate:
    name: Stale install-path gate (#1781)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run test-old-binary-path-gate.sh
        run: ./scripts/test-old-binary-path-gate.sh

  wait-daemon-ready:
    name: E2E daemon-readiness probe (#3143)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run test-wait-daemon-ready.sh
        run: ./scripts/test-wait-daemon-ready.sh

  daemon-artifact-name-gate:
    name: Daemon-artifact-name gate (#1784)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run test-daemon-artifact-name-gate.sh
        run: ./scripts/test-daemon-artifact-name-gate.sh

  release-artifacts:
    name: Release-artifact gate (#1784)
    needs: changes
    # !cancelled(): a failed detector leaves the output empty and this job
    # RUNS. Without it the job would skip, and a skipped required check passes.
    if: ${{ !cancelled() && needs.changes.outputs.release-only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: ./.github/actions/setup-go-cached
        with:
          go-version: '1.26.10'
          cache-name: build-all

      - name: Build release binaries (make build-all)
        # The real release recipe, minus its proto/web-ui/swagger-ui
        # prerequisites (-o marks them up to date): pkg/pb is committed, and
        # this gate is about which package/tags/cgo each artifact is built
        # with, not about the embedded UI assets.
        run: make -o proto -o web-ui -o swagger-ui build-all

      - name: Run test-release-artifacts.sh
        run: ./scripts/test-release-artifacts.sh bin

  build-both-binaries:
    name: Build both binaries (containarium client + containariumd)
    needs: changes
    # !cancelled(): a failed detector leaves the output empty and this job
    # RUNS. Without it the job would skip, and a skipped required check passes.
    if: ${{ !cancelled() && needs.changes.outputs.release-only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: ./.github/actions/setup-go-cached
        with:
          go-version: '1.26.10'
          cache-name: cli-binaries

      - name: Build containarium (client)
        run: CGO_ENABLED=0 go build -tags containarium_client -o /dev/null ./cmd/containarium

      - name: Build containariumd (server, today's binary)
        run: go build -o /dev/null ./cmd/containariumd

      - name: Untagged cmd/containarium must fail to build
        # Pins #1773's other half: a bare `go build ./cmd/containarium`
        # (no tag) must fail with "build constraints exclude all Go
        # files", not silently produce a full-surface binary under the
        # client's name.
        run: |
          if go build -o /dev/null ./cmd/containarium 2>/tmp/err; then
            echo "::error::untagged 'go build ./cmd/containarium' succeeded; it must fail"
            exit 1
          fi
          grep -q "build constraints exclude all Go files" /tmp/err || {
            echo "::error::unexpected failure reason:"; cat /tmp/err; exit 1;
          }

      - name: Windows cross-compile (client)
        run: GOOS=windows GOARCH=amd64 go build -tags containarium_client -o /dev/null ./cmd/containarium

      - name: Windows cross-compile hostcheck
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./internal/hostcheck/

      - name: Test hostcheck and agent-box packages
        run: go test ./internal/hostcheck/ ./internal/agentbox/ ./internal/sandbox/dialer/

      - name: macOS cross-compile (client and agent-box)
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" go build -tags containarium_client -o /dev/null ./cmd/containarium/
            CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" go build -o /dev/null ./cmd/agent-box/
          done

      - name: Keep agent-box excluded from Windows
        run: |
          for pkg in ./internal/agentbox/ ./cmd/agent-box/; do
            count=$(GOOS=windows GOARCH=amd64 go list -e -f '{{len .GoFiles}}' "$pkg")
            if [ "$count" != "0" ]; then
              echo "::error::$pkg contains source files enabled for Windows"
              exit 1
            fi
          done

      - name: Whole-tree client-tag vet and Windows build (#2864, #2886)
        # The steps above check ./cmd/containarium's graph only. This runs
        # `go vet -tags containarium_client ./...` (tests included) and a
        # Windows build of every package outside the Linux-only daemon set
        # the script lists, so a broad local run stays green on main.
        run: ./scripts/test-build-constraint-sets.sh

  test-both-tag-sets:
    name: go test ./internal/cmd/... ./internal/coderun/... ./internal/sshconfig/... (both tag sets)
    needs: changes
    # !cancelled(): a failed detector leaves the output empty and this job
    # RUNS. Without it the job would skip, and a skipped required check passes.
    if: ${{ !cancelled() && needs.changes.outputs.release-only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: ./.github/actions/setup-go-cached
        with:
          go-version: '1.26.10'
          cache-name: cli-tests

      # Client tag set only. The default-tag run of these packages (including
      # TestContainariumdCommandTree_SupersetOfClientGolden, the untagged-build
      # parity gate) used to be a step here too, but proxyproto-e2e's required
      # "Unit + default e2e" job already runs the whole module under -race with
      # default tags, these packages included. Running them twice cost ~4
      # minutes per PR and measured nothing new. ./internal/coderun/...
      # (#1727) and ./internal/guardrail/... (#2367) joined this lane before
      # that full-tree run existed. ./internal/proofpack/... (#2797) was
      # default-tags only, so it now lives entirely in the full-tree run.
      # The job name above is left unchanged so a required-check name stays put.
      - name: Test containarium client (containarium_client tag)
        # Includes TestClientCommandTree_MatchesGoldenAllowList — the
        # command-tree allow-list gate — and TestHybridCommands_
        # NoServer_NeverReachRealLocalMode / TestMovedServerCommands_
        # ExitTwoNamingContainariumd from #1775/#1777.
        run: go test -race -tags containarium_client -v ./internal/cmd/... ./internal/coderun/... ./internal/sshconfig/... ./internal/sshkey/... ./internal/guardrail/...
