name: agent-runtime

# The in-box agent loop (agent-runtime/, Node/TS) had no CI lane: it was only
# ever built at release time. The design for the tracker broker's in-box mount
# (#1922, D4) calls for a type gate and a test runner on it, so this is that
# lane — typecheck (source + tests) and Vitest, on changes to the package or
# the shared daemon<->runtime contract fixture.

on:
  pull_request:
    paths:
      - 'agent-runtime/**'
      - '.github/workflows/agent-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'agent-runtime/**'
      - '.github/workflows/agent-runtime.yml'

permissions:
  contents: read

jobs:
  test:
    name: agent-runtime typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-runtime
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: agent-runtime/package-lock.json
      - run: npm ci
      - name: Typecheck (source and tests)
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build (what the release bundle runs)
        run: npm run build
