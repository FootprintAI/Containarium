name: helm-lint

on:
  push:
    branches: [main]
    paths:
      - 'charts/**'
  # No `branches:` filter — a base filter leaves stacked PRs with no checks
  # at all, which looks the same as checks not having started (#1215). The
  # `paths` filter stays: scoping by what changed is intentional, scoping by
  # base branch was not.
  pull_request:
    paths:
      - 'charts/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm-lint:
    name: helm lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.2

      - name: Lint containarium-k8s
        run: helm lint charts/containarium-k8s

      - name: Template render (smoke test)
        # gateway.upstreamKeySecret must be set or the chart's own #1496 guard
        # (daemon-deployment.yaml) intentionally refuses to render at all —
        # unrelated to what this smoke test checks (template syntax/rendering
        # errors in general), so satisfy it with a placeholder value.
        run: |
          helm template containarium charts/containarium-k8s \
            --set gateway.upstreamKeySecret=smoke-test-placeholder \
            > /dev/null
