name: golangci-lint

# Full golangci-lint gate (config in .golangci.yml): the `standard` linter set
# — errcheck, govet, ineffassign, staticcheck, unused — plus the gofmt
# formatter (simplify on). Runs on Linux so results match the CI target
# (build-tagged files differ by GOOS). Supersedes the old standalone gofmt
# workflow, whose `gofmt -s` check is now covered by the gofmt formatter here.

on:
  push:
    branches: [main]
  # No `branches:` filter here, deliberately (#1215). Filtering PRs to base
  # `main` gives a PR targeting any other branch — i.e. every stacked PR —
  # ZERO checks: not failing, not pending, just absent. That is
  # indistinguishable from "CI hasn't started yet", so an ungated PR reads as
  # ready to merge. `push` stays pinned to main so branch pushes don't
  # double-run alongside the PR.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Release-PR fast path (.github/actions/release-only-diff): on a diff that
  # only cuts a release on top of a main commit that already passed this
  # workflow, the heavy jobs below skip. Any doubt runs them.
  changes:
    name: Release-only diff?
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      release-only: ${{ steps.diff.outputs.release-only }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Decide
        id: diff
        uses: ./.github/actions/release-only-diff

  golangci:
    name: golangci-lint
    needs: changes
    # !cancelled(): a failed detector leaves the output empty and this job
    # RUNS. Without it the job would skip, and a skipped required check passes.
    if: ${{ !cancelled() && needs.changes.outputs.release-only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: ./.github/actions/setup-go-cached
        with:
          go-version: '1.26.10'
          cache-name: shared

      - name: Install golangci-lint
        # Pinned to the version the config (version: "2") targets. `go install`
        # avoids the install.sh tarball-checksum flake seen in box CI.
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Run golangci-lint
        run: golangci-lint run --timeout=10m
