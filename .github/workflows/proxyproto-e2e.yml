name: PROXY Protocol E2E

on:
  push:
    branches: [main]
  # No `branches:` filter — a base filter leaves stacked PRs with no checks
  # at all, which looks the same as checks not having started (#1215).
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Release-PR fast path (.github/actions/release-only-diff): on a diff that
  # only cuts a release on top of a main commit that already passed this
  # workflow, the heavy jobs below skip. Any doubt runs them.
  changes:
    name: Release-only diff?
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      release-only: ${{ steps.diff.outputs.release-only }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Decide
        id: diff
        uses: ./.github/actions/release-only-diff

  unit-and-default-e2e:
    name: Unit + default e2e
    needs: changes
    # !cancelled(): a failed detector leaves the output empty and this job
    # RUNS. Without it the job would skip, and a skipped required check passes.
    if: ${{ !cancelled() && needs.changes.outputs.release-only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: ./.github/actions/setup-go-cached
        with:
          go-version: '1.26.10'
          cache-name: unit-race

      - name: Windows client cross-compile guard
        # The release builds a client-only Windows binary (cmd/containarium for
        # GOOS=windows). It must not pull in the daemon, which imports the
        # Linux-only eBPF loader (internal/netbpf). This catches a new cmd file
        # importing internal/server without a //go:build !windows guard at PR
        # time instead of at release time (see #884 / v0.47.0).
        #
        # #1773: cmd/containarium/main.go now carries
        # //go:build containarium_client (the tagged client entrypoint;
        # cmd/containariumd/main.go is today's untagged superset binary), so
        # the client build requires the tag or the compiler correctly refuses
        # with "build constraints exclude all Go files".
        run: GOOS=windows GOARCH=amd64 go build -tags containarium_client -o /dev/null ./cmd/containarium/

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Web UI build guard
        # `make build-release` runs a full `next build` (with TypeScript
        # type-checking) that no PR-time job exercised — the same "only
        # caught at release time" gap as the Windows guard above, just for
        # the web UI. A prop destructure typo (#886) and two wrong-argument
        # client calls broke v0.48.0's release build (webui compiled fine in
        # `next dev`/lint, only `next build`'s full type-check caught it).
        # Same fix shape as #884/#885: run the real release build at PR time.
        #
        # #2224: `npm run test` (Vitest) runs alongside the build so the
        # zod schema / swagger-contract tests and component tests gate PRs
        # too, not just the type-check `next build` happens to do.
        working-directory: web-ui
        run: |
          npm ci
          npm run typecheck
          npm run test
          npm run build

      - name: Run unit tests (full tree, minus infra integration)
        # Runs the WHOLE module's unit tests, not just sentinel+app, so a
        # regression anywhere — e.g. internal/server's TestDiagnose (#1024),
        # which slipped onto main precisely because this job only tested
        # sentinel+app — is gated at PR time. test/integration is excluded: it
        # needs live infra (incus/storage) not present on the runner and fails
        # closed without it.
        #
        # The -skip list that used to live here excluded five sentinel tests
        # that needed root on an unprivileged runner. They no longer do
        # (#1278, #1280): the `ip addr` calls sit behind a seam the tests
        # substitute, so registration bookkeeping is exercised without
        # CAP_NET_ADMIN.
        #
        # Removing the list is the point of those changes. While it was here,
        # the three tunnel tests never ran in CI at all — and running them
        # under -race is what surfaced a genuine data race in the seam itself.
        run: |
          go test -race -timeout 8m \
            $(go list ./... | grep -v '/test/integration')

  real-caddy-e2e:
    name: Real Caddy wire-compat e2e
    needs: changes
    # !cancelled(): a failed detector leaves the output empty and this job
    # RUNS. Without it the job would skip, and a skipped required check passes.
    if: ${{ !cancelled() && needs.changes.outputs.release-only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: ./.github/actions/setup-go-cached
        with:
          go-version: '1.26.10'
          cache-name: shared

      - name: Cache built caddy binary
        id: cache-caddy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ./bin/caddy
          # Bump the suffix to invalidate the cache when bumping Caddy.
          key: caddy-${{ runner.os }}-amd64-v2-stable

      - name: Build Caddy via xcaddy
        if: steps.cache-caddy.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest
          mkdir -p bin
          xcaddy build --output ./bin/caddy

      - name: Verify proxy_protocol module is present
        run: |
          set -euo pipefail
          ./bin/caddy version
          ./bin/caddy list-modules | grep -E '^caddy\.listeners\.proxy_protocol$' \
            || { echo "::error::proxy_protocol listener wrapper missing from Caddy build"; exit 1; }

      - name: Put built Caddy on PATH
        run: echo "${{ github.workspace }}/bin" >> "$GITHUB_PATH"

      - name: Run real-Caddy e2e
        run: |
          set -euo pipefail
          which caddy
          go test -v -timeout 5m \
            -tags=proxyproto_real_caddy \
            -run TestProxyProtocolE2E_RealCaddy \
            ./internal/sentinel/...
