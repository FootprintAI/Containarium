name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    # Scorecard does not support scanning fork repositories.
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Publish the report to this repository's code-scanning dashboard.
      security-events: write
      # Authenticate badge/API publication; this does not grant repository writes.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - name: Keep the report available for baseline comparisons
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-report
          path: scorecard.sarif
          if-no-files-found: error
          retention-days: 30

      - name: Upload to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scorecard.sarif
          category: OpenSSF-Scorecard
