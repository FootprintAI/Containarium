name: Release

on:
  push:
    tags:
      - 'v*'   # e.g. v0.16.4

  # Rehearsal trigger (#1119 follow-up). A tag push is currently the ONLY
  # way these builds ever run, so the two release incidents this repo has
  # recorded (v0.47.0's Windows cross-compile break, v0.48.0's web-ui build
  # failure) were both invisible until the real release build failed — with a
  # burned tag as the cost. This lets the identical build run on any ref
  # WITHOUT publishing anything.
  #
  # Deliberately publish-free: nothing here pushes an image, uploads an
  # artifact, or creates a Release. Publishing stays exclusively on tag push,
  # so a rehearsal cannot become an accidental release.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build as (without v prefix), e.g. 0.61.0. Build only — publishes nothing.'
        required: false
        default: '0.0.0-dryrun'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history + tags: the changelog step below diffs this ref
          # against the previous tag, which a depth-1 clone cannot see.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'

      - name: Install buf
        # `make build-release` transitively runs `make proto`, which
        # needs the buf CLI. Ubuntu runners don't have it preinstalled.
        # The .pb.go files are already committed, but the dep chain
        # still triggers buf generate; installing it satisfies that.
        #
        # Pinned release BINARY, not `go install .../buf@latest`: buf's
        # own go.mod tracks current Go releases closely (e.g. v1.73.0
        # requires go >= 1.26.7), so `@latest` silently breaks this step
        # the day upstream bumps past whatever Go version this repo's
        # workflows pin — with no code change on our side to explain it
        # (caught rehearsing the v0.77.0 release build, 2026-09-13).
        # A pinned binary download has no such dependency on the runner's
        # Go toolchain at all. Bump scripts/buf-version.env deliberately.
        run: |
          set -euo pipefail
          ./scripts/install-buf.sh /usr/local/bin/buf
          buf --version

      - name: Get version
        id: get_version
        # Tag push -> the tag. Rehearsal -> the dispatch input, since
        # github.ref is a branch there and would yield a nonsense version.
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Verify the release is described
        # Two release conventions this repo documents but has never enforced,
        # each of which has now silently failed three times:
        #
        #   * CHANGELOG.md missing the release it ships. #1431 recorded the
        #     trap ("release notes that do not describe the release"), #1482
        #     and #1486 each nearly hit it, and v0.71.0 was about to ship with
        #     an entire feature surface undocumented.
        #   * pkg/version/version.go left stale. 0.68, 0.69 and 0.70 all
        #     shipped with the constant still reading 0.67.0, so anyone
        #     building from source between releases saw a version four behind.
        #     RELEASE-PROCESS.md says outright that nothing checks this.
        #
        # Both are one grep. Failing here costs a re-tag; failing to check
        # costs a published release that misrepresents itself, which cannot
        # be taken back.
        #
        # Skipped on the rehearsal path: workflow_dispatch builds a synthetic
        # version deliberately unrelated to any changelog entry.
        if: github.event_name != 'workflow_dispatch'
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          set -euo pipefail
          failed=0

          if ! grep -qE "^## \\[${VERSION}\\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::No '## [${VERSION}]' section — this tag would publish notes that do not describe it. Add the section (see docs/RELEASE-PROCESS.md) and re-tag."
            failed=1
          else
            # A heading with nothing under it is the same failure wearing a
            # hat: the section exists, so a reader assumes it was written.
            body=$(awk -v v="## [${VERSION}]" '
              index($0, v) == 1 {found=1; next}
              found && /^## \[/ {exit}
              found {print}
            ' CHANGELOG.md | grep -vE '^\s*$' | grep -vE '^###' || true)
            if [ -z "${body}" ]; then
              echo "::error file=CHANGELOG.md::'## [${VERSION}]' exists but has no entries under it."
              failed=1
            fi
          fi

          constant=$(grep -oE 'Version = "[^"]+"' pkg/version/version.go | head -1 | cut -d'"' -f2)
          if [ "${constant}" != "${VERSION}" ]; then
            echo "::error file=pkg/version/version.go::Version constant is \"${constant}\" but the tag is v${VERSION}. Bump it and re-tag."
            failed=1
          fi

          [ "${failed}" = "0" ] || exit 1
          echo "✓ CHANGELOG has a [${VERSION}] section with entries; version constant matches."

      - name: Compile eBPF network-policy object (#627)
        # Builds internal/netbpf/netpolicy.bpf.o so the next `make` invocation
        # auto-enables -tags embed_bpf and bakes the object into the
        # containarium binary (operators enable it with
        # CONTAINARIUM_NETWORK_POLICY_BPF_OBJECT=embedded — no on-backend clang).
        # The runner is little-endian amd64; -target bpfel makes one object that
        # serves every little-endian backend (amd64/arm64). UAPI-only program, so
        # portable across kernel versions; the verifier still runs at load time.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev linux-libc-dev
          # bpftool for vmlinux.h (#2637): a pinned static release from
          # github.com/libbpf/bpftool, checksum-verified. Not Ubuntu's
          # linux-tools: on the Azure runner kernels the only thing those
          # packages leave on disk is the linux-tools-common wrapper, which
          # cannot run (proved by runs 39210535656 / 39212425801). Dumping
          # /sys/kernel/btf/vmlinux does not need a kernel-matched binary.
          BPFTOOL_VERSION=v7.6.0
          BPFTOOL_SHA256=51ffd3dd4f46fdc46736433a971e828dc70835c6b18ad20cabffd10abcf00358
          curl -sSfL -o /tmp/bpftool.tar.gz "https://github.com/libbpf/bpftool/releases/download/${BPFTOOL_VERSION}/bpftool-${BPFTOOL_VERSION}-amd64.tar.gz"
          echo "${BPFTOOL_SHA256}  /tmp/bpftool.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/bpftool.tar.gz -C /usr/local/bin bpftool
          sudo chmod 0755 /usr/local/bin/bpftool
          BPFTOOL=/usr/local/bin/bpftool
          echo "bpftool: $BPFTOOL ($("$BPFTOOL" version | head -n1))"
          make build-bpf BPFTOOL="$BPFTOOL"

      - name: Build all release artifacts
        # `make build-release` builds containariumd (server) + mcp-server +
        # agent-box for linux/amd64, darwin/amd64, darwin/arm64, the
        # containarium CLIENT (-tags containarium_client, static; #1784)
        # for those three plus windows/amd64, and writes SHA256SUMS.txt.
        # It then runs scripts/test-release-artifacts.sh, which fails the
        # release if containarium-* is not the client build. The eBPF object
        # built above is embedded in containariumd-* only (-tags embed_bpf).
        run: make build-release VERSION="${GITHUB_REF_NAME#v}"

      - name: Tunnel client and sentinel interoperate (#2469)
        # Runs the built containariumd as BOTH the sentinel and the tunnel
        # client: reads the pin with `sentinel tunnel-identity`, registers a
        # spot over TLS and round-trips a request through the tunnel. Every
        # in-process tunnel test builds both halves from one tree, so none of
        # them noticed v0.101.0/.1 shipping a client that required a pin the
        # sentinel could not yet supply. Needs passwordless sudo (the sentinel
        # adds a loopback alias), which the runner has. Fails the release
        # before anything is published.
        run: |
          chmod +x bin/containariumd-linux-amd64
          scripts/ci/tunnel-smoke.sh bin/containariumd-linux-amd64

      - name: Previous release's tunnel client still registers (#2469)
        # The upgrade path: a tunnel host on the last release talking to the
        # NEW sentinel. A rollout upgrades sentinels and hosts at different
        # times, so this is the combination operators actually run. Skipped
        # (with a notice) when there is no previous release to fetch, e.g. the
        # first release or a rehearsal on a fork.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prev="$(gh release list --repo "${GITHUB_REPOSITORY}" --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName' || true)"
          if [ -z "${prev}" ] || [ "${prev}" = "${GITHUB_REF_NAME}" ]; then
            echo "::notice::no previous release to test as a tunnel client; skipping"
            exit 0
          fi
          mkdir -p prev-release
          gh release download "${prev}" --repo "${GITHUB_REPOSITORY}" -p 'containariumd-linux-amd64' -D prev-release --clobber
          chmod +x prev-release/containariumd-linux-amd64
          echo "tunnel client under test: ${prev}"
          scripts/ci/tunnel-smoke.sh bin/containariumd-linux-amd64 prev-release/containariumd-linux-amd64

      - name: Build macOS 11 client (best effort)
        # Stock Go >= 1.25 targets macOS 12+; this builds the CLIENT with a
        # privately patched toolchain so macOS 11 machines get a working
        # binary, published as containarium-darwin-<arch>-macos11 beside the
        # normal assets. See scripts/build-macos11.sh for what is patched and
        # why. It cannot be run-tested here (no macOS 11 runner): the script
        # only gates that the macOS-12-only symbol is gone from the binary.
        run: make build-macos11 VERSION="${GITHUB_REF_NAME#v}"

      - name: Build pre-built Caddy binary (#1617)
        # One Caddy binary with caddy-l4 + every DNS-01 provider baked in, so
        # setupCaddy (internal/server/core_services.go) can download+verify
        # it instead of running xcaddy on every host at provisioning time.
        # Appends to the SHA256SUMS.txt build-release just wrote (>> in the
        # Makefile target, not >) rather than a separate checksum file.
        run: make build-caddy

      - name: Set up Node
        # agent-runtime is a Node/TS sibling package (the in-box agent loop);
        # `make bundle-agent-runtime` runs npm ci + tsc and tars it.
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Build agent-runtime bundle
        # Produces bin/agent-runtime-bundle.tar.gz, pulled in-box by
        # scripts/install-agent-runtime.sh alongside agent-box-linux-amd64.
        run: make bundle-agent-runtime

      - name: List agent-runtime bundle in SHA256SUMS.txt (#2702)
        # Appends (>>) to the file build-release wrote, like build-caddy, so
        # every asset on the Release page has a checksum.
        run: (cd bin && shasum -a 256 agent-runtime-bundle.tar.gz >> SHA256SUMS.txt)

      - name: Build SDLC skills bundle
        # The pinned open-sdlc-skills role skills (#2065): fetched at the commit
        # in pkg/core/sdlcskills/sdlc-skills.lock and packaged deterministically, so a
        # lock whose sha256 does not match a rebuild fails the release here.
        # Pulled in-box by scripts/install-sdlc-skills.sh (the coding-agent
        # recipe and `containarium code install`).
        run: make bundle-sdlc-skills

      - name: List SDLC skills bundle in SHA256SUMS.txt (#2702)
        run: (cd bin && shasum -a 256 sdlc-skills.tar.gz >> SHA256SUMS.txt)

      - name: Install syft (SBOM generator)
        id: syft
        # Pinned to an exact tool version: the SPDX output differs between
        # syft releases and a release's SBOMs should be reproducible by
        # rerunning the same version.
        uses: anchore/sbom-action/download-syft@v0.24.3
        with:
          syft-version: v1.54.1

      - name: Generate SBOMs for the Linux binaries (#2561)
        # One SPDX document per distinct program, read from the shipped binary
        # itself (Go embeds its module list), then listed in SHA256SUMS.txt so
        # verifying the release's checksums covers them. Fails the release if a
        # document is empty. The container images carry their own SBOM.
        env:
          # The download action returns the binary's path as an output rather
          # than promising it is on PATH.
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: scripts/release/generate-sboms.sh bin

      - name: Generate changelog
        # The boilerplate below is identical on every release, so without
        # this a release page never says what actually changed in it (#1600).
        # Categorised from conventional-commit subjects since the previous
        # tag; anything not following the convention still lands in "Other"
        # so nothing is silently dropped.
        env:
          # github.ref_name is attacker-controllable (a tag name may contain
          # shell metacharacters). Routing it through env makes the shell treat
          # it as data; interpolating ${{ }} straight into a run block would
          # let a crafted tag execute commands on the runner.
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          REF="$RELEASE_REF"
          git rev-parse -q --verify "refs/tags/$REF" >/dev/null 2>&1 || REF=HEAD
          PREV="$(git describe --tags --abbrev=0 "${REF}^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then RANGE="${PREV}..${REF}"; else RANGE="$REF"; fi

          emit() {
            out="$(git log --no-merges --pretty=format:'%s' $RANGE 2>/dev/null | grep -E "$2" || true)"
            [ -z "$out" ] && return 0
            printf '### %s\n\n' "$1"
            printf '%s\n' "$out" | sed -E 's/^[a-z]+(\([^)]*\))?!?: *//' | sed 's/^/- /'
            printf '\n'
          }

          {
            printf '## What changed\n\n'
            emit "Added"         '^feat(\(|:|!)'
            emit "Fixed"         '^fix(\(|:|!)'
            emit "Documentation" '^docs(\(|:|!)'
            emit "Internal"      '^(chore|refactor|test|ci|build|perf)(\(|:|!)'
            OTHER="$(git log --no-merges --pretty=format:'%s' $RANGE 2>/dev/null | grep -vE '^(feat|fix|docs|chore|refactor|test|ci|build|perf)(\(|:|!)' || true)"
            if [ -n "$OTHER" ]; then
              printf '### Other\n\n'
              printf '%s\n' "$OTHER" | sed 's/^/- /'
              printf '\n'
            fi
            if [ -n "$PREV" ]; then
              printf '**Full diff**: https://github.com/footprintai/containarium/compare/%s...%s\n\n' "$PREV" "$REF"
            fi
            printf -- '---\n\n'
          } > release_changelog.md

          echo "--- generated changelog ---"
          cat release_changelog.md

      - name: Create release notes
        id: release_notes
        env:
          # Untrusted: a tag name may contain shell metacharacters (#1602).
          # The heredoc below stays quoted (<< 'EOF') deliberately — the
          # body has literal backticks (markdown code spans) that an
          # UNQUOTED heredoc would hand to the shell as command
          # substitutions. So github.ref_name can't be expanded into the
          # heredoc at all, quoted or not; it's substituted via bash
          # parameter expansion AFTER the file is written instead, which
          # never re-parses the value as syntax.
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          cat > release_notes.md << 'EOF'
          ## Containarium __RELEASE_REF__

          The open-source, self-hostable, agent-native sandbox.

          ### Binaries

          Four binaries ship in this release:

          | Binary | Where it runs | What it does |
          |---|---|---|
          | `containariumd` | The host | The platform daemon plus host-side admin commands. |
          | `containarium` | Your laptop / CI (linux, macOS, windows) | The client CLI: `create`, `list`, `expose-port`, `ssh-config`, etc. against a server (`--server`). |
          | `mcp-server` | Your laptop | The platform MCP — outside-the-box admin (create_container, list_containers, expose_port, list_backends). Wire it into Claude Code / Cursor. |
          | `agent-box` | Inside each Containarium container | The in-the-box MCP — `shell_exec`, `read_file`, `write_file`, etc. Reached over stdio, typically via SSH. |

          ### Quick install (Linux host)

          ```bash
          curl -fsSL https://raw.githubusercontent.com/footprintai/containarium/main/hacks/install.sh | sudo bash
          ```

          ### Manual install (any binary, any platform)

          ```bash
          # containariumd daemon (Linux x86_64 host)
          curl -L -o /usr/local/bin/containariumd \
            https://github.com/footprintai/containarium/releases/download/__RELEASE_REF__/containariumd-linux-amd64
          chmod +x /usr/local/bin/containariumd
          ln -sf /usr/local/bin/containariumd /usr/local/bin/containarium

          # containarium client CLI (your laptop, e.g. macOS arm64)
          curl -L -o /usr/local/bin/containarium \
            https://github.com/footprintai/containarium/releases/download/__RELEASE_REF__/containarium-darwin-arm64
          chmod +x /usr/local/bin/containarium

          # Windows: the same client CLI (create/list/ssh/… against a remote server)
          # PowerShell:
          #   curl.exe -L -o containarium.exe `
          #     https://github.com/footprintai/containarium/releases/download/__RELEASE_REF__/containarium-windows-amd64.exe

          # platform MCP (your laptop, e.g. macOS arm64)
          curl -L -o /usr/local/bin/mcp-server \
            https://github.com/footprintai/containarium/releases/download/__RELEASE_REF__/mcp-server-darwin-arm64
          chmod +x /usr/local/bin/mcp-server

          # agent-box (drop into your container image, Linux x86_64)
          curl -L -o /usr/local/bin/agent-box \
            https://github.com/footprintai/containarium/releases/download/__RELEASE_REF__/agent-box-linux-amd64
          chmod +x /usr/local/bin/agent-box
          ```

          Verify checksums via `SHA256SUMS.txt`.

          ### SBOMs

          Each Linux binary has an SPDX 2.3 SBOM next to it (`<binary>-linux-amd64.spdx.json`), generated from the shipped file and listed in `SHA256SUMS.txt`. The container images carry their own SBOM and provenance attestations.

          ### Signatures

          Every file on this page has a keyless cosign signature next to it, `<file>.sigstore.json`, made by this release workflow through GitHub OIDC. Verify with `cosign verify-blob --bundle <file>.sigstore.json --certificate-identity https://github.com/__RELEASE_REPOSITORY__/.github/workflows/release.yml@refs/tags/__RELEASE_REF__ --certificate-oidc-issuer https://token.actions.githubusercontent.com <file>`. See `docs/security/VERIFYING-RELEASES.md`.

          ### Kubernetes (Helm)

          Chart version `__CHART_VERSION__` (installs the `__RELEASE_REF__` daemon image):

          ```bash
          helm install containarium oci://ghcr.io/footprintai/charts/containarium-k8s \
            --version __CHART_VERSION__ \
            --set daemon.jwtSecret="$(openssl rand -hex 24)" \
            --set gateway.upstreamKeySecret=sshpiper-upstream-key \
            --set-file gateway.upstreamPublicKey=./sshpiper_upstream.pub
          ```

          ### MCP client setup

          Wire the platform MCP into Claude Code (`~/.claude.json`):

          ```jsonc
          {
            "mcpServers": {
              "containarium": {
                "command": "/usr/local/bin/mcp-server",
                "env": {
                  "CONTAINARIUM_SERVER_URL": "http://your-host:8080",
                  "CONTAINARIUM_JWT_TOKEN": "<your-token>"
                }
              }
            }
          }
          ```

          Wire `agent-box` for in-the-box file/shell ops:

          ```jsonc
          {
            "mcpServers": {
              "containarium-box": {
                "command": "ssh",
                "args": ["user@your-box", "agent-box"]
              }
            }
          }
          ```

          See [README.md](https://github.com/footprintai/containarium#quick-start) for the full agent-native walkthrough.
          EOF

          # Fill in the tag now that the file is written. Bash parameter
          # expansion, not sed: sed would re-parse RELEASE_REF's content
          # against its own delimiter/escape rules, reopening exactly the
          # injection the quoted heredoc above was written to avoid. This
          # substitutes the value as a literal string, full stop.
          notes="$(cat release_notes.md)"
          notes="${notes//__RELEASE_REF__/$RELEASE_REF}"
          notes="${notes//__RELEASE_REPOSITORY__/$RELEASE_REPOSITORY}"
          notes="${notes//__CHART_VERSION__/${RELEASE_REF#v}}"
          printf '%s\n' "$notes" > release_notes.md

          # Changelog first, boilerplate under it — a reader wants to know
          # what changed before they read install instructions (#1600).
          # Wrapped in markers so a workflow rerun REPLACES this block rather
          # than appending a second copy (see "Apply release notes" below).
          {
            printf '%s\n' '<!-- generated-release-notes:start -->'
            cat release_changelog.md
            cat release_notes.md
            printf '%s\n' '<!-- generated-release-notes:end -->'
          } > release_notes.combined.md
          mv release_notes.combined.md release_notes.md

      - name: Verify SHA256SUMS.txt before publishing (#2702)
        # Every checksum must match, and every non-sidecar file this job
        # attaches must be listed. Not listed by design: *.sha256 sidecars,
        # SHA256SUMS.txt itself. The chart is appended later by helm-chart.
        run: |
          cd bin
          sha256sum -c SHA256SUMS.txt
          missing=0
          # The files: list of the next step; best-effort files that were not
          # built (the -macos11 builds) are skipped.
          while read -r f; do
            [ -f "$f" ] || continue
            grep -q "  $f\$" SHA256SUMS.txt || { echo "::error::$f is attached to the Release but not in SHA256SUMS.txt"; missing=1; }
          done < <(awk '/name: Create GitHub Release/{a=1} a&&/files: \|/{b=1;next} b&&/draft:/{exit} b' ../.github/workflows/release.yml \
                   | grep -o 'bin/[^ ]*' | sed 's|^bin/||' | grep -v '\.sha256$' | grep -v '^SHA256SUMS.txt$' | sort -u)
          exit $missing

      - name: Create GitHub Release
        # Tag pushes only. A rehearsal builds every artifact above and stops
        # here — that is the whole point of the workflow_dispatch trigger.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Containarium ${{ github.ref_name }}
          # Deliberately no body/body_path here. This action REPLACES the body
          # on update, which silently destroyed notes an author wrote at
          # publish time (#1600), and append_body instead duplicates the block
          # on any rerun. The body is composed idempotently in the next step.
          files: |
            bin/containarium-linux-amd64
            bin/containarium-darwin-amd64
            bin/containarium-darwin-arm64
            bin/containarium-darwin-amd64-macos11
            bin/containarium-darwin-arm64-macos11
            bin/containarium-windows-amd64.exe
            bin/containariumd-linux-amd64
            bin/containariumd-darwin-amd64
            bin/containariumd-darwin-arm64
            bin/mcp-server-linux-amd64
            bin/mcp-server-darwin-amd64
            bin/mcp-server-darwin-arm64
            bin/agent-box-linux-amd64
            bin/agent-box-darwin-amd64
            bin/agent-box-darwin-arm64
            bin/agent-runtime-bundle.tar.gz
            bin/sdlc-skills.tar.gz
            bin/sdlc-skills.tar.gz.sha256
            bin/caddy-linux-amd64
            bin/containariumd-linux-amd64.spdx.json
            bin/containarium-linux-amd64.spdx.json
            bin/mcp-server-linux-amd64.spdx.json
            bin/agent-box-linux-amd64.spdx.json
            bin/SHA256SUMS.txt
            LICENSE
            NOTICE
          draft: false
          # A tag with a pre-release suffix (v0.101.0-rc.1) is a GitHub
          # pre-release: it is left out of releases/latest, so the daemon's
          # update check and the host install path keep serving the newest
          # full release. Only the dev rung installs an rc, by exact tag.
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Apply release notes
        # Composes the release body idempotently (#1600).
        #
        # Two failure modes this avoids:
        #   - REPLACING the body (what action-gh-release does by default)
        #     silently destroyed notes an author wrote at publish time.
        #   - APPENDING it (append_body: true) duplicates the whole generated
        #     block on any workflow rerun for the same tag.
        #
        # So: strip any previously-generated block by its markers, keep
        # everything else the author put there, and append a fresh block.
        # Rerunning converges on the same body instead of growing it.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          # Untrusted: a tag name may contain shell metacharacters.
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Deliberately NOT tolerant of failure. The release was created by
          # the step above, so a read error here is anomalous — and treating
          # it as "empty body" would overwrite authored notes with generated
          # ones, which is the exact data loss #1600 is about. Fail instead;
          # a rerun is idempotent and safe.
          gh release view "$RELEASE_REF" --json body --jq '.body' > existing_body.md

          # Drop a prior generated block, if this is a rerun.
          python3 - <<'PYEOF' > preserved.md
          import re, sys
          try:
              body = open('existing_body.md').read()
          except FileNotFoundError:
              body = ''
          body = re.sub(
              r'<!-- generated-release-notes:start -->.*?<!-- generated-release-notes:end -->\n?',
              '', body, flags=re.S)
          # write(), not print(): print's trailing newline would make an empty
          # body a 1-byte file that passes the -s test below, producing three
          # blank lines above the generated block.
          sys.stdout.write(body.rstrip())
          PYEOF

          if [ -s preserved.md ]; then
            printf '\n\n' >> preserved.md
          fi
          cat preserved.md release_notes.md > final_body.md

          gh release edit "$RELEASE_REF" --notes-file final_body.md
          echo "release body applied ($(wc -l < final_body.md) lines; preserved $(wc -l < preserved.md) authored)"

  # Air-gapped install bundle (E3a/E3b).
  # Per prd/cloud/air-gapped-install-bundle.md, ship a self-contained
  # tarball for Tier 3 customers with no internet egress. Bundle wraps
  # the per-platform binaries above + toolchains, sidecars, .debs.
  # Runs as a parallel matrix job so the binary release isn't blocked
  # if the bundle build is slow or flaky.
  build-bundle:
    needs: build-and-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: linux, arch: amd64 }
          # arm64 disabled in v0 — `apt-get download` on an amd64 runner
          # pulls amd64 .debs by default. To produce a true arm64 bundle
          # we either need an arm64 runner (gh-hosted larger runners) or
          # cross-arch apt setup. Re-enable when one of those is in
          # place. v0 customer ask is amd64-only.
          # - { os: linux, arch: arm64 }
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'

      - name: Install buf
        # Pinned release binary — see the build-and-release job's "Install
        # buf" step for why this isn't `go install .../buf@latest`.
        run: |
          set -euo pipefail
          ./scripts/install-buf.sh /usr/local/bin/buf
          buf --version

      - name: Install apt-rdepends
        # Needed by scripts/bundle/download-deps.sh to resolve transitive
        # .deb dependencies. Runner is ubuntu-latest so apt is present.
        run: sudo apt-get update && sudo apt-get install -y apt-rdepends

      - name: Compile eBPF network-policy object (#627)
        # Same as the build-and-release job: build the object first so the
        # bundle's containarium binary embeds it (-tags embed_bpf, auto-enabled
        # by the Makefile when internal/netbpf/netpolicy.bpf.o is present).
        run: |
          set -euo pipefail
          sudo apt-get install -y clang llvm libbpf-dev linux-libc-dev
          # bpftool for vmlinux.h (#2637): a pinned static release from
          # github.com/libbpf/bpftool, checksum-verified. Not Ubuntu's
          # linux-tools: on the Azure runner kernels the only thing those
          # packages leave on disk is the linux-tools-common wrapper, which
          # cannot run (proved by runs 39210535656 / 39212425801). Dumping
          # /sys/kernel/btf/vmlinux does not need a kernel-matched binary.
          BPFTOOL_VERSION=v7.6.0
          BPFTOOL_SHA256=51ffd3dd4f46fdc46736433a971e828dc70835c6b18ad20cabffd10abcf00358
          curl -sSfL -o /tmp/bpftool.tar.gz "https://github.com/libbpf/bpftool/releases/download/${BPFTOOL_VERSION}/bpftool-${BPFTOOL_VERSION}-amd64.tar.gz"
          echo "${BPFTOOL_SHA256}  /tmp/bpftool.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/bpftool.tar.gz -C /usr/local/bin bpftool
          sudo chmod 0755 /usr/local/bin/bpftool
          BPFTOOL=/usr/local/bin/bpftool
          echo "bpftool: $BPFTOOL ($("$BPFTOOL" version | head -n1))"
          make build-bpf BPFTOOL="$BPFTOOL"

      - name: Build per-platform binaries
        # build-bundle depends on build-release; calling explicitly so
        # the binary outputs land in bin/ before the bundle script reads
        # them. (The job above only writes binaries to the release page,
        # not to a workflow artifact; we rebuild here.)
        run: make build-release VERSION="${GITHUB_REF_NAME#v}"

      - name: Download bundle dependencies
        run: |
          make bundle-download-deps \
            BUNDLE_OS=${{ matrix.target.os }} \
            BUNDLE_ARCH=${{ matrix.target.arch }}

      - name: Build OTel sidecar (for docker-save into bundle)
        # Best-effort: if the sidecar build fails the bundle still ships,
        # just without the OTel image. Tier 3 customers can add it later.
        run: make sidecar-build-otel || true

      - name: Assemble bundle tarball
        # Untrusted: a tag name may contain shell metacharacters (#1602).
        # Deliberately NOT `make build-bundle BUNDLE_VERSION="$RELEASE_REF"`:
        # that target's recipe (Makefile) does `echo "... $(BUNDLE_VERSION)
        # ..."`, and GNU Make expands $(...) in a command-line-overridden
        # variable wherever a recipe dereferences it — a tag like
        # `v$(shell ...)` would have Make itself execute the shell function,
        # a second injection layer underneath the one env/quoting above
        # already closes at the GitHub Actions shell level. Calling the
        # script directly (what the Makefile target does internally anyway)
        # gives it the value as a real env var, read with bash parameter
        # expansion only — never passed through Make's own macro expansion.
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          chmod +x scripts/bundle/build-bundle.sh
          VERSION="$RELEASE_REF" \
            OS="${{ matrix.target.os }}" \
            ARCH="${{ matrix.target.arch }}" \
            ./scripts/bundle/build-bundle.sh

      - name: List bundle outputs
        run: ls -lh dist/

      - name: Upload bundle to release
        # Tag pushes only — same guard as the Release step in the job above.
        # Without it a rehearsal would still attempt a real upload, which is
        # exactly the accidental publish this trigger is designed to prevent.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          # append_files preserves the binary release uploaded above;
          # without it, this step would overwrite the release files
          # list.
          files: |
            dist/containarium-bundle-${{ github.ref_name }}-${{ matrix.target.os }}-${{ matrix.target.arch }}.tar.gz
            dist/containarium-bundle-${{ github.ref_name }}-${{ matrix.target.os }}-${{ matrix.target.arch }}.tar.gz.sha256
          draft: false
          # A tag with a pre-release suffix (v0.101.0-rc.1) is a GitHub
          # pre-release: it is left out of releases/latest, so the daemon's
          # update check and the host install path keep serving the newest
          # full release. Only the dev rung installs an rc, by exact tag.
          prerelease: ${{ contains(github.ref_name, '-') }}

  # model-gateway credential-proxy image (#1820). The daemon
  # (images/daemon/Dockerfile) and the sidecar images each publish from their
  # own workflow (containarium-daemon.yml, sidecars.yml) on this identical tag
  # trigger; this job lives here instead because the image is small, this
  # repo's release surface already reads this file for "what does a tag
  # publish", and a `push:`-tag-triggered job needs no `needs:` on
  # build-and-release to run — it fires independently, so a slow or failing
  # Publishes the Helm chart for the tag (#2574): stamped with the release
  # version and its exact image tag, pushed to GHCR as an OCI chart and
  # attached to the GitHub Release. A rehearsal packages and renders it and
  # pushes nothing. Independent of the image jobs' success, like them it is
  # job-scoped for packages:write.
  helm-chart:
    runs-on: ubuntu-latest
    needs: build-and-release
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.2

      - name: Derive version
        id: v
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Package chart stamped with the release
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          helm package charts/containarium-k8s \
            --version "${VERSION}" --app-version "v${VERSION}" --destination dist-chart
          ls -l dist-chart

      - name: Render and check the daemon and gateway images
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          rendered="$(helm template containarium "dist-chart/containarium-k8s-${VERSION}.tgz" \
            --set gateway.upstreamKeySecret=release-render-check)"
          grep -q "image: ghcr.io/footprintai/containarium:v${VERSION}\$" <<<"$rendered" || {
            echo "::error::chart does not pin ghcr.io/footprintai/containarium:v${VERSION}"
            exit 1
          }
          grep -q "image: ghcr.io/footprintai/containarium-sshpiper:v${VERSION}\$" <<<"$rendered" || {
            echo "::error::chart does not pin ghcr.io/footprintai/containarium-sshpiper:v${VERSION}"
            exit 1
          }

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push chart (OCI) and attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.v.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm push "dist-chart/containarium-k8s-${VERSION}.tgz" oci://ghcr.io/footprintai/charts
          # SHA256SUMS.txt is already written by build-and-release before this
          # job runs, so the chart ships its own .sha256 (same convention as
          # the SDLC skills and air-gapped bundles) rather than racing a
          # re-upload of that file. Relative name so `sha256sum -c` works
          # from the download directory.
          (cd dist-chart && sha256sum "containarium-k8s-${VERSION}.tgz" > "containarium-k8s-${VERSION}.tgz.sha256")
          gh release upload "${GITHUB_REF_NAME}" \
            "dist-chart/containarium-k8s-${VERSION}.tgz" \
            "dist-chart/containarium-k8s-${VERSION}.tgz.sha256" --clobber

      - name: List the chart in SHA256SUMS.txt (#2702)
        # The sidecar above is kept; this also puts the chart in the one file
        # that claims to cover the release. Fetch, append, re-upload; the
        # build-and-release job is finished by now (needs:), so nothing else
        # is writing that file.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.v.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir sums && cd sums
          gh release download "${GITHUB_REF_NAME}" --pattern SHA256SUMS.txt
          before=$(wc -l < SHA256SUMS.txt)
          # Idempotent on a re-run. grep exits 1 when nothing is left to
          # keep; 2 is a real error and must stop the job.
          grep -vF " containarium-k8s-${VERSION}.tgz" SHA256SUMS.txt > tmp || [ $? -eq 1 ]
          mv tmp SHA256SUMS.txt
          (cd ../dist-chart && sha256sum "containarium-k8s-${VERSION}.tgz") >> SHA256SUMS.txt
          after=$(wc -l < SHA256SUMS.txt)
          # Never upload a truncated list over the real one.
          if [ "$before" -lt 2 ] || [ "$after" -lt "$before" ]; then
            echo "::error::SHA256SUMS.txt shrank ($before -> $after lines); not uploading" >&2
            exit 1
          fi
          # --clobber briefly removes SHA256SUMS.txt from the published
          # Release; if the upload fails it is missing (fails closed).
          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS.txt --clobber

  # image build never blocks the binary release above (same reasoning
  # sidecars.yml gives for keeping its own jobs independent of each other).
  model-gateway-image:
    runs-on: ubuntu-latest
    # Job-scoped, not widened at the workflow level: this is the only job in
    # this file that pushes to GHCR, and a job-level `permissions:` block
    # REPLACES the workflow-level grant for that job rather than adding to
    # it, so build-and-release / build-bundle above keep exactly
    # `contents: write` — no packages:write leaks into jobs that never touch
    # a registry (#1820 review).
    permissions:
      contents: read
      packages: write
      security-events: write   # for the Trivy SARIF upload below
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: tags
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF#refs/tags/v}"
          fi
          # Minor-series moving tag: 0.53.0 -> v0.53
          minor="v$(echo "$version" | cut -d. -f1-2)"
          base="ghcr.io/footprintai/containarium-model-gateway"
          {
            # A pre-release tag (0.101.0-rc.1) pushes only its exact tag:
            # the moving tags keep pointing at the newest full release.
            case "$version" in
              *-*) tags="${base}:v${version}" ;;
              *)   tags="${base}:v${version},${base}:${minor},${base}:latest" ;;
            esac
            echo "tags=${tags}"
            echo "scan_ref=${base}:v${version}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push model-gateway image
        uses: docker/build-push-action@v7
        with:
          # Repo root context: the Dockerfile builds ./cmd/model-gateway.
          context: .
          file: ./images/model-gateway/Dockerfile
          platforms: linux/amd64
          # Push on tag only; a rehearsal builds the image and discards it.
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.tags.outputs.tags }}
          # Build provenance + SBOM, explicit so it's reviewable, matching
          # the daemon and sidecar image jobs. NOTE: this is why the Trivy
          # step below pulls the pushed tag rather than using `load: true`
          # here — buildx's docker-load exporter can't emit a manifest list,
          # and provenance/sbom force one even for a single-platform build.
          provenance: true
          sbom: true

      # This image has no separate PR-validation build, so this only scans
      # on a real release tag — a workflow_dispatch rehearsal doesn't push,
      # so there's nothing to pull and scan.
      - name: Pull published image for scanning
        if: startsWith(github.ref, 'refs/tags/v')
        run: docker pull ${{ steps.tags.outputs.scan_ref }}

      - name: Run Trivy vulnerability scanner (image)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.tags.outputs.scan_ref }}
          format: 'sarif'
          output: 'trivy-model-gateway-results.sarif'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: 'true'
          ignore-unfixed: 'true'
          exit-code: '1'

      - name: Upload Trivy SARIF results
        if: always() && startsWith(github.ref, 'refs/tags/v')
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-model-gateway-results.sarif

  # Signs every file on the Release (#2561). Runs last because the binaries
  # come from build-and-release, the bundle from build-bundle and the chart
  # from helm-chart: signing what the Release actually serves, after all
  # three have uploaded, covers all of it with one identity. Keyless: the
  # job's OIDC token (id-token: write) is exchanged for a short-lived Fulcio
  # certificate naming this workflow at this tag; there is no key to store or
  # rotate. Tag pushes only. A rehearsal would write a public Rekor entry for
  # a build that is not a release, so it stops before this job.
  sign-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-release, build-bundle, helm-chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Download the Release's files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir release-files
          gh release download "$TAG" --dir release-files --pattern '*' --clobber
          # A rerun finds the last run's bundles; they are re-made below.
          rm -f release-files/*.sigstore.json
          ls -l release-files

      - name: Sign and verify every file
        run: scripts/release/sign-assets.sh release-files

      - name: Attach the signatures to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" release-files/*.sigstore.json --clobber

      - name: Verify the uploaded signature bundles and release inventory
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Payloads above were downloaded from this Release. Replace the
          # local signing output with the bundles a consumer actually gets.
          rm -f release-files/*.sigstore.json
          gh release download "$TAG" --dir release-files --pattern '*.sigstore.json'
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/release-metadata.json"
          python3 scripts/release/verify_assets.py release-files \
            --metadata "$RUNNER_TEMP/release-metadata.json" \
            --repository "$GITHUB_REPOSITORY" --tag "$TAG" \
            | tee "$RUNNER_TEMP/release-verification.json"

      - name: Save release verification evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-verification
          path: ${{ runner.temp }}/release-verification.json
