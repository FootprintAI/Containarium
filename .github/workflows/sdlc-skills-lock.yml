name: sdlc-skills-lock

# agent-runtime/sdlc-skills.lock pins the open-sdlc-skills commit and the
# sha256 of the tarball built from it (#2065). This rebuilds the tarball from
# the pinned commit and fails if the digest in the lock does not match, so a
# hand-edited ref or a stale digest cannot reach a release.

on:
  pull_request:
    paths:
      - 'agent-runtime/sdlc-skills.lock'
      - 'scripts/build-sdlc-skills-bundle.sh'
      - 'scripts/install-sdlc-skills.sh'
      - '.github/workflows/sdlc-skills-lock.yml'
  push:
    branches: [main]
    paths:
      - 'agent-runtime/sdlc-skills.lock'
      - 'scripts/build-sdlc-skills-bundle.sh'
      - 'scripts/install-sdlc-skills.sh'
      - '.github/workflows/sdlc-skills-lock.yml'

permissions:
  contents: read

jobs:
  lock:
    name: sdlc-skills lock matches a rebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rebuild from the pinned commit and compare the digest
        run: scripts/build-sdlc-skills-bundle.sh "$RUNNER_TEMP/sdlc"
      - name: Shellcheck the skills scripts
        run: shellcheck scripts/build-sdlc-skills-bundle.sh scripts/install-sdlc-skills.sh
