name: licenses

# Dependency licence gate (#2561). Fails when any Go module linked into a binary
# we ship carries a licence outside the allow-list in scripts/ci/check-licenses.sh
# (policy: docs/security/DEPENDENCY-LICENSES.md). Scoped to what can change the
# answer: the module files, the script and this workflow, plus a weekly run so a
# licence change in an unchanged version's metadata still surfaces.

on:
  push:
    branches: [main]
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'scripts/ci/check-licenses.sh'
      - '.github/workflows/licenses.yml'
  # No `branches:` filter, deliberately (#1215): a base filter leaves stacked
  # PRs with no checks at all. The `paths` filter stays.
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'scripts/ci/check-licenses.sh'
      - '.github/workflows/licenses.yml'
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licenses:
    name: dependency licences
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'

      - name: Install go-licenses
        # Pinned: the report format and its handling of the standard library
        # have changed between releases. The script sets GOROOT, which this
        # version needs to resolve stdlib packages.
        run: go install github.com/google/go-licenses@v1.6.0

      - name: Check licences of every shipped binary's dependency graph
        run: scripts/ci/check-licenses.sh
