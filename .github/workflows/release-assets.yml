name: Release asset verification

on:
  pull_request:
    paths:
      - 'scripts/release/**'
      - '.github/workflows/release-assets.yml'
      - '.github/workflows/release.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/release/**'
      - '.github/workflows/release-assets.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing upstream release tag to verify, e.g. v0.110.0-rc.1'
        type: string
        required: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Release verifier regression tests
        run: python3 -m unittest discover -s scripts/release -p 'test_verify_assets.py' -v

  published-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Download and verify existing published assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir release-files
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-files --pattern '*'
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/release-metadata.json"
          python3 scripts/release/verify_assets.py release-files \
            --metadata "$RUNNER_TEMP/release-metadata.json" \
            --repository "$GITHUB_REPOSITORY" --tag "$TAG" \
            | tee "$RUNNER_TEMP/release-verification.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-verification
          path: ${{ runner.temp }}/release-verification.json
