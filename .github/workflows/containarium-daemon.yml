name: Build daemon image

# Publishes the Containarium daemon image (the control plane the
# containarium-k8s chart deploys) on every release tag, mirroring the sidecar
# images in sidecars.yml. Before this, the chart's daemon.image
# (ghcr.io/footprintai/containarium) was never built by CI — see #1005.
on:
  push:
    tags:
      - 'v*'   # e.g. v0.53.0

  # Rehearsal trigger (#1119 follow-up). A tag push is currently the ONLY
  # way these builds ever run, so the two release incidents this repo has
  # recorded (v0.47.0's Windows cross-compile break, v0.48.0's web-ui build
  # failure) were both invisible until the real release build failed — with a
  # burned tag as the cost. This lets the identical build run on any ref
  # WITHOUT publishing anything.
  #
  # Deliberately publish-free: nothing here pushes an image, uploads an
  # artifact, or creates a Release. Publishing stays exclusively on tag push,
  # so a rehearsal cannot become an accidental release.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build as (without v prefix), e.g. 0.61.0. Build only — publishes nothing.'
        required: false
        default: '0.0.0-dryrun'

permissions:
  contents: read
  packages: write   # for GHCR push
  security-events: write   # for the Trivy SARIF upload below

jobs:
  daemon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: tags
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF#refs/tags/v}"
          fi
          # Minor-series moving tag: 0.53.0 -> v0.53
          minor="v$(echo "$version" | cut -d. -f1-2)"
          base="ghcr.io/footprintai/containarium"
          {
            echo "version=${version}"
            # :latest is the chart default (Chart.yaml appVersion: latest);
            # keep it in sync with the newest release tag.
            # A pre-release tag (0.101.0-rc.1) pushes only its exact tag:
            # the moving tags keep pointing at the newest full release.
            case "$version" in
              *-*) tags="${base}:v${version}" ;;
              *)   tags="${base}:v${version},${base}:${minor},${base}:latest" ;;
            esac
            echo "tags=${tags}"
            echo "scan_ref=${base}:v${version}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push daemon image
        uses: docker/build-push-action@v7
        with:
          # Repo root context: the Dockerfile builds ./cmd/containariumd (#1773).
          context: .
          file: ./images/daemon/Dockerfile
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
          platforms: linux/amd64
          # Push on tag only; a rehearsal builds the image and discards it.
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.tags.outputs.tags }}
          # Build provenance + SBOM (buildx-default on push); explicit so it's
          # reviewable, matching sidecars.yml. NOTE: this is why the Trivy
          # step below pulls the pushed tag rather than using `load: true`
          # here — buildx's docker-load exporter can't emit a manifest list,
          # and provenance/sbom force one even for a single-platform build.
          provenance: true
          sbom: true

      # This image has no separate PR-validation build (unlike agent-box and
      # sshpiper), so this only scans on a real release tag — a
      # workflow_dispatch rehearsal doesn't push, so there's nothing to pull
      # and scan.
      - name: Pull published image for scanning
        if: startsWith(github.ref, 'refs/tags/v')
        run: docker pull ${{ steps.tags.outputs.scan_ref }}

      - name: Run Trivy vulnerability scanner (image)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.tags.outputs.scan_ref }}
          format: 'sarif'
          output: 'trivy-daemon-results.sarif'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: 'true'
          ignore-unfixed: 'true'
          exit-code: '1'

      - name: Upload Trivy SARIF results
        if: always() && startsWith(github.ref, 'refs/tags/v')
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-daemon-results.sarif
