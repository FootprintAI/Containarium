name: Build daemon image

# Publishes the Containarium daemon image (the control plane the
# containarium-k8s chart deploys) on every release tag, mirroring the sidecar
# images in sidecars.yml. Before this, the chart's daemon.image
# (ghcr.io/footprintai/containarium) was never built by CI — see #1005.
on:
  push:
    tags:
      - 'v*'   # e.g. v0.53.0

  # Rehearsal trigger (#1119 follow-up). A tag push is currently the ONLY
  # way these builds ever run, so the two release incidents this repo has
  # recorded (v0.47.0's Windows cross-compile break, v0.48.0's web-ui build
  # failure) were both invisible until the real release build failed — with a
  # burned tag as the cost. This lets the identical build run on any ref
  # WITHOUT publishing anything.
  #
  # Deliberately publish-free: nothing here pushes an image, uploads an
  # artifact, or creates a Release. Publishing stays exclusively on tag push,
  # so a rehearsal cannot become an accidental release.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build as (without v prefix), e.g. 0.61.0. Build only — publishes nothing.'
        required: false
        default: '0.0.0-dryrun'

permissions:
  contents: read

jobs:
  daemon:
    runs-on: ubuntu-latest
    # Job-level: replaces the workflow-level grant for this job. id-token is
    # for the keyless cosign signature only.
    permissions:
      contents: read
      packages: write   # for GHCR push and the signature push
      security-events: write   # for the Trivy SARIF upload
      id-token: write   # cosign keyless (GitHub OIDC -> Fulcio)
    services:
      # Scan registry (#3578): the image is built and pushed here, scanned, and
      # only then copied to GHCR. Nothing reaches GHCR or a signature before the
      # scan has passed.
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          # Lets buildkit reach the job's localhost scan registry (see the services block).
          driver-opts: network=host

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: tags
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION}"
          else
            version="${GITHUB_REF#refs/tags/v}"
          fi
          # Validate BEFORE first use (#3396): a newline would forge extra
          # GITHUB_OUTPUT keys; metacharacters would reach image tags.
          scripts/ci/validate-release-version.sh "${version}"
          # Minor-series moving tag: 0.53.0 -> v0.53
          minor="v$(echo "$version" | cut -d. -f1-2)"
          base="ghcr.io/footprintai/containarium"
          {
            echo "image=${base}"
            echo "version=${version}"
            # :latest is the chart default (Chart.yaml appVersion: latest);
            # keep it in sync with the newest release tag.
            # A pre-release tag (0.101.0-rc.1) pushes only its exact tag:
            # the moving tags keep pointing at the newest full release.
            case "$version" in
              *-*) tags="${base}:v${version}" ;;
              *)   tags="${base}:v${version},${base}:${minor},${base}:latest" ;;
            esac
            echo "tags=${tags}"
            echo "scan_ref=${base}:v${version}"
          } >> "$GITHUB_OUTPUT"

      - name: Build daemon image for scanning
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./images/daemon/Dockerfile
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
          platforms: linux/amd64
          # Always pushed to the job's own scan registry, never to GHCR: the
          # scan below reads this copy, and only a passing scan lets it on.
          # Rehearsals run the same build and scan.
          push: true
          tags: localhost:5000/containarium:scan
          # Same attestations as before; the GHCR copy keeps them byte-for-byte.
          provenance: true
          sbom: true

      - name: Pull the built image for scanning
        run: docker pull localhost:5000/containarium:scan

      # Blocking gate BEFORE any publish or signature (#3578): a fixed
      # CRITICAL/HIGH finding fails the job while the image is still only on the
      # runner. Same flags as before, now on the pre-publish copy.
      - name: Run Trivy vulnerability scanner (image, before publish)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.76.1' # Trivy binary: bump deliberately, not with the action
          image-ref: localhost:5000/containarium:scan
          format: 'sarif'
          output: 'trivy-daemon-results.sarif'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: 'true'
          ignore-unfixed: 'true'
          exit-code: '1'

      - name: Upload Trivy SARIF results
        if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v3
        with:
          sarif_file: trivy-daemon-results.sarif

      # Tag pushes only. Copies the exact manifest (index and attestations) that
      # was scanned to each GHCR tag, by digest, so the published digest is the
      # scanned one. A digest mismatch fails the job before signing.
      - name: Publish the scanned image to GHCR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          SOURCE: localhost:5000/containarium@${{ steps.build.outputs.digest }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          IFS=',' read -ra tag_list <<< "$TAGS"
          args=()
          for t in "${tag_list[@]}"; do args+=(-t "$t"); done
          docker buildx imagetools create "${args[@]}" "$SOURCE"
          for t in "${tag_list[@]}"; do
            got=$(docker buildx imagetools inspect "$t" --format '{{json .Manifest}}' | jq -r '.digest')
            if [ "$got" != "$DIGEST" ]; then
              echo "::error::$t is $got, expected the scanned digest $DIGEST" >&2
              exit 1
            fi
          done

      # Keyless signature of the pushed digest (never a tag), verified in
      # the same step against this workflow at this tag; the job fails if
      # verification does. Tag pushes only, like release.yml's sign-release:
      # a signature is a permanent public Rekor entry, and a rehearsal
      # pushes nothing to sign. See docs/security/VERIFYING-RELEASES.md.
      - name: Sign and verify the image (cosign keyless)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: ./.github/actions/sign-image
        with:
          image: ${{ steps.tags.outputs.image }}
          digest: ${{ steps.build.outputs.digest }}
          workflow-file: containarium-daemon.yml
