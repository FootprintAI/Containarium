name: offline-install-doc

# The air-gapped install guide and README name no release version (#2557): a pinned
# version is stale as soon as the next release is cut. The seeded self-test
# runs first, so a check that can no longer fail turns the lane red.

on:
  push:
    branches: [main]
    paths:
      - 'hacks/offline-install/docs/**'
      - 'hacks/offline-install/README.md'
      - 'hacks/install.sh'
      - 'hacks/offline-install/install.sh'
      - 'scripts/ci/check-install-firewall.sh'
      - 'scripts/ci/check-offline-install-version.sh'
      - '.github/workflows/offline-install-doc.yml'
  # No `branches:` filter — a base filter leaves stacked PRs with no checks
  # at all, which looks the same as checks not having started (#1215).
  pull_request:
    paths:
      - 'hacks/offline-install/docs/**'
      - 'hacks/offline-install/README.md'
      - 'hacks/install.sh'
      - 'hacks/offline-install/install.sh'
      - 'scripts/ci/check-install-firewall.sh'
      - 'scripts/ci/check-offline-install-version.sh'
      - '.github/workflows/offline-install-doc.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-pinned-version:
    name: INSTALL.md names no release version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Self-test (seeded versions must fail)
        run: scripts/ci/check-offline-install-version.sh --self-test

      - name: Check INSTALL.md and README.md
        run: scripts/ci/check-offline-install-version.sh

  firewall-mtls:
    name: installers open 50051 only with --mtls
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Self-test (always-open and never-open installers must fail)
        run: scripts/ci/check-install-firewall.sh --self-test

      - name: Check hacks/install.sh and hacks/offline-install/install.sh
        run: scripts/ci/check-install-firewall.sh
