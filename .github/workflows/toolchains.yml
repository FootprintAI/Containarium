name: Managed toolchains

on:
  pull_request:
    paths:
      - 'scripts/toolchains/**'
      - 'pkg/core/toolchain/**'
      - '.github/workflows/toolchains.yml'
      - '.github/workflows/release.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/toolchains/**'
      - 'pkg/core/toolchain/**'
      - '.github/workflows/toolchains.yml'
      - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Packager and installer behavior tests
        run: python3 -m unittest discover -s scripts/toolchains -p 'test_*.py' -v
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft
        with:
          syft-version: v1.54.1
      - name: Build the pinned release tree and inventory
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          ARCH: ${{ matrix.arch }}
        run: bash scripts/toolchains/package.sh "ci-$GITHUB_SHA" "$ARCH"
      - name: Native tools work without a login shell or root
        if: matrix.arch == 'amd64'
        run: |
          sudo bash dist/toolchains-amd64/install.sh
          sudo su -s /bin/sh nobody -c 'env -i PATH=/opt/containarium/toolchains/current/bin:/usr/bin:/bin sh -c "go version && gofmt -h && node --version && npm --version && pnpm --version && buf --version && protoc --version && staticcheck -version"'
          sudo su -s /bin/sh nobody -c 'env -i PATH=/opt/containarium/toolchains/current/bin:/usr/bin:/bin sh -c "go env GOTOOLCHAIN"' | tee gotoolchain.txt
          test "$(cat gotoolchain.txt)" = local
      - name: Scan managed tools
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master
        with:
          scan-type: fs
          scan-ref: dist/toolchains-${{ matrix.arch }}
          scanners: vuln
          format: json
          output: toolchain-vulnerabilities.json
          severity: HIGH,CRITICAL
          ignore-unfixed: 'true'
          exit-code: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: toolchains-${{ matrix.arch }}
          path: |
            bin/toolchains-*
            toolchain-vulnerabilities.json
