name: Build sidecar images

# Triggered by the same Containarium release tags as the binary
# release workflow. Per docs/PLATFORM-SIDECAR-DESIGN.md decision #4,
# sidecar image versions track the Containarium project release —
# every v*.*.* tag publishes matching sidecar tags.
on:
  push:
    tags:
      - 'v*'   # e.g. v0.16.11

  # Rehearsal trigger (#1119 follow-up). A tag push is currently the ONLY
  # way these builds ever run, so the two release incidents this repo has
  # recorded (v0.47.0's Windows cross-compile break, v0.48.0's web-ui build
  # failure) were both invisible until the real release build failed — with a
  # burned tag as the cost. This lets the identical build run on any ref
  # WITHOUT publishing anything.
  #
  # Deliberately publish-free: nothing here pushes an image, uploads an
  # artifact, or creates a Release. Publishing stays exclusively on tag push,
  # so a rehearsal cannot become an accidental release.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build as (without v prefix), e.g. 0.61.0. Build only — publishes nothing.'
        required: false
        default: '0.0.0-dryrun'

permissions:
  contents: read
  packages: write   # for GHCR push
  security-events: write   # for the Trivy SARIF upload in each job below

jobs:
  otel-sidecar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: tags
        run: |
          # Strip the leading 'v' from the tag to get e.g. 0.16.10
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF#refs/tags/v}"
          fi
          # Derive the minor-series moving tag: 0.16.10 -> v0.16
          minor="v$(echo "$version" | cut -d. -f1-2)"

          base="ghcr.io/footprintai/containarium-otel-sidecar"

          {
            echo "image=${base}"
            echo "version=v${version}"
            echo "minor=${minor}"
            echo "tags=${base}:v${version},${base}:${minor},${base}:latest-stable"
            echo "scan_ref=${base}:v${version}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push otel-sidecar
        uses: docker/build-push-action@v7
        with:
          context: ./sidecars/otel-sidecar
          file: ./sidecars/otel-sidecar/Dockerfile
          # linux/amd64 only for v1 — bare-metal peers may want arm64
          # later but our prod fleet is amd64 today.
          platforms: linux/amd64
          # Push on tag only; a rehearsal builds the image and discards it.
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          # load: true — single-platform build, so load+push together is
          # supported. Keeps the image in the local docker daemon so the
          # Trivy step below can scan the exact image being published
          # (not just a rehearsal stand-in), and still works on a
          # workflow_dispatch rehearsal where push is false.
          load: true
          tags: ${{ steps.tags.outputs.tags }}
          # Build provenance + SBOM are GHA-default for buildx push;
          # explicit so it's reviewable.
          provenance: true
          sbom: true

      # Scans the actual image about to be published (or, on a rehearsal,
      # the identical build that would have been). See agent-box-image.yml
      # for why each flag is set.
      - name: Run Trivy vulnerability scanner (image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.tags.outputs.scan_ref }}
          format: 'sarif'
          output: 'trivy-otel-sidecar-results.sarif'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: 'true'
          ignore-unfixed: 'true'
          exit-code: '1'

      - name: Upload Trivy SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-otel-sidecar-results.sarif

  sshpiper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: tags
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF#refs/tags/v}"
          fi
          minor="v$(echo "$version" | cut -d. -f1-2)"
          base="ghcr.io/footprintai/containarium-sshpiper"
          {
            echo "tags=${base}:v${version},${base}:${minor},${base}:latest-stable"
            echo "scan_ref=${base}:v${version}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push containarium-sshpiper
        uses: docker/build-push-action@v7
        with:
          context: ./images/sshpiper
          file: ./images/sshpiper/Dockerfile
          platforms: linux/amd64
          # Push on tag only; a rehearsal builds the image and discards it.
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          # See the otel-sidecar job above for why load is always on.
          load: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: true
          sbom: true

      # Note: sshpiper-image.yml already scans a build of this same
      # Dockerfile on every PR/push to main — this scans the actual image
      # about to be published on a release tag instead.
      - name: Run Trivy vulnerability scanner (image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.tags.outputs.scan_ref }}
          format: 'sarif'
          output: 'trivy-sshpiper-release-results.sarif'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: 'true'
          ignore-unfixed: 'true'
          exit-code: '1'

      - name: Upload Trivy SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-sshpiper-release-results.sarif

  agent-box:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: tags
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF#refs/tags/v}"
          fi
          minor="v$(echo "$version" | cut -d. -f1-2)"
          base="ghcr.io/footprintai/containarium-agent-box"
          {
            echo "tags=${base}:v${version},${base}:${minor},${base}:latest-stable"
            echo "scan_ref=${base}:v${version}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push containarium-agent-box
        uses: docker/build-push-action@v7
        with:
          # Repo root context: the Dockerfile builds ./cmd/agent-box.
          context: .
          file: ./images/agent-box/Dockerfile
          platforms: linux/amd64
          # Push on tag only; a rehearsal builds the image and discards it.
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          # See the otel-sidecar job above for why load is always on.
          load: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: true
          sbom: true

      # Note: agent-box-image.yml already scans a build of this same
      # Dockerfile on every PR/push to main — this scans the actual image
      # about to be published on a release tag instead.
      - name: Run Trivy vulnerability scanner (image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.tags.outputs.scan_ref }}
          format: 'sarif'
          output: 'trivy-agent-box-release-results.sarif'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: 'true'
          ignore-unfixed: 'true'
          exit-code: '1'

      - name: Upload Trivy SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-agent-box-release-results.sarif
