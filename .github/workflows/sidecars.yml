        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: tags
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF#refs/tags/v}"
          fi
          minor="v$(echo "$version" | cut -d. -f1-2)"
          base="ghcr.io/footprintai/containarium-agent-box"
          {
            # A pre-release tag (0.101.0-rc.1) pushes only its exact tag:
            # the moving tags keep pointing at the newest full release.
            case "$version" in
              *-*) tags="${base}:v${version}" ;;
              *)   tags="${base}:v${version},${base}:${minor},${base}:latest-stable" ;;
            esac
            echo "tags=${tags}"
            echo "scan_ref=${base}:v${version}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push containarium-agent-box
        uses: docker/build-push-action@v7
        with:
          # Repo root context: the Dockerfile builds ./cmd/agent-box.
          context: .
          file: ./images/agent-box/Dockerfile
          platforms: linux/amd64
          # Push on tag only; a rehearsal builds the image and discards it.
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.tags.outputs.tags }}
          # See the otel-sidecar job's comment above for why the Trivy step
          # below pulls the pushed tag instead of using `load: true` here.
          provenance: true
          sbom: true

      # Note: agent-box-image.yml already scans a build of this same
      # Dockerfile on every PR/push to main — this scans the actual image
      # about to be published on a release tag instead. Real tag pushes
      # only, same reasoning as the otel-sidecar job above.
      - name: Pull published image for scanning
        if: startsWith(github.ref, 'refs/tags/v')
        run: docker pull ${{ steps.tags.outputs.scan_ref }}

      - name: Run Trivy vulnerability scanner (image)
        if: startsWith(github.ref, 'refs/tags/v')
